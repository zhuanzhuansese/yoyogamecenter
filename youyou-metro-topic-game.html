<!doctype html>
<html lang="zh-CN" data-page-node-id="6OGWBBKbpBZsNXt4hoHUcR">
<head data-page-node-id="D28Ozln7azE3JxfvEqAgll">
<meta charset="utf-8" data-page-node-id="mxEFddEE0sbTYoaPhfbuP3">
<!-- iPad 上禁掉整页双指缩放/双击放大：地图有自己的缩放，页面缩放会打乱布局 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>佑佑的地铁话题大冒险 · 深圳</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  /* touch-action:manipulation 去掉移动端 300ms 双击缩放延迟 */
  button,.chip,.lg,input,textarea,select{touch-action:manipulation}
  :root{
    --bg:#0A0F1E; --bg2:#0E1428; --panel:#141C33; --panel2:#1A2340;
    --line:#2A3457; --text:#E8EDF9; --muted:#8E9ABF; --accent:#5EEAD4;
    --warn:#FCA5A5; --gold:#FCD34D;
  }
  html,body{height:100%}
  body{
    background:radial-gradient(1200px 700px at 20% -10%,#152046 0%,var(--bg) 60%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    overflow:hidden;
  }
  /* iPad / 手机的 Safari 里 100vh 会把底部工具栏下面的部分也算进去，底部按钮就被挡住了；
     用 100dvh（实际可见高度），老浏览器退回 100vh */
  .app{display:grid;grid-template-rows:auto 1fr;height:100vh;height:100dvh}
  header{
    display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 20px;
    border-bottom:1px solid var(--line);background:rgba(10,15,30,.6);backdrop-filter:blur(8px);
  }
  header h1{font-size:19px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
  header .sub{font-size:12px;color:var(--muted);margin-left:2px}
  header .spacer{flex:1}
  .btn{
    border:1px solid var(--line);background:var(--panel2);color:var(--text);
    padding:7px 14px;border-radius:9px;font-size:13px;cursor:pointer;transition:.15s;
    font-family:inherit;
  }
  .btn:hover{background:#243055;border-color:#3C4A7A}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.primary{background:linear-gradient(180deg,#2DD4BF,#14B8A6);border-color:#2DD4BF;color:#04231F;font-weight:700}
  .btn.primary:hover{filter:brightness(1.08);background:linear-gradient(180deg,#2DD4BF,#14B8A6)}

  main{display:grid;grid-template-columns:1fr 396px;gap:14px;padding:14px;min-height:0;
    padding-bottom:calc(20px + env(safe-area-inset-bottom))}   /* 底部多留一点，按钮不贴边 */
  main > *{min-height:0}
  .map-panel{
    background:linear-gradient(180deg,#CEE7F3,#BEDCEB);
    border:1px solid var(--line);border-radius:16px;position:relative;overflow:hidden;min-height:0;
  }
  /* touch-action:none —— 关掉浏览器原生的滑动/捏合，交给下面的 pointer 事件自己实现
     （单指拖动平移 + 双指捏合缩放），否则 iPad 上双指会把整个页面放大而不是缩放地图 */
  .map-scroll{width:100%;height:100%;overflow:auto;cursor:grab;touch-action:none;-webkit-overflow-scrolling:auto}
  .map-scroll.dragging{cursor:grabbing}
  .map-scroll::-webkit-scrollbar{width:11px;height:11px}
  .map-scroll::-webkit-scrollbar-thumb{background:#2C3860;border-radius:8px;border:2px solid transparent;background-clip:content-box}
  .map-scroll::-webkit-scrollbar-thumb:hover{background:#3C4C80;background-clip:content-box}
  .map-scroll svg{display:block;width:1200px;height:auto}

  .zoombar{
    position:absolute;left:14px;top:12px;display:flex;gap:5px;align-items:center;
    background:rgba(10,15,30,.86);border:1px solid var(--line);border-radius:11px;padding:5px 7px;
    backdrop-filter:blur(6px);z-index:4
  }
  .zoombar button{
    width:29px;height:29px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);
    color:var(--text);font-size:15px;cursor:pointer;line-height:1;font-family:inherit;padding:0
  }
  .zoombar button:hover{background:#243055;border-color:#3C4A7A}
  .zoombar .pct{font-size:11px;color:var(--muted);min-width:42px;text-align:center;font-variant-numeric:tabular-nums}
  .lbl{font-size:12px;fill:#3B3F47;font-weight:500;pointer-events:none;transition:fill .2s,opacity .18s;
    paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round}
  .lbl.hub{fill:#111827;font-weight:700}
  .lbl.cur{fill:#0B6BCB;font-weight:900}
  .lbl.dest{fill:#B07D00;font-weight:900}
  /* 站名尽量都显示，重叠的才由 resolveLabels 隐藏 */
  .lbl.found{fill:#B07D00;font-weight:900;opacity:1}
  .lbl.hide{opacity:0}
  .lbl.hide.show,.lbl.hide.cur,.lbl.hide.dest,.lbl.hide.found{opacity:1}
  .hit{cursor:pointer}
  .lg{cursor:pointer;user-select:none;padding:1px 5px;border-radius:6px;transition:background .15s,color .15s}
  .lg:hover{background:#1B2440;color:#EEF2FA}
  .lg.on{background:#26314F;color:#EEF2FA;box-shadow:inset 0 0 0 1px var(--line)}
  .searchbox{position:absolute;right:14px;bottom:12px;z-index:5;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
  .searchbox input{
    width:150px;padding:7px 10px;border-radius:10px;border:1px solid var(--line);
    background:rgba(10,15,30,.9);color:#EEF2FA;font-size:12px;outline:none;backdrop-filter:blur(6px)
  }
  .searchbox input:focus{border-color:#3C4A7A}
  .searchbox .res{
    width:150px;max-height:190px;overflow:auto;background:rgba(10,15,30,.96);border:1px solid var(--line);
    border-radius:10px;padding:4px;backdrop-filter:blur(6px)
  }
  .searchbox .res div{
    padding:5px 8px;border-radius:7px;font-size:12px;color:#C7D0E8;cursor:pointer;
    display:flex;justify-content:space-between;gap:6px;align-items:center
  }
  .searchbox .res div:hover{background:#1B2440;color:#fff}
  .searchbox .res small{color:#6E7AA0;font-size:10px}
  .searchbox .res .none{padding:6px 8px;font-size:12px;color:#6E7AA0;cursor:default}

  .legend{
    position:absolute;left:14px;bottom:12px;display:flex;gap:14px;flex-wrap:wrap;
    background:rgba(10,15,30,.82);border:1px solid var(--line);border-radius:11px;padding:8px 12px;
    font-size:12px;color:var(--muted);backdrop-filter:blur(6px);
  }
  .legend i{display:inline-block;width:16px;height:4px;border-radius:2px;margin-right:5px;vertical-align:middle}
  .hintbar{
    position:absolute;right:14px;top:12px;background:rgba(10,15,30,.82);border:1px solid var(--line);
    border-radius:11px;padding:8px 12px;font-size:12px;color:var(--muted);backdrop-filter:blur(6px)
  }

  aside{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto;padding-right:2px}
  aside::-webkit-scrollbar{width:8px}
  aside::-webkit-scrollbar-thumb{background:#26304F;border-radius:8px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
  .card h2{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:1.2px;margin-bottom:10px}

  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{background:var(--panel2);border-radius:11px;padding:10px 12px}
  .stat .k{font-size:11px;color:var(--muted);margin-bottom:3px}
  .stat .v{font-size:17px;font-weight:800;letter-spacing:.5px}
  .stat .v small{font-size:11px;color:var(--muted);font-weight:500;margin-left:4px}

  .prevbox{background:var(--panel2);border-radius:11px;padding:11px 12px;border-left:3px solid var(--accent)}
  .prevbox .tag{font-size:15px;font-weight:800;margin-bottom:4px}
  .prevbox .quote{font-size:13px;color:#C4CEE8;line-height:1.5;word-break:break-all}

  textarea{
    width:100%;min-height:82px;resize:vertical;background:#0D1327;color:var(--text);
    border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:15px;line-height:1.6;
    font-family:inherit;outline:none;
  }
  textarea:focus{border-color:#3D5390}
  textarea::placeholder{color:#5C688C}
  .row{display:flex;gap:8px;margin-top:10px;align-items:center}
  .row .btn{padding:11px 18px;font-size:15px;font-weight:700}

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{
    background:#182142;border:1px solid #2C3760;color:#B9C4E2;border-radius:999px;
    padding:5px 11px;font-size:12px;cursor:pointer;transition:.15s;font-family:inherit
  }
  .chip:hover{background:#243055;border-color:#4A5C96;color:#fff}

  .verdict{border-radius:11px;padding:12px;font-size:14px;line-height:1.6;display:none}
  .verdict.ok{display:block;background:rgba(45,212,191,.13);border:1px solid rgba(45,212,191,.42);color:#A7F3E4}
  .verdict.no{display:block;background:rgba(252,165,165,.12);border:1px solid rgba(252,165,165,.4);color:#FECACA}
  .secwarn{
    margin-top:9px;padding:9px 11px;border-radius:10px;font-size:12px;line-height:1.65;
    background:rgba(252,165,165,.12);border:1px solid rgba(252,165,165,.4);color:#FECACA
  }
  .secwarn b{color:#FFF}
  .secwarn code{
    background:rgba(0,0,0,.28);padding:1px 5px;border-radius:5px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;word-break:break-all
  }

  .verdict b{font-weight:800}
  .verdict .sc{
    display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:4px 10px;border-radius:999px;
    background:rgba(252,211,77,.14);border:1px solid rgba(252,211,77,.4);color:var(--gold);
    font-size:12.5px;font-weight:800
  }

  /* 点赞 / 叉叉 大特效（持续 3 秒） */
  .bigmark{
    position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.3);
    font-size:230px;line-height:1;z-index:70;pointer-events:none;opacity:0
  }
  .bigmark.good{color:#FCD34D;filter:drop-shadow(0 0 44px rgba(252,211,77,.7))}
  .bigmark.bad{color:#F87171;filter:drop-shadow(0 0 44px rgba(248,113,113,.7))}
  .bigmark.show{animation:bigmarkIn 3s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes bigmarkIn{
    0%{transform:translate(-50%,-50%) scale(.2) rotate(-20deg);opacity:0}
    10%{transform:translate(-50%,-50%) scale(1.35) rotate(6deg);opacity:1}
    18%{transform:translate(-50%,-50%) scale(.94) rotate(-2deg);opacity:1}
    24%{transform:translate(-50%,-50%) scale(1.05) rotate(0);opacity:1}
    88%{transform:translate(-50%,-50%) scale(1.05) rotate(0);opacity:1}
    100%{transform:translate(-50%,-50%) scale(1.25) rotate(0);opacity:0}
  }

  /* 佑佑的回复气泡 */
  .youyou{
    display:none;align-items:flex-start;gap:8px;margin:2px 0 10px;
    background:rgba(94,234,212,.12);border:1px solid rgba(94,234,212,.4);
    border-radius:12px;padding:9px 12px;font-size:14px;line-height:1.55;color:#D7FFF6
  }
  .youyou.on{display:flex}
  .youyou .who{font-size:19px;line-height:1;margin-top:1px}
  .youyou b{color:var(--accent)}

  /* —— 右侧：纯微信聊天界面 —— */
  aside.wx{
    gap:0;padding:0;overflow:hidden;background:#EDEDED;border-radius:16px;
    border:1px solid var(--line);color:#1A1A1A
  }
  .wx-top{
    flex:none;display:flex;align-items:center;justify-content:center;position:relative;
    height:48px;background:#EDEDED;border-bottom:1px solid #DADADA;font-size:16px;font-weight:600
  }
  .wx-top i{position:absolute;right:16px;font-style:normal;font-size:18px;letter-spacing:1px;color:#333}
  .wchat{
    flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;
    padding:14px 12px;overflow-y:auto
  }
  .wchat::-webkit-scrollbar{width:6px}
  .wchat::-webkit-scrollbar-thumb{background:#C8C8C8;border-radius:6px}
  .wempty{margin:auto;color:#9AA0A6;font-size:13px}
  .wmsg{display:flex;align-items:flex-start;gap:8px}
  .wmsg.me{justify-content:flex-end}
  .wavatar{
    flex:none;width:38px;height:38px;border-radius:6px;background:#fff;
    display:flex;align-items:center;justify-content:center;font-size:21px
  }
  .wbubble{
    max-width:72%;padding:9px 12px;border-radius:6px;font-size:15px;line-height:1.55;
    word-break:break-word;position:relative;color:#1A1A1A
  }
  .wmsg.them .wbubble{background:#FFFFFF}
  .wmsg.me .wbubble{background:#95EC69}
  .wmsg.them .wbubble::before{
    content:"";position:absolute;left:-5px;top:13px;border:6px solid transparent;
    border-right-color:#FFFFFF;border-left:0
  }
  .wmsg.me .wbubble::before{
    content:"";position:absolute;right:-5px;top:13px;border:6px solid transparent;
    border-left-color:#95EC69;border-right:0
  }
  /* 判定结果：像微信的灰色系统提示 */
  .wx .verdict{
    flex:none;margin:0 auto 10px;max-width:88%;padding:7px 12px;border-radius:6px;
    font-size:12.5px;line-height:1.6;text-align:center;border:0;color:#fff;background:rgba(0,0,0,.28)
  }
  .wx .verdict.ok,.wx .verdict.no{color:#fff;border:0}
  .wx .verdict.ok{background:rgba(0,0,0,.28)}
  .wx .verdict.no{background:rgba(196,52,52,.78)}
  .wx .verdict span{color:inherit!important}
  .wx .verdict .sc{background:rgba(255,255,255,.2);border:0;color:#fff;margin-top:4px;padding:2px 9px}
  .wx .secwarn{flex:none;margin:0 10px 8px;background:#FFF1F0;border:1px solid #F5C2C0;color:#8A1F1F}
  .wx .secwarn b{color:#8A1F1F}
  .wx .secwarn code{background:rgba(0,0,0,.06)}
  .wx .chips{flex:none;margin:0 10px 8px}
  /* 微信底部输入栏：只有一个「按住 说话」（小朋友不会打字）；浏览器不支持语音时才退回输入框 */
  aside.wx{position:relative}
  .wx-bar{
    flex:none;position:relative;z-index:21;display:flex;align-items:flex-end;gap:8px;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    background:#F7F7F7;border-top:1px solid #DADADA
  }
  .wx-bar .btn{flex:none;white-space:nowrap;height:40px;padding:0 14px;font-size:15px;font-weight:600;border-radius:6px}
  .wx-hold{
    flex:1;min-width:0;height:48px;border:0;border-radius:8px;background:#FFFFFF;color:#1A1A1A;
    font-size:17px;font-weight:600;letter-spacing:2px;font-family:inherit;cursor:pointer;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none
  }
  .wx-hold.on{background:#C6C6C6}
  .wx-hold:disabled{color:#B0B0B0;cursor:default}
  #input{
    flex:1;min-width:0;height:40px;max-height:120px;resize:none;background:#FFFFFF;color:#1A1A1A;
    border:0;border-radius:6px;padding:8px 10px;font-size:16px;line-height:24px;font-family:inherit
  }
  #input::placeholder{color:#B0B0B0}
  .wx-bar.voice #input,.wx-bar.voice #sayBtn,.wx-bar.kbd .wx-hold{display:none}
  #input:placeholder-shown + #sayBtn{display:none}   /* 像微信：有字才出现「发送」 */
  #sayBtn{background:#07C160;border-color:#07C160;color:#fff}
  #sayBtn:hover{filter:brightness(1.05);background:#07C160}
  /* 按住说话时的浮层：绿色气泡实时显示转出来的文字，上滑变红取消 */
  .wx-rec{
    position:absolute;left:0;right:0;top:0;bottom:0;z-index:20;display:none;flex-direction:column;align-items:center;
    background:rgba(0,0,0,.55);pointer-events:none
  }
  .wx-rec.on{display:flex}
  .wx-rec-bubble{
    margin-top:auto;position:relative;min-width:160px;max-width:84%;min-height:62px;padding:14px 16px;
    border-radius:10px;background:#95EC69;color:#1A1A1A;font-size:16px;line-height:1.55;word-break:break-word;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:background .15s
  }
  .wx-rec-bubble::after{
    content:"";position:absolute;bottom:-7px;left:50%;margin-left:-7px;
    border:7px solid transparent;border-top-color:#95EC69;border-bottom:0
  }
  .wx-rec.cancel .wx-rec-bubble{background:#FA5151;color:#fff}
  .wx-rec.cancel .wx-rec-bubble::after{border-top-color:#FA5151}
  .wx-rec-wave{display:flex;align-items:center;gap:3px;height:22px}
  .wx-rec-wave i{width:3px;height:6px;border-radius:2px;background:currentColor;animation:wxwave .9s ease-in-out infinite}
  .wx-rec-wave i:nth-child(2n){animation-delay:-.3s}
  .wx-rec-wave i:nth-child(3n){animation-delay:-.6s}
  @keyframes wxwave{0%,100%{height:5px}50%{height:20px}}
  .wx-rec-text:empty{display:none}
  .wx-rec-cancel{
    margin-top:48px;width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:24px;transition:transform .15s,background .15s
  }
  .wx-rec.cancel .wx-rec-cancel{background:#fff;color:#FA5151;transform:scale(1.15)}
  .wx-rec-tip{margin:10px 0 14px;color:rgba(255,255,255,.88);font-size:13.5px}

  /* 口语打分卡 */
  .scorebox{display:flex;gap:14px;align-items:center;background:var(--panel2);border-radius:11px;padding:12px}
  .sc-num{
    flex:none;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:26px;font-weight:900;letter-spacing:-1px;
    background:radial-gradient(circle at 35% 30%,#2C3760,#151D36);
    border:3px solid #3A4778;color:#7C89B5;transition:.35s
  }
  .sc-num.on{border-color:var(--gold);color:var(--gold);box-shadow:0 0 18px rgba(252,211,77,.28)}
  .sc-side{flex:1;min-width:0}
  .sc-lv{font-size:15px;font-weight:800;margin-bottom:6px}
  .sc-bar{height:7px;border-radius:99px;background:#202A4C;overflow:hidden}
  .sc-bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#F87171,#FCD34D,#2DD4BF);transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .sc-avg{font-size:11.5px;color:var(--muted);margin-top:6px}
  .sc-stars{font-size:19px;letter-spacing:4px;line-height:1;margin:3px 0 7px;min-height:22px;color:#3A4778}
  .sc-stars .s{display:inline-block;color:var(--gold);text-shadow:0 0 12px rgba(252,211,77,.55)}
  .sc-stars .s.pop{animation:starPop .55s cubic-bezier(.2,1.6,.4,1) both}
  .sc-stars .s.hollow{color:#3A4778;text-shadow:none}
  .sc-stars .hint{font-size:11px;color:#4E5B84;letter-spacing:0}
  @keyframes starPop{0%{transform:scale(0) rotate(-40deg);opacity:0}60%{transform:scale(1.5) rotate(10deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
  .sc-why{font-size:11.5px;color:#8E9ABF;line-height:1.6;margin-top:9px}
  .sc-why b{color:var(--gold)}
  .sc-tip{font-size:11.5px;color:#8E9ABF;line-height:1.6;margin-top:6px}


  .chain{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .chain .n{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:12px}
  .chain .ar{color:#4E5B84;font-size:11px}

  .energy{display:flex;gap:4px;font-size:19px;line-height:1}
  .energy .off{opacity:.2;filter:grayscale(1)}

  .modal{
    position:fixed;inset:0;background:rgba(4,8,20,.78);backdrop-filter:blur(6px);
    display:none;align-items:center;justify-content:center;z-index:50;padding:20px
  }
  .modal.on{display:flex}

  /* 换乘站弹窗（和「地铁聊天小列车」同款：白色面板 + 线路徽标卡片） */
  .ta-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:70}
  .ta-overlay[hidden]{display:none}
  .ta-panel{background:#fff;color:#1f2937;border-radius:24px;padding:22px 26px;width:min(600px,100%);max-height:100%;overflow:auto;text-align:center}
  .ta-panel h2{margin:0 0 10px;font-size:26px}
  .ta-panel button{font:inherit;cursor:pointer;border:none;color:inherit;touch-action:manipulation}

/* 把 null 的坐标插值补齐：在相邻两个已知坐标之间按站序等分 */
(function buildLines(){
  for (const L of Object.values(LINES)){
    const a = L.stations;
    const anchors = [];
    a.forEach((s,i)=>{ if (s[1]!=null && s[2]!=null) anchors.push(i); });
    for (let k=0;k<anchors.length-1;k++){
      const i0=anchors[k], i1=anchors[k+1], span=i1-i0;
      for (let j=i0+1;j<i1;j++){
        const t=(j-i0)/span;
        a[j][1] = +((a[i0][1]) + (a[i1][1]-a[i0][1])*t).toFixed(2);
        a[j][2] = +((a[i0][2]) + (a[i1][2]-a[i0][2])*t).toFixed(2);
        a[j].auto = true;                       // 插值出来的站，画图时可以沿走线重新排开
      }
    }
  }
})();

/* ============ 线路图画法：只走 横 / 竖 / 45° 斜线，拐弯处圆角（像官方线路网络图） ============
   站点和线路数据不变：写了坐标的站、以及所有换乘站，位置固定不动；
   相邻两个固定站之间用「斜线 + 直线」两段走线（已经是横 / 竖 / 45° 的就直接连），
   中间插值出来的站沿走线等距排开。拐点存进 ROUTES，画线、画足迹都用它。 */
const DOT_R = 9.75, HUB_R = 16.25;   // 站名避让用的圆点半径，px
/* 市中心（车公庙—罗湖、深圳北—福田）站点最密：画图时把这一块横竖各拉开一些，
   横向、纵向分开拉伸，所以横线还是横线、竖线还是竖线；海岸线也跟着一起拉 */
const stretch = (v, a, b, k) => v<=a ? v : v>=b ? v+(b-a)*(k-1) : a+(v-a)*k;
const WARP = (x, y) => [stretch(x, 98, 152, 1.7), stretch(y, 60, 100, 1.6)];
const ROUTES = {};                   // lid -> [{x,y,name?}]（坐标单位）
(function octilinear(){
  for (const L of Object.values(LINES)) for (const s of L.stations){ const w=WARP(s[1], s[2]); s[1]=w[0]; s[2]=w[1]; }
  const count = new Map();
  for (const L of Object.values(LINES)) for (const s of L.stations) count.set(s[0], (count.get(s[0])||0)+1);
  const fixed = new Map();
  for (const L of Object.values(LINES)) for (const s of L.stations) if (!s.auto && !fixed.has(s[0])) fixed.set(s[0], [s[1], s[2]]);
  // 换乘站在每条线里用同一个坐标
  for (const L of Object.values(LINES)) for (const s of L.stations)
    if (count.get(s[0])>1 && fixed.has(s[0])) { s[1]=fixed.get(s[0])[0]; s[2]=fixed.get(s[0])[1]; }
  const isFixed = s => !s.auto || count.get(s[0])>1;
  const anchors = [...fixed.entries()];
  const drawn = [];                  // 已画好的其他线路线段，新线尽量别贴上去
  const segDist = (p, a, b) => {
    const dx=b[0]-a[0], dy=b[1]-a[1], L=dx*dx+dy*dy;
    const t = L ? Math.max(0, Math.min(1, ((p[0]-a[0])*dx + (p[1]-a[1])*dy)/L)) : 0;
    return Math.hypot(p[0]-a[0]-t*dx, p[1]-a[1]-t*dy);
  };
  const turn = (u, v) => {
    const d = Math.abs(Math.atan2(u[0]*v[1]-u[1]*v[0], u[0]*v[0]+u[1]*v[1]))*180/Math.PI;
    return d<1 ? 0 : d<46 ? 1 : d<91 ? 3 : 8;
  };
  for (const [lid, L] of Object.entries(LINES)){
    const a = L.stations, own = new Set(a.map(s=>s[0]));
    const pts = [{x:a[0][1], y:a[0][2], name:a[0][0]}];
    let i0 = 0;
    for (let i1=1; i1<a.length; i1++){
      if (!isFixed(a[i1]) && i1<a.length-1) continue;
      const A=[a[i0][1], a[i0][2]], B=[a[i1][1], a[i1][2]];
      const dx=B[0]-A[0], dy=B[1]-A[1];
      const ang = Math.abs(Math.atan2(dy, dx)*180/Math.PI) % 45, off = Math.min(ang, 45-ang);
      let poly = [A, B];
      if (off > 2){
        const sx=Math.sign(dx), sy=Math.sign(dy), m=Math.min(Math.abs(dx), Math.abs(dy));
        const prev = pts.length>1 ? [pts.at(-1).x-pts.at(-2).x, pts.at(-1).y-pts.at(-2).y] : null;
        let best = null;
        for (const X of [[A[0]+sx*m, A[1]+sy*m], [B[0]-sx*m, B[1]-sy*m]]){
          let pen = prev ? turn(prev, [X[0]-A[0], X[1]-A[1]]) : 0;
          for (const [n, q] of anchors)        // 别从别的线的站上穿过
            if (!own.has(n) && Math.min(segDist(q, A, X), segDist(q, X, B)) < 1.4) pen += 6;
          for (const t of [.2,.4,.6,.8]) for (const [P0, P1] of [[A, X], [X, B]]){
            const q=[P0[0]+(P1[0]-P0[0])*t, P0[1]+(P1[1]-P0[1])*t];
            if (drawn.some(([u, v]) => segDist(q, u, v) < 0.5)) pen += 2;   // 别和别的线叠在一起
          }
          if (!best || pen < best.pen) best = {pen, X};
        }
        poly = [A, best.X, B];
      }
      // 中间的站沿走线等距排开
      const lens = []; let T = 0;
      for (let k=1; k<poly.length; k++){ const l=Math.hypot(poly[k][0]-poly[k-1][0], poly[k][1]-poly[k-1][1]); lens.push(l); T+=l; }
      const at = t => { let k=0; while (k<lens.length-1 && t>lens[k]){ t-=lens[k]; k++; }
        const f = lens[k] ? t/lens[k] : 0; return [poly[k][0]+(poly[k+1][0]-poly[k][0])*f, poly[k][1]+(poly[k+1][1]-poly[k][1])*f]; };
      const ev = [];
      for (let k=1; k<poly.length-1; k++) ev.push({t:lens.slice(0,k).reduce((u,v)=>u+v,0), x:poly[k][0], y:poly[k][1]});
      const span = i1-i0;
      for (let j=1; j<span; j++){
        const s=a[i0+j], q=at(T*j/span);
        s[1]=+q[0].toFixed(3); s[2]=+q[1].toFixed(3);
        ev.push({t:T*j/span, x:s[1], y:s[2], name:s[0]});
      }
      ev.sort((u, v) => u.t-v.t);
      pts.push(...ev.map(({x, y, name}) => name ? {x, y, name} : {x, y}), {x:B[0], y:B[1], name:a[i1][0]});
      i0 = i1;
    }
    ROUTES[lid] = pts;
    for (let k=1; k<pts.length; k++) drawn.push([[pts[k-1].x, pts[k-1].y], [pts[k].x, pts[k].y]]);
  }
})();

function bfs(from){
  const dist = new Map([[from,0]]); const q=[from];
  while(q.length){
    const c=q.shift();
    for(const n of (adj.get(c)||[])) if(!dist.has(n)){ dist.set(n,dist.get(c)+1); q.push(n); }
  }

}

/* 深圳地铁官方线路图式样：直线段 + 转角圆角（直线走站间，只在转弯处圆滑，不把整条线画成曲线） */
function schematicPath(pts, r){
  const n=pts.length;
  if(n<2) return '';
  if(n===2) return `M ${pts[0].x} ${pts[0].y} L ${pts[1].x} ${pts[1].y}`;
  let d=`M ${pts[0].x} ${pts[0].y}`;
  for(let i=1;i<n-1;i++){
    const a=pts[i-1], b=pts[i], c=pts[i+1];
    const la=Math.hypot(a.x-b.x, a.y-b.y)||1;
    const lc=Math.hypot(c.x-b.x, c.y-b.y)||1;
    const ra=Math.min(r, la/2);
    const rc=Math.min(r, lc/2);
    const ax=b.x+(a.x-b.x)/la*ra, ay=b.y+(a.y-b.y)/la*ra;
    const cx=b.x+(c.x-b.x)/lc*rc, cy=b.y+(c.y-b.y)/lc*rc;
    d+=` L ${ax.toFixed(1)} ${ay.toFixed(1)} Q ${b.x.toFixed(1)} ${b.y.toFixed(1)} ${cx.toFixed(1)} ${cy.toFixed(1)}`;
  }
  d+=` L ${pts[n-1].x} ${pts[n-1].y}`;
  return d;
}

function scoreUtterance(text){
  const t=(text||'').trim();
  const n=[...t].length;
  const parts=[];

  // 实词 = 命中的话题词 + 命中的描述词
  const topicWords=[...new Set(matchTopics(t).map(h=>h.word))];
  const content=new Set(topicWords);
  const descs=[];
  for (const g of DESC_GROUPS){
    const hit=g.w.find(w=>t.includes(w));
    if (hit){ descs.push(g.label); content.add(hit); }
  }
  const distinct=content.size;

  // 重复啰嗦：同一个词说了好几遍
  let extra=0;
  for (const w of topicWords){
    let c=0,i=0; while((i=t.indexOf(w,i))!==-1){ c++; i+=w.length; }
    if (c>1) extra += c-1;
  }
  const onlyOne = distinct<=1 && n>=4;

  // 分值标定（对着锚点调出来的）：
  //   「蚂蚁蚂蚁蚂蚁」→ 60    「蚂蚁六条腿」→ 80    描述越丰富越往上，99 封顶
  let s=50;
  let lenV, lenK;
  if (n<=3){       lenV=-10; lenK='只有 '+n+' 个字，太短啦'; }
  else if (n<=6){  lenV=10;  lenK='说了 '+n+' 个字'; }
  else if (n<=10){ lenV=12;  lenK='说了 '+n+' 个字，是一句完整的话'; }
  else if (n<=16){ lenV=13;  lenK='说了 '+n+' 个字，挺长的一句'; }
  else if (n<=22){ lenV=14;  lenK='说了 '+n+' 个字，好长的一句'; }
  else if (n<=30){ lenV=16;  lenK='说了 '+n+' 个字，讲得好多呀'; }
  else {           lenV=18;  lenK='说了 '+n+' 个字，简直是长故事'; }
  s+=lenV; parts.push({v:lenV, k:lenK});

  const dv=Math.min(13, distinct*3);
  s+=dv; parts.push({v:dv, k:'用了 '+distinct+' 个不同的词'});

  if (descs.length){
    const dsv=Math.min(12, +(descs.length*3.2).toFixed(1));
    s+=dsv; parts.push({v:dsv, k:'多说了'+descs.join('、')});
  }
  const hasLink=LINK_WORDS.some(w=>t.includes(w));
  if (hasLink){ s+=4; parts.push({v:4,k:'把话连成了一句'}); }
  s+=5;   // 能进站就说明和话题相关

  if (extra){ const p=-Math.min(12, extra*3); s+=p; parts.push({v:p,k:'同一个词重复了好几遍'}); }
  if (onlyOne){ s-=2; parts.push({v:-2,k:'整句基本只有一个词'}); }

  s=Math.max(0,Math.min(100,Math.round(s)));
  const lv = s>=90?{t:'表达小达人',e:'🌟'} : s>=80?{t:'说得很清楚',e:'🎉'}
           : s>=70?{t:'不错哦',e:'👍'}     : s>=60?{t:'勉强及格',e:'🙂'}
                  :{t:'再试试多说一点',e:'🌱'};
  return {score:s, level:lv.t, emoji:lv.e, parts, descs, distinct, chars:n};
}

  try{ o=JSON.parse(txt); }catch(_){ const m=txt.match(/"score"\s*:\s*(\d+)/); if(m) o={score:+m[1]}; }
  if(!o || typeof o.score!=='number') throw new Error('返回格式不对');
  const s=Math.max(0,Math.min(100,Math.round(o.score)));

}

function levelOf(s){

function isRepeat(text){
  const t=text.trim(); if(t.length<2) return false;
  for (const l of state.log){

    if (t===p) return true;

/* ============================ 深圳地图背景（卡通风格） ============================ */

  let h = '';

  h += `<rect x="${px(-40)}" y="${px(-40)}" width="${px(360)}" height="${px(270)}" fill="#F6F7F8"/>`;
  const sea = [[-40,220],[300,220],[300,130],[232,137],[206,126],[176,115],[146,108],[116,105],[86,107],[56,110],[30,115],[12,123],[0,119],[-40,119]];
  h += `<polygon points="${poly(sea)}" fill="#D4ECF7"/>`;
  const land = [[0,16],[42,9],[92,7],[142,9],[192,11],[238,18],[240,48],[238,88],[236,120],[232,137],
                [206,126],[176,115],[146,108],[116,105],[86,107],[56,110],[30,115],[12,123],[0,119],[0,60]];
  h += `<polygon points="${poly(land)}" fill="#FFFFFF" stroke="#C9E3EF" stroke-width="3" stroke-linejoin="round"/>`;
  for (const [name,x0,y0,size] of [['东莞',60,-6,26],['惠州',200,-4,26],['深圳湾',36,140,22],['大鹏湾',214,150,22],['香港',120,150,22]]){
    const [x,y]=WARP(x0,y0);

/* ============================ 地图渲染 ============================ */
/* 并排画法：两条线走同一段时（比如 4 号线和 10 号线的 福田口岸—福民），像官方图那样一条挨一条并排画，不叠在一起 */
const LINE_W = 7;
let DRAW = null;                     // lid -> 并排偏移后的折线点（px）
const SEGS = [];                     // 所有画出来的线段（px），站名避让用
function buildDraw(){
  const lids = Object.keys(LINES), px = lid => ROUTES[lid].map(q=>({x:q.x*S, y:q.y*S, name:q.name}));
  const segs = [];
  for (const lid of lids){
    const p = px(lid);
    for (let i=1; i<p.length; i++){
      const a=p[i-1], b=p[i], L=Math.hypot(b.x-a.x, b.y-a.y); if (!L) continue;
      let dx=(b.x-a.x)/L, dy=(b.y-a.y)/L;
      if (dx<-1e-6 || (Math.abs(dx)<1e-6 && dy<0)){ dx=-dx; dy=-dy; }
      segs.push({lid, i, a, b, dx, dy, group:new Set([lid])});
    }
  }
  for (let m=0; m<segs.length; m++) for (let n=m+1; n<segs.length; n++){
    const s=segs[m], t=segs[n];
    if (s.lid===t.lid || Math.abs(s.dx*t.dy-s.dy*t.dx)>1e-3) continue;
    if (Math.abs(s.dx*(t.a.y-s.a.y)-s.dy*(t.a.x-s.a.x))>1) continue;          // 不在一条直线上
    const pr = q => (q.x-s.a.x)*s.dx+(q.y-s.a.y)*s.dy;
    const ov = Math.min(Math.max(pr(s.a),pr(s.b)), Math.max(pr(t.a),pr(t.b))) - Math.max(Math.min(pr(s.a),pr(s.b)), Math.min(pr(t.a),pr(t.b)));
    if (ov>2){ s.group.add(t.lid); t.group.add(s.lid); }
  }
  const out = {};
  for (const lid of lids){
    const p = px(lid), segAt = new Map(segs.filter(s=>s.lid===lid).map(s=>[s.i, s]));
    const off = s => { if (!s) return null;
      const g=[...s.group].sort((u,v)=>lids.indexOf(u)-lids.indexOf(v)), o=(g.indexOf(lid)-(g.length-1)/2)*LINE_W;
      return {x:-s.dy*o, y:s.dx*o, s}; };
    const res = [];
    for (let i=0; i<p.length; i++){
      const A=off(segAt.get(i)), B=off(segAt.get(i+1)), q=p[i];
      if (!A || !B || (Math.abs(A.x-B.x)<1e-6 && Math.abs(A.y-B.y)<1e-6)){ const o=A||B||{x:0,y:0}; res.push({x:q.x+o.x, y:q.y+o.y, name:q.name}); continue; }
      const det = -A.s.dx*B.s.dy + A.s.dy*B.s.dx;
      if (Math.abs(det)<1e-6){ res.push({x:q.x+A.x, y:q.y+A.y, name:q.name}, {x:q.x+B.x, y:q.y+B.y}); continue; }
      const wx=B.x-A.x, wy=B.y-A.y, t=(wx*-B.s.dy - wy*-B.s.dx)/det;
      res.push({x:q.x+A.x+t*A.s.dx, y:q.y+A.y+t*A.s.dy, name:q.name});
    }
    out[lid] = res;
  }
  for (const s of segs) SEGS.push(s);
  return out;
}
/* 换乘图标：白底圆角方块 + 两个绕圈的小箭头（官方图的换乘站符号） */
const hubIcon = (x, y) => `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})">
  <rect x="-9" y="-9" width="18" height="18" rx="5" fill="#FFFFFF" stroke="#2B2F36" stroke-width="2"/>
  <path d="M-4.6 -1.2 A4.8 4.8 0 0 1 3.6 -3.2 M4.6 1.2 A4.8 4.8 0 0 1 -3.6 3.2" fill="none" stroke="#2B2F36" stroke-width="1.6"/>
  <path d="M2 -5.6 L4.6 -3 L1.4 -1.9 Z M-2 5.6 L-4.6 3 L-1.4 1.9 Z" fill="#2B2F36"/></g>`;
const BADGES = [];                   // 线路首末站的「N号线」色块（px 盒子），站名避让用
/* 站名候选位置：官方线路图会把站名摆在站点的 8 个方向之一，哪边空往哪边放。
   resolveLabels() 从上往下试，第一个不压线、不压站、不撞别的站名的就用。 */
function labelCandidates(st, far){
  const o = (st.lines.length>1 ? 11 : 7) * (far ? 1.9 : 1) + 3;
  const arr = LINES[st.lines[0]].stations;
  const i = arr.findIndex(s=>s[0]===st.name);
  const a = arr[i-1]||arr[i+1], b = arr[i+1]||arr[i-1];
  const horiz = Math.abs(b[1]-a[1]) > Math.abs(b[2]-a[2]);
  const up={dx:0,dy:-o,anchor:'middle',base:'auto'}, down={dx:0,dy:o+10,anchor:'middle'},
        right={dx:o,dy:4,anchor:'start'}, left={dx:-o,dy:4,anchor:'end'},
        ur={dx:o*.75,dy:-o*.75,anchor:'start'}, ul={dx:-o*.75,dy:-o*.75,anchor:'end'},
        dr={dx:o*.75,dy:o*.75+9,anchor:'start'}, dl={dx:-o*.75,dy:o*.75+9,anchor:'end'};
  return horiz ? [up, down, ur, dr, ul, dl, right, left] : [right, left, ur, ul, dr, dl, up, down];
}
function labelPos(st){ return labelCandidates(st)[0]; }
function renderMap(){
  if (!DRAW) DRAW = buildDraw();
  BADGES.length = 0;
  const p=[];
  p.push(bgSvg());
  p.push(`<g id="trail"></g>`);
  for (const [lid,L] of Object.entries(LINES)){
    p.push(`<g data-line="${lid}">`);
    p.push(`<path d="${schematicPath(DRAW[lid], 16)}" fill="none" stroke="${L.color}" stroke-width="${LINE_W}" stroke-linecap="round" stroke-linejoin="round"/>`);
    for (const q of DRAW[lid]){
      if (!q.name || stationMap.get(q.name).lines.length>1) continue;
      const end = TERMINI.has(q.name);
      p.push(`<circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="${end?5.5:4.3}" fill="#FFFFFF" stroke="#2B2F36" stroke-width="${end?3:1.6}"/>`);
    }
    // 首末站外侧放「N号线」色块；放不下（会压到别的线、站或色块）就不放，免得市中心更挤
    const R = DRAW[lid], short = L.name.replace(/（.*）/, '');
    for (const [e, f] of [[R[0], R[1]], [R[R.length-1], R[R.length-2]]]){
      const L2=Math.hypot(e.x-f.x, e.y-f.y)||1, w=short.length*11+10;
      let cx, cy, ok=false;
      for (const k of [1, 1.8]){
        cx=e.x+(e.x-f.x)/L2*(w/2+16)*k; cy=e.y+(e.y-f.y)/L2*20*k;
        const box={left:cx-w/2, right:cx+w/2, top:cy-10, bottom:cy+10};
        ok = !BADGES.some(b=>b.left<box.right && b.right>box.left && b.top<box.bottom && b.bottom>box.top)
          && !SEGS.some(s=>boxHitsSeg(box, s, 1))
          && ![...stationMap.values()].some(st=>{ const x=st.x*S, y=st.y*S; return x+7>box.left && x-7<box.right && y+7>box.top && y-7<box.bottom; });
        if (ok) break;
      }
      if (!ok) continue;
      BADGES.push({left:cx-w/2, right:cx+w/2, top:cy-10, bottom:cy+10});
      p.push(`<g class="badge"><rect x="${(cx-w/2).toFixed(1)}" y="${(cy-10).toFixed(1)}" width="${w}" height="20" rx="5" fill="${L.color}"/>`+
             `<text x="${cx.toFixed(1)}" y="${(cy+4.5).toFixed(1)}" text-anchor="middle" font-size="12.5" font-weight="800" fill="#FFFFFF">${short}</text></g>`);
    }
    p.push(`</g>`);
  }
  for (const st of stationMap.values()) if (st.lines.length>1) p.push(hubIcon(st.x*S, st.y*S));
  for (const st of stationMap.values()){
    const lp = labelPos(st);
    p.push(`<text class="lbl ${st.lines.length>1?'hub':''}" data-name="${st.name}" x="${st.x*S+lp.dx}" y="${st.y*S+lp.dy}" text-anchor="${lp.anchor}">${st.name}</text>`);
  }
  p.push(`<g id="rings"></g><g id="me"></g><g id="train"></g><g id="fx"></g>`);
  for (const st of stationMap.values()){
    // hitR 由"到最近邻站距离的一半"算出 → 任意两站的热区都不会重叠，点谁中谁
    p.push(`<circle class="hit" data-name="${st.name}" cx="${st.x*S}" cy="${st.y*S}" r="${st.hitR}" fill="transparent"/>`);
  }
  const svg = document.getElementById('map');
  svg.setAttribute('viewBox', `${MAPX} ${MAPY} ${MAPW} ${MAPH}`);
  svg.innerHTML = p.join('');
  resolveLabels();

  document.getElementById('legend').innerHTML = Object.entries(LINES)
    .map(([lid,L])=>`<span class="lg" data-line="${lid}" title="只看${L.name}"><i style="background:${L.color}"></i>${L.name}</span>`).join('')
    + `<span class="lg" data-line="ALL" title="显示全部线路"><i style="background:#EEF2FA"></i>全部</span>`;
  applyLineFilter();
}

/* 站名防重叠：绕着站点试 8 个方向（再试远一圈），不压线、不压站点、不撞别的站名；
   实在放不下才隐藏（换乘站/终点站优先），隐藏的仍可通过搜索 / 点到站点时显示出来 */
function labelBox(name, lp, cx, cy){
  const w=[...name].length*12.5+4, h=14;
  const x=cx+lp.dx, y=cy+lp.dy;
  const left = lp.anchor==='middle' ? x-w/2 : (lp.anchor==='end' ? x-w : x);
  return {left, right:left+w, top:y-h+2, bottom:y+3};
}
function boxHitsSeg(b, s, pad){         // 线段是否穿过（外扩 pad 的）站名盒子：Liang–Barsky 裁剪
  const x0=b.left-pad, x1=b.right+pad, y0=b.top-pad, y1=b.bottom+pad;
  const dx=s.b.x-s.a.x, dy=s.b.y-s.a.y; let t0=0, t1=1;
  for (const [pp, qq] of [[-dx, s.a.x-x0], [dx, x1-s.a.x], [-dy, s.a.y-y0], [dy, y1-s.a.y]]){
    if (pp===0){ if (qq<0) return false; continue; }
    const r=qq/pp;
    if (pp<0){ if (r>t1) return false; if (r>t0) t0=r; } else { if (r<t0) return false; if (r<t1) t1=r; }
  }
  return true;
}
function resolveLabels(){
  const els=[...document.querySelectorAll('#map .lbl')];
  els.forEach(el=>el.classList.remove('hide'));
  const items=els.map(el=>{
    const name=el.dataset.name, st=stationMap.get(name);
    return { el, st, name, pri:(st?st.lines.length:0)*10 + (TERMINI.has(name)?5:0) };
  });
  items.sort((a,b)=> (b.pri-a.pri) || (a.st.x-b.st.x) || (a.st.y-b.st.y));
  const placed=[...BADGES];
  const dots=[...stationMap.values()].map(st=>({st, r:st.lines.length>1?10:5.5}));
  const overlaps=(a,b)=> a.left<b.right && a.right>b.left && a.top<b.bottom && a.bottom>b.top;
  for (const it of items){
    const cx=it.st.x*S, cy=it.st.y*S;
    let put=null;
    // 先找不压线的位置；实在没有，才允许压线（站名有白色描边，压线也看得清），但绝不压站点和别的站名
    for (const [far, strict] of [[false, true], [true, true], [false, false], [true, false]]){
      for (const lp of labelCandidates(it.st, far)){
        const box=labelBox(it.name, lp, cx, cy);
        if (placed.some(p=>overlaps(box,p))) continue;
        if (dots.some(d=>{ const x=d.st.x*S, y=d.st.y*S; return x+d.r>box.left && x-d.r<box.right && y+d.r>box.top && y-d.r<box.bottom; })) continue;
        if (strict && SEGS.some(s=>boxHitsSeg(box, s, 2))) continue;
        put={lp, box}; break;
      }
      if (put) break;
    }
    if (!put){ it.el.classList.add('hide'); continue; }
    it.el.setAttribute('x', cx+put.lp.dx);
    it.el.setAttribute('y', cy+put.lp.dy);
    it.el.setAttribute('text-anchor', put.lp.anchor);
    placed.push(put.box);
  }
}

/* 线路筛选：点图例只看一条线 */
let lineFilter = 'ALL';
function applyLineFilter(){
  document.querySelectorAll('#map g[data-line]').forEach(g=>{
    g.style.opacity = (lineFilter==='ALL' || g.dataset.line===lineFilter) ? '1' : '0.12';
  });
  document.querySelectorAll('#legend .lg').forEach(el=>{
    el.classList.toggle('on', el.dataset.line===lineFilter);
  });
}

/* 足迹沿着线路图上真实的走线画（含拐点），而不是两站之间直接连线 */
function edgePts(a, b){
  for (const R of Object.values(ROUTES)){
    const ia=R.findIndex(q=>q.name===a), ib=R.findIndex(q=>q.name===b);
    if (ia<0 || ib<0 || Math.abs(ia-ib)<1) continue;
    const seg=R.slice(Math.min(ia,ib), Math.max(ia,ib)+1);
    if (seg.filter(q=>q.name).length===2) return ia<ib ? seg : seg.reverse();
  }
  return [stationMap.get(a), stationMap.get(b)];
}
function updateMap(){
  const rings=document.getElementById('rings'), me=document.getElementById('me'), trail=document.getElementById('trail');
  let r='',m='',t='';
  const tpts=[];
  state.path.forEach((n,k)=>{ const seg = k ? edgePts(state.path[k-1], n) : [stationMap.get(n)];
    for (const q of (k ? seg.slice(1) : seg)) tpts.push({x:q.x*S, y:q.y*S}); });
  t=`<path d="${schematicPath(tpts, 18)}" fill="none" stroke="#F59E0B" stroke-opacity="0.45" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>`;
  trail.innerHTML=t;

  if (state.phase==='play'){
    const nx=nextStation();
    if (nx) r+=`<circle cx="${nx.x*S}" cy="${nx.y*S}" r="19" fill="none" stroke="#0B6BCB" stroke-opacity=".75" stroke-width="3.5" stroke-dasharray="7 7"><animate attributeName="r" values="17;24;17" dur="1.7s" repeatCount="indefinite"/></circle>`;
  }
  if (state.dest){
    const d=stationMap.get(state.dest);
    r+=`<text x="${d.x*S}" y="${d.y*S-26}" text-anchor="middle" font-size="32">🎯</text>`;
  }
  if (state.cur){
    const c=stationMap.get(state.cur);
    m+=`<circle cx="${c.x*S}" cy="${c.y*S}" r="21" fill="${LINES[state.line].color}" fill-opacity=".3"><animate attributeName="r" values="17;29;17" dur="1.7s" repeatCount="indefinite"/></circle>`;
    m+=`<circle cx="${c.x*S}" cy="${c.y*S}" r="15" fill="#FFFFFF" stroke="${LINES[state.line].color}" stroke-width="5"/>`;
    m+=`<text x="${c.x*S}" y="${c.y*S-28}" text-anchor="middle" font-size="32">🚇</text>`;
  }
  rings.innerHTML=r; me.innerHTML=m;
  document.querySelectorAll('.lbl').forEach(el=>{
    el.classList.toggle('cur', el.dataset.name===state.cur);
    el.classList.toggle('dest', el.dataset.name===state.dest);
  });
}

/* ============================ 行程逻辑 ============================ */
function chooseDir(cur,lid,dest){
  const arr=lineArr(lid); const i=arr.indexOf(cur); const opts=[];
  if (i>0) opts.push(-1);
  if (i<arr.length-1) opts.push(1);
  if (opts.length===1) return opts[0];
  const cost=d=>{ const e=stationMap.get(d===1?arr[arr.length-1]:arr[0]); const t=stationMap.get(dest); return (e.x-t.x)**2+(e.y-t.y)**2; };
  return opts.sort((a,b)=>cost(a)-cost(b))[0];
}
function nextStation(){
  if (state.phase!=='play') return null;
  const arr=lineArr(state.line); let i=arr.indexOf(state.cur)+state.dir;
  if (i<0||i>=arr.length) i=arr.indexOf(state.cur)-state.dir;
  return stationMap.get(arr[i]);
}
function startAt(name){
  const st=stationMap.get(name);
  const lid = st.lines.slice().sort((a,b)=>lineArr(b).length-lineArr(a).length)[0];
  const dist=bfs(name);
  // 站点变多后，目的地控制在 8~20 站之间，太近没得玩、太远容易半路没电
  const good=[...dist.entries()].filter(([n,d])=>d>=8&&d<=20);
  const pool = good.length ? good : [...dist.entries()].filter(([n,d])=>d>=5);
  const far=[...dist.entries()].sort((a,b)=>b[1]-a[1]);
  const dest = pool.length ? pool[Math.floor(Math.random()*pool.length)][0]
             : (far[0]?far[0][0]:[...stationMap.keys()].find(n=>n!==name));
  state.phase='play'; state.cur=name; state.line=lid; state.dest=dest;
  state.dir=chooseDir(name,lid,dest);
  state.path=[name]; state.prev=null; state.chain=[]; state.energy=5;
  state.allowNew=false; state.atHub=false; state.turns=0;
  state.startTopic=null; state.askTopic=true;   // 先让孩子用语音说一个想聊的话题
  state.log=[]; state.convo=[]; state.lastReply=null; state.goodStreak=0; state.startedAt=Date.now(); lastReport=null;
  resetScoreCard();
  document.getElementById('input').value='';
  verdict('','');
  syncUI(); updateMap();
  beep(660,.09); beep(880,.12,90);
  toast(`目标 🎯 ${dest}！先说一个你想聊的话题吧`);
  const ask = '你想聊什么话题呀？按住说话告诉我吧！';
  state.lastReply = ask;
  state.convo.push({role:'youyou', text:ask}); renderChat();   // 佑佑的第一条微信消息：问孩子想聊什么
  speak(ask, true);   // 接着站点播报之后念出来(append，不抢断站名)
}
/* 孩子说出想聊的话题：能对上词库就用词库话题，对不上就用孩子自己说的词当话题 */
function pickTopic(text){
  const hit = matchTopics(text)[0];
  let t = hit && TOPICS.find(x=>x.id===hit.id);
  if (!t){
    const name = text.replace(/^(我想|我要|我们|想|要)?(聊聊|聊|说说|说|讲讲|讲)?/,'').replace(/(吧|呀|啊|哦|吗|呢|的话题|话题)?[。！？!?，,\s]*$/,'').slice(0,8) || text.slice(0,8);
    t = {id:'custom', name, emoji:'💬', words:[name]};
  }
  state.askTopic=false; state.startTopic=t;
  state.convo.push({role:'kid', text});
  const tq = topicQuestion(t);
  state.lastReply = tq;   // 记住话题提问，后续 judge 可用此判断小朋友是否在回答问题
  state.convo.push({role:'youyou', text:tq});
  syncUI();
  speak(tq, false);
}
function advance(){
  const arr=lineArr(state.line);
  let i=arr.indexOf(state.cur)+state.dir;
  if (i<0||i>=arr.length){ state.dir=-state.dir; i=arr.indexOf(state.cur)+state.dir; toast('🚧 到终点站啦，列车掉头继续！'); }
  state.cur=arr[i]; state.path.push(state.cur);
  state.allowNew=false;
  state.atHub = stationMap.get(state.cur).lines.length>1;
}
/* 换乘站弹窗：继续坐当前线 = 接着聊；换乘别的线 = 换一个新话题（每条线一个不同话题），再选方向 */
const lineBadge = (lid, size) => {
  const c=LINES[lid].color, n=parseInt(c.slice(1),16);
  const light = ((n>>16)*299 + ((n>>8)&255)*587 + (n&255)*114)/1000 > 170;   // 浅色线路用深色字
  return `<span class="badge ${size||''} ${light?'light':''}" style="background:${c}">${lid.slice(1)}</span>`;
};
function offerTransfer(){
  const others = stationMap.get(state.cur).lines.filter(l=>l!==state.line);
  if (!others.length) return Promise.resolve(false);
  const curName = state.prev ? state.prev.topicName : '', curEmoji = state.prev ? state.prev.topicEmoji : '💬';
  const pool = TOPICS.filter(t=>t.name!==curName).sort(()=>Math.random()-.5);
  const options = others.map((lid,k)=>({ lid, topic:pool[k%pool.length] }));
  $('taTitle').textContent = `${state.cur}可以换乘`;
  const box = $('taOptions');
  return new Promise(resolve=>{
    const showLines = () => {
      box.innerHTML = '';
      const stay = document.createElement('button');
      stay.className = 'ta-opt stay';
      stay.innerHTML = `${lineBadge(state.line,'md')}<span>继续坐${LINES[state.line].name}<small>接着聊 ${curEmoji}「${esc(curName)}」</small></span>`;
      stay.onclick = () => resolve(null);
      box.append(stay);
      for (const o of options){
        const b = document.createElement('button');
        b.className = 'ta-opt';
        b.innerHTML = `${lineBadge(o.lid,'md')}<span>换乘${LINES[o.lid].name}<small>换个话题：${o.topic.emoji}「${esc(o.topic.name)}」</small></span>`;
        b.onclick = () => showDirs(o);
        box.append(b);
      }
    };
    const showDirs = o => {
      const arr = lineArr(o.lid), i = arr.indexOf(state.cur);
      box.innerHTML = `<p class="ta-q">换乘 ${lineBadge(o.lid)} ${LINES[o.lid].name}，往哪边开？</p>`;
      const dirs = document.createElement('div');
      dirs.className = 'dir-buttons';
      for (const [dir,end] of [[-1,i>0&&arr[0]],[1,i<arr.length-1&&arr[arr.length-1]]]){
        if (!end) continue;
        const b = document.createElement('button');
        b.className = 'big-btn';
        b.textContent = `开往 ${end} 方向 ▶`;
        b.onclick = () => resolve({ ...o, dir, end });
        dirs.append(b);
      }
      const back = document.createElement('button');
      back.className = 'big-btn grey';
      back.textContent = '‹ 返回';
      back.onclick = showLines;
      box.append(dirs, back);
    };
    showLines();
    $('transferAsk').hidden = false;
  }).then(pick=>{
    $('transferAsk').hidden = true;
    if (!pick) return false;
    const t = pick.topic;
    state.line = pick.lid; state.dir = pick.dir;
    state.startTopic = t; state.allowNew = false;
    const q = topicQuestion(t);
    state.lastReply = q; state.convo.push({role:'youyou', text:q});
    syncUI(); updateMap();
    verdict('ok', `🔁 <b>换乘${LINES[pick.lid].name}，开往 ${esc(pick.end)} 方向</b><br>新话题是「${t.emoji} ${t.name}」，例如：${topicExamples(t)}…`);
    speak(q, false);              // 语音只念新话题的提问，接上对话
    return true;
  });
}

/* ---- 提问检测：佑佑上一句话是不是在提问？ ---- */
/* 当小朋友接着 AI 的提问往下说时，答案里的词可能属于别的主题
   （比如话题是运动→骑车，AI 问「你喜欢骑车去哪里？」，小朋友答「去高铁站」，
   「高铁」属于交通工具，不属于运动），但这其实是在接着对话往下说，该算过关。 */
const QUESTION_PATTERNS = [
  /去哪|去哪里|哪儿|到哪里|什么地方/,          // 地点提问
  /什么|什么样|怎么样的|几/,                    // 事物/数量提问
  /为什么|怎么|怎样/,                            // 原因/方式提问
  /谁|哪个人/,                                   // 人物提问
  /喜欢.{0,4}吗|有没有|是不是|好不好|对不对/,    // 是非提问
  /长什么|什么颜色|什么样子|多大|多高|多重/      // 属性提问
];
function aiAskedQuestion(aiText){
  if(!aiText) return false;
  return QUESTION_PATTERNS.some(re=>re.test(aiText));
}
/* 小朋友的回答里有没有实义词（任何话题的词或描述词都算） */
function hasAnyContent(text){
  if(matchTopics(text).length) return true;
  for(const g of DESC_GROUPS){
    if(g.w.some(w=>text.includes(w))) return true;
  }
  return false;
}

/* ============================ 判定引擎 ============================ */
function judge(text){
  const hits=matchTopics(text);
  const ids=[...new Set(hits.map(h=>h.id))];
  const top = hits[0] ? {id:hits[0].id,name:hits[0].name,emoji:hits[0].emoji} : null;

  if (state.allowNew) return {ok:true, topic:top, tag:'new', reason:'🚉 换乘站特权，开启全新话题！'};

  if (!state.prev){
    const t = state.startTopic;
    if (!t) return {ok:true, topic:top, tag:'start', reason:'出发！第一句说什么都可以 🚀'};
    if (t.id==='custom') return {ok:true, topic:{id:t.id,name:t.name,emoji:t.emoji}, tag:'start', reason:`聊「${t.name}」，出发！`};
    if (ids.includes(t.id))
      return {ok:true, topic:{id:t.id,name:t.name,emoji:t.emoji}, tag:'start',
        reason:`聊的是「${t.name}」，说对了，上车！`};
    const rid2 = ids.find(id=>(RELATED[t.id]||[]).includes(id));
    if (rid2){ const rt=TOPICS.find(x=>x.id===rid2);
      return {ok:true, topic:{id:rt.id,name:rt.name,emoji:rt.emoji}, tag:'start',
        reason:`「${t.name}」→「${rt.name}」，也算数，上车！`}; }
    return {ok:false, tag:'start',
      reason:`这一轮的话题是「${t.name}」${t.emoji}，要说跟它有关的才行哦。`,
      hint:`试试：${topicExamples(t)}… 或者点右边的话题按钮帮你起个头`};
  }
  if (text===state.prev.text) return {ok:false, reason:'这句话刚才说过啦，换一句新的吧～'};
  if (text.length < state.prev.text.length && state.prev.text.includes(text))
    return {ok:false, reason:`只说「${text}」不够哦，把它说成一个完整的句子吧～`, hint:hintFor(state.prev)};

  const pHits=matchTopics(state.prev.text);
  const shared=hits.find(h=>pHits.some(p=>p.word===h.word));
  if (shared) return {ok:true, topic:{id:shared.id,name:shared.name,emoji:shared.emoji}, tag:'word',
    reason:`两句都提到了「${shared.word}」，接上啦！`};

  if (state.prev.topicId && ids.includes(state.prev.topicId))
    return {ok:true, topic:{id:state.prev.topicId,name:state.prev.topicName,emoji:emojiOf(state.prev.topicId)}, tag:'same',
      reason:`还是「${state.prev.topicName}」，顺利进站！`};

  if (state.prev.topicId){
    const rel=RELATED[state.prev.topicId]||[];
    const rid=ids.find(id=>rel.includes(id));
    if (rid){ const t=TOPICS.find(x=>x.id===rid);
      return {ok:true, topic:{id:t.id,name:t.name,emoji:t.emoji}, tag:'rel',
        reason:`「${state.prev.topicName}」→「${t.name}」，联想成功！`}; }
  }
  const sc=sharedChars(state.prev.text,text);
  if (sc.length>=2) return {ok:true,
    topic: top || {id:state.prev.topicId,name:state.prev.topicName,emoji:emojiOf(state.prev.topicId)}, tag:'char',
    reason:`有一样的字「${sc.slice(0,2).join('')}」，过关！`};

  /* —— 上下文感知：小朋友在接着 AI 的提问往下说 ——
     举例：话题=运动，AI 问「你喜欢骑车去哪里？」，小朋友答「去高铁站」。
     「高铁」属于交通工具，不在运动词表里，上面所有检查都会 miss。
     但小朋友明明是在回答 AI 的问题，算他过关！ */
  if (state.lastReply && aiAskedQuestion(state.lastReply) && hasAnyContent(text)){
    const prevTopic = state.prev.topicId
      ? {id:state.prev.topicId, name:state.prev.topicName, emoji:emojiOf(state.prev.topicId)}
      : (top || {id:null, name:'不限', emoji:'💬'});
    return {ok:true, topic: prevTopic, tag:'answer',
      reason:`接着佑佑的问题回答，说得通！`};
  }

  const why = top ? `你说的「${top.name}」和上一句的「${state.prev.topicName || '内容'}」连不上哦。`
                  : `没找到和上一句的关联，试试接着上一个话题说。`;
  return {ok:false, reason:why, hint:hintFor(state.prev)};
}
function hintFor(prev){
  if (!prev || !prev.topicId) return '先说一个具体的东西，比如「小猫」「苹果」「消防车」';
  const t=TOPICS.find(x=>x.id===prev.topicId);
  const rel=(RELATED[prev.topicId]||[]).map(id=>TOPICS.find(x=>x.id===id)).filter(Boolean);
  const pick=t.words.filter(w=>w.length>=2).slice(0,3);
  const relPick=rel.length? rel[0].words.filter(w=>w.length>=2).slice(0,2):[];
  return `接着「${t.name}」说：${pick.join('、')}…${relPick.length?` 或者转到「${rel[0].name}」：${relPick.join('、')}`:''}`;
}

/* ============================ 交互 ============================ */
const $=id=>document.getElementById(id);
function verdict(cls,html){ const v=$('verdict'); v.className='verdict '+cls; v.innerHTML=html; }
function toast(msg){
  $('hintbar').textContent=msg;
  clearTimeout(toast._t); toast._t=setTimeout(()=>{ $('hintbar').textContent='继续说，往下一站开！'; },2600);
}
function audioCtx(){
  const ac=beep._ac||(beep._ac=new (window.AudioContext||window.webkitAudioContext)());
  // iOS/Safari 会在没有用户手势时把 AudioContext 挂起，不 resume 就完全没声音
  if (ac.state==='suspended') ac.resume();
  return ac;
}
function beep(freq,dur,delay,type,vol){
  try{
    const ac=audioCtx();
    const t0=ac.currentTime+(delay||0)/1000;
    const o=ac.createOscillator(), g=ac.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol||0.28,t0+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0+dur+0.05);
  }catch(e){}
}
/* ---------- 列车音效（全用合成声，不用人声，免得打断语音对话） ---------- */
function _noise(ac){
  if (_noise._b) return _noise._b;
  const b=ac.createBuffer(1, ac.sampleRate, ac.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  return (_noise._b=b);
}
// 一段滤波噪声：type/freq 决定是"咔哒"还是"嘶——"
function _noiseHit(ac, t0, dur, type, freq, vol){
  const s=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain();
  s.buffer=_noise(ac); f.type=type; f.frequency.value=freq;
  g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(f).connect(g).connect(ac.destination); s.start(t0); s.stop(t0+dur+0.05);
}
function trainHorn(){            // 出发鸣笛：两个低沉的和声
  try{
    const ac=audioCtx(), t0=ac.currentTime, f=ac.createBiquadFilter(), g=ac.createGain();
    f.type='lowpass'; f.frequency.value=1400;
    g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.16,t0+0.05);
    g.gain.setValueAtTime(0.16,t0+0.45); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.7);
    f.connect(g).connect(ac.destination);
    [311,370].forEach(fr=>{ const o=ac.createOscillator(); o.type='sawtooth'; o.frequency.value=fr; o.connect(f); o.start(t0); o.stop(t0+0.75); });
  }catch(e){}
}
function trainClack(){           // 车轮压过钢轨接缝：咔哒-咔哒
  try{ const ac=audioCtx(), t0=ac.currentTime;
    _noiseHit(ac, t0, 0.06, 'bandpass', 900, 0.5);
    _noiseHit(ac, t0+0.1, 0.06, 'bandpass', 750, 0.4);
  }catch(e){}
}
function successSfx(){           // 过关音效：叮-叮-叮-叮↑ 上行琶音 + 一串闪亮的高音
  [523,659,784,1047].forEach((f,i)=>beep(f,.22,i*85,'triangle',.26));

function firePop(){              // 烟花：砰 + 噼里啪啦
  try{ const ac=audioCtx(), t0=ac.currentTime;
    _noiseHit(ac, t0, 0.3, 'lowpass', 900, 0.45);
    for(let i=0;i<7;i++) _noiseHit(ac, t0+0.12+Math.random()*0.45, 0.03, 'highpass', 4000, 0.18);
  }catch(e){}
}

// 挑一个温柔小姐姐的普通话女声：优先点名好听的温柔女声，再考虑现代自然音，坚决避开粤语
function _pickVoice(){
  if(!_voices.length){ try{ _loadVoices(); }catch(e){} }
  const vs=_voices;
  const lang=v=>(v.lang||'').toLowerCase();
  const key =v=>(v.name||'').toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]/g,'');
  const isZh=v=>/zh|cmn/i.test(lang(v));
  const isCantonese=v=>/yue|zh[-_]hk/i.test(lang(v));        // 粤语/香港口音 → 念普通话会"像外国人"
  const isMainland=v=>/zh[-_]cn|cmn|hans/i.test(lang(v));    // 大陆普通话(简体)
  const uri =v=>(v.voiceURI||'').toLowerCase();
  const isMale=v=>/(limu|yunxi|yunjian|yunyang|yunfeng|yunhao|yunze|kangkang|男)/.test(key(v));
  // 0) 最像真人：iPad / Mac 上下载的「高音质(Premium) / 优化(Enhanced)」女声，Edge 的 Natural 神经网络女声；
  //    同等条件下优先大陆普通话（避开台湾腔、粤语）
  const hq=v=>/premium|enhanced|natural|neural|高音质|优化/.test(key(v)+' '+uri(v));
  const best=vs.filter(v=>isZh(v)&&!isCantonese(v)&&!isMale(v)&&hq(v))
               .sort((a,b)=>(isMainland(b)-isMainland(a)) || (/premium|高音质/.test(key(b)+uri(b)) - /premium|高音质/.test(key(a)+uri(a))))[0];
  if(best) return best;
  // 1) 点名温柔小姐姐女声：Mei-Jia(台湾温柔女声)、xiaoxiao/xiaoyi/lili/huihui 等；避开老旧机械的 Ting-Ting
  const fav=['meijia','xiaoxiao','xiaoyi','lili','huihui','yuxi','xiaoqiao','yuansheng','tingtang'];
  for(const k of fav){
    const v=vs.find(v=>isZh(v)&&!isCantonese(v)&&key(v).includes(k));
    if(v) return v;
  }
  // 2) 现代自然/神经网络女声(Google 普通话、premium、enhanced、natural、Siri)
  const neural=vs.find(v=>isZh(v)&&!isCantonese(v)&&/(google|普通话|premium|enhanced|natural|siri)/i.test(v.name||''));
  if(neural) return neural;
  // 3) 大陆普通话(zh-CN / cmn / hans)
  const cn=vs.find(v=>isMainland(v)&&!isCantonese(v));
  if(cn) return cn;
  // 4) 任意中文(排除粤语)
  const zh=vs.find(v=>isZh(v)&&!isCantonese(v));
  if(zh) return zh;
  // 5) 兜底：任意 zh
  return vs.find(isZh)||null;
}
// 念之前清理文字：表情符号会被读成「派对礼花」之类的怪词，～ 和重复的感叹号也会让语调变怪
const speakable = t => String(t)
  .replace(/[\p{Extended_Pictographic}\u{FE0F}\u{200D}\u{1F3FB}-\u{1F3FF}]/gu, '')
  .replace(/[～~]+/g, '，').replace(/([！!？?。，,])\1+/g, '$1').replace(/\s+/g, ' ').trim();
function speak(text, append, opts){
  try{
    if (!('speechSynthesis' in window)) return;
    const ss=window.speechSynthesis;
    if (!append) ss.cancel();          // append 时不清掉，接着上一句继续读
    const u=new SpeechSynthesisUtterance(speakable(text));
    u.lang='zh-CN';
    // 用接近正常说话的语速和原声音调：把音调调高会让系统语音一下子变得很"机器人"
    u.rate  = (opts&&opts.rate !=null)? opts.rate  : 0.96;
    u.pitch = (opts&&opts.pitch!=null)? opts.pitch : 1.0;
    const zh=_pickVoice();
    if (zh) u.voice=zh;
    ss.speak(u);
  }catch(e){}
}
function speakStation(name){
  const st=stationMap.get(name); if(!st) return;
  const lines=st.lines.map(l=>LINES[l].name).join('、');
  speak(st.lines.length>1 ? `${name}站，换乘${lines}` : `${name}站，${lines}`);
}
function praisePhrase(topic, score){
  const stars = score>=90?3 : score>=85?2 : score>=80?1 : 0;
  const lead = '你真棒，说的太好了！';               // 夸奖固定第一句
  let extra;
  if (score>=92){                                   // 夸张表扬：说得超级好
    const exag=[
      `「${topic}」你说得也太厉害了吧！！🎉🎉 佑佑简直是语言表达小天才！`,
      `「${topic}」说得超级超级棒！！🌟🌟 妈妈都要给你站起来鼓掌啦！`,
      `「${topic}」你说得又清楚又好玩，简直是满分小主播！！🎤✨`,
      `关于「${topic}」你说得太精彩了！！👏👏 佑佑你也太牛了吧！`
    ];
    extra=exag[Math.floor(Math.random()*exag.length)];
  } else if (score>=85){                            // 很棒
    const great=[
      `「${topic}」说得太好啦，讲得又清楚又有意思，真厉害！🌟`,
      `哇！「${topic}」你说得真棒，听得我都想给你鼓掌啦！👏`,
      `「${topic}」说得超级好！佑佑这回表达满分！💯`,
      `厉害厉害！「${topic}」讲得绘声绘色，继续加油！🔥`
    ];
    extra=great[Math.floor(Math.random()*great.length)];
  } else if (score>=75){                            // 不错
    const good=[
      `「${topic}」说得很清楚，真棒！`,
      `「${topic}」，说得很清楚，真厉害！`,
      `这次聊的是「${topic}」，你讲得真好！`
    ];
    extra=good[Math.floor(Math.random()*good.length)];
  } else {                                         // 基础鼓励
    const ok=[
      `这次的话题是「${topic}」，说得不错哦！`,
      `「${topic}」，说得挺好的，继续说！`,
      `这次聊的是「${topic}」，你说得很认真！`
    ];
    extra=ok[Math.floor(Math.random()*ok.length)];
  }
  // 第一句固定夸奖 + 接着再加一点表扬
  return stars>0 ? `${lead} ${extra}还点亮了${stars}颗小星星！` : `${lead} ${extra}`;
}

/* 答对先打一个勾号，持续 ms 毫秒后再开地铁（.show 交给 bigmarkIn 动画自行淡出） */
function showCheck(ms){
  return new Promise(resolve=>{
    const el=document.getElementById('check'); if(!el){ resolve(); return; }
    el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
    successSfx(); fireworks(ms);                 // 勾号 + 烟花 + 过关音效
    setTimeout(resolve, ms);
  });
}
/* 勾号周围放烟花：一朵朵在勾号四周炸开，每朵配一声"砰"+噼啪声 */
function fireworks(ms){
  const cv=document.createElement('canvas'), ctx=cv.getContext && cv.getContext('2d');
  if (!ctx) return;
  const dpr=window.devicePixelRatio||1, W=innerWidth, H=innerHeight;
  cv.width=W*dpr; cv.height=H*dpr; cv.className='fw-canvas';
  ctx.scale(dpr,dpr); document.body.appendChild(cv);
  const cols=['#4ADE80','#FCD34D','#F472B6','#60A5FA','#FB923C','#C084FC','#FFFFFF'];
  const cx=W/2, cy=H*.4, parts=[];
  const burst=(x,y)=>{
    const c=cols[Math.floor(Math.random()*cols.length)], c2=cols[Math.floor(Math.random()*cols.length)];
    const n=90, sp=5.5+Math.random()*3;
    for(let i=0;i<n;i++){
      const a=Math.PI*2*i/n, v=sp*(.5+Math.random()*.5);
      parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,decay:.011+Math.random()*.009,c:i%3?c:c2});
    }
    firePop();
  };
  const t0=performance.now(), shots=[0,260,520,820,1120,1420].filter(t=>t<ms-300);
  let fired=0;
  const step=now=>{
    const t=now-t0;
    while (fired<shots.length && t>=shots[fired]){
      const k=fired++, side=k%2?1:-1;            // 左右交替，避开正中间的勾号
      burst(cx+side*(W*.16+Math.random()*W*.18), cy+(Math.random()-.6)*H*.42);
    }
    ctx.clearRect(0,0,W,H);
    for(let i=parts.length-1;i>=0;i--){
      const p=parts[i];
      p.vx*=.97; p.vy=p.vy*.97+.06; p.x+=p.vx; p.y+=p.vy; p.life-=p.decay;
      if (p.life<=0){ parts.splice(i,1); continue; }
      ctx.globalAlpha=p.life; ctx.fillStyle=ctx.strokeStyle=p.c;
      ctx.lineWidth=2.5+p.life*2; ctx.lineCap='round';           // 拖一条小尾巴，像真的烟花
      ctx.beginPath(); ctx.moveTo(p.x-p.vx*3,p.y-p.vy*3); ctx.lineTo(p.x,p.y); ctx.stroke();
      ctx.beginPath(); ctx.arc(p.x,p.y,2.5+p.life*2.5,0,Math.PI*2); ctx.fill();
    }
    if (t<ms+900 && (parts.length || fired<shots.length)) requestAnimationFrame(step); else cv.remove();
  };
  requestAnimationFrame(step);
}

  $('curV').innerHTML  = st? `${st.name}<small>${LINES[state.line].name}</small>` : '—';

  } else {
    $('prevTag').textContent='🆕 还没开始，第一句说什么都可以！';
    $('prevQuote').textContent='在地图上点一个地铁站出发吧～';

function renderChat(){
  const box=$('chat'); if(!box) return;
  const c=state.convo||[];
  if(!c.length){
    box.innerHTML='<div class="wempty">点一个地铁站出发，和佑佑聊起来吧～</div>';
    return;
  }
  box.innerHTML=c.map(m=>{
    const me=m.role==='kid';
    const av=me?'🧒':'🚇';
    return '<div class="wmsg '+(me?'me':'them')+'">'
      + (me?'':'<div class="wavatar">'+av+'</div>')
      + '<div class="wbubble">'+esc(m.text)+'</div>'
      + (me?'<div class="wavatar">'+av+'</div>':'')
      + '</div>';
  }).join('');
  box.scrollTop=box.scrollHeight;
}

async function submit(){
  stopMic();                                                // 提交时立刻停掉录音，别再一直开着
  if (state.busy) return;                                   // 列车在开，别急
  if (state.phase!=='play'){ toast('先在地图上点一个出发站～'); return; }
  const text=$('input').value.trim();
  if (state.askTopic && text){ $('input').value=''; fitInput(); pickTopic(text); return; }   // 开局：这句是孩子想聊的话题
  if (text.length<2){ verdict('no','多说一点点呀，至少两三个字 😊'); return; }
  $('input').value=''; fitInput();                          // 内容立刻拿去打分，输入框清空

  // 当前话题：第一句是出发话题，之后延续（AI 对话模式下由 AI 把话题延续下去）
  const topicName = state.startTopic ? state.startTopic.name
                  : (state.prev ? state.prev.topicName : '不限');
  const topicEmoji = state.startTopic ? state.startTopic.emoji
                  : (state.prev ? state.prev.topicEmoji : '💬');

  // —— 判定 + 打分 + 回复：AI 对话优先，出错自动退回本地规则 ——
  let ok=false, sc=null, reply='', reason='', hint='', topic=null;

  if (ampAI || (cfg.mode==='ai' && cfg.key)){
    setBusy(true, '⏳ 佑佑在听你说…');
    try{
      const ai = await aiChat(text, topicName);
      if (ai.ok){
        ok = ai.ok;
        const lv = levelOf(ai.score);
        sc = { score:ai.score, level:lv.t, emoji:lv.e, comment:ai.comment, byAI:true,
               parts:[{v:0,k:'AI 点评：'+(ai.comment||'—')}], descs:[], distinct:0, chars:[...text].length };
        reply = ai.reply;
        reason = '说得好！';
      } else {
        // AI 判「无关」时，用本地规则兜底：防止误杀「接着追问往下说」这种正常对话
        // （例：话题=运动，AI 问「你喜欢骑车去哪里？」，孩子答「去高铁站」——本地上下文感知应判过关）
        const res=judge(text); ok=res.ok; topic=res.topic;
        if (ok){
          sc=scoreUtterance(text);
          sc.note='AI 判无关，但孩子是在接着上一句追问说，已按本地规则通过';
        } else {
          reason=res.reason; hint=res.hint||hintFor(state.prev);
        }
        reply = ok ? localReply(topicName) : '';
      }
    }catch(e){
      const res=judge(text); ok=res.ok; topic=res.topic;
      if (ok){ sc=scoreUtterance(text); sc.note='AI 没连上（'+e.message+'），先用本地规则'; }
      else { reason=res.reason; hint=res.hint||hintFor(state.prev); }
      reply = ok ? localReply(topicName) : '';
    }
  } else {
    const res=judge(text); ok=res.ok; topic=res.topic;
    if (ok){ sc=scoreUtterance(text); }
    else { reason=res.reason; hint=res.hint||hintFor(state.prev); }
    reply = ok ? localReply(topicName) : '';
  }

  if (ok){
    // 重复内容 → 调低分数
    if (isRepeat(text)){
      const before=sc.score;
      sc.score=Math.max(0, sc.score-15);
      sc.note=(sc.note?sc.note+' ':'')+`这句和之前说的一样，从 ${before} 分减到 ${sc.score} 分`;
    }

    state.prev={ text, topicId:topic?topic.id:(state.prev?state.prev.topicId:null),
      topicName:topic?topic.name:topicName,
      topicEmoji:topic?topic.emoji:topicEmoji };
    if (topic && (!state.chain.length || state.chain[state.chain.length-1].id!==topic.id))
      state.chain.push(topic);
    state.turns++;
    if (state.startTopic) state.startTopic=null;   // 出发话题只约束第一句
    const before=state.cur;

    // 连续说得好 → 回一点能量
    if (sc.score>=85){
      state.goodStreak++;
      if (state.goodStreak%3===0 && state.energy<5){
        state.energy++;
        toast(`🌟 连续 ${state.goodStreak} 句说得很好，回血 +1 ❤️`);
      }
    } else state.goodStreak=0;

    const entry={ n:state.log.length+1, text, topic:topicName, score:sc.score, level:sc.level,
                  emoji:sc.emoji, comment:sc.comment||'', byAI:!!sc.byAI, from:before, to:null };
    state.log.push(entry);
    state.convo.push({role:'kid', text});
    if (reply){ state.convo.push({role:'youyou', text:reply}); state.lastReply=reply; }
    renderScore(sc);

    advance();
    entry.to=state.cur;
    const hub=stationMap.get(state.cur).lines.length>1;

    verdict('ok', `<b>✅ ${reason}</b><br>🚇 ${before} → <b>${state.cur}</b>　${hub?'<span style="color:#FCD34D">（换乘站！）</span>':''}<br><span class="sc">${sc.emoji} ${sc.score} 分 · ${sc.level}</span>`);
    if (sc.score>=80) flashUp();                          // 说得好 → 大点赞
    const praise=praisePhrase(topicName, sc.score);       // 表扬只显示在屏幕上，不念出来，免得打断语音对话
    window.speechSynthesis && window.speechSynthesis.cancel();   // 停掉还没念完的话，开车时只有列车声

    // —— 先打勾号 2 秒，再全屏开地铁 ——
    setBusy(true, '🚇 开动中…');
    syncUI();
    $('me').innerHTML='';                 // 藏住静态定位图标
    await showCheck(2000);               // 答对先显示勾号，持续 2 秒
    await flyTrain(before, state.cur);   // 再从 A 站开到 B 站（约 3 秒）
    updateMap();
    if (sc.score>=85){ showHype(praise); await new Promise(r=>setTimeout(r,1800)); }   // 说得特别好 → 弹夸张表扬条，看一会儿再继续

    if (state.cur===state.dest){ setBusy(false); return win(); }
    // 换乘站：弹窗问要不要换乘（换乘 = 换话题）；换了就由新话题提问接上对话
    const switched = hub && await offerTransfer();
    setBusy(false);
    if (!switched && reply) speak(reply);                 // 语音只接着聊（读出 AI 的追问）
  } else {
    setBusy(false);                            // AI 模式下 judge 前设了 busy=true，答错也要解除
    state.energy--;
    const hintTxt = hint || hintFor(state.prev) || '多说一点点，把话说完整～';
    verdict('no', `<b>❌ 不能进站</b><br>${reason}<br><span style="color:#8E9ABF;font-size:13px">💡 ${hintTxt}</span><br><span style="font-size:12px;opacity:.8">剩余能量 ${state.energy}</span>`);
    flashX(); speak('说的和话题无关哦');          // 大叉叉 + 语音提醒
    beep(180,.22);
    syncUI();
    if (state.energy<=0) return lose();
  }
}

function renderScore(sc){
  $('scNum').textContent=sc.score;
  $('scNum').classList.add('on');
  $('scLv').textContent=`${sc.emoji} ${sc.level}`;
  $('scBar').style.width=sc.score+'%';
  // 五角星奖励：80 分以上点亮星星（80=1 颗，85=2 颗，90=3 颗）
  const stars = sc.score>=90?3 : sc.score>=85?2 : sc.score>=80?1 : 0;
  if (stars>0){
    $('scStars').innerHTML = [0,1,2].map(i=>
      i<stars ? '<span class="s pop">★</span>' : '<span class="s hollow">☆</span>'
    ).join('');
  } else {
    $('scStars').innerHTML = '<span class="hollow">☆☆☆</span><span class="hint">说满 80 分就能点亮小星星哦～</span>';
  }
  const arr=state.log.map(l=>l.score);
  const avg=Math.round(arr.reduce((a,b)=>a+b,0)/arr.length);
  $('scAvg').textContent=`本局平均 ${avg} 分 · 已说 ${state.log.length} 句`;
  let why='';
  if (sc.note) why = '⚠️ '+sc.note;
  else if (sc.byAI) why = sc.comment ? 'AI 点评：'+sc.comment : '';
  else why = sc.parts.filter(p=>p.v).map(p=>`${p.v>0?'+':''}${p.v} ${p.k}`).join('；');
  $('scTip').textContent = why || '继续说，多加点描述就能拿更高分！';
}

/* ---------- 结算 ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function scoreColor(s){ return s>=90?'#FCD34D' : s>=80?'#2DD4BF' : s>=70?'#7DD3FC' : s>=60?'#FCA5A5' : '#F87171'; }
function avgScore(){
  if (!state.log.length) return 0;
  return Math.round(state.log.reduce((a,l)=>a+l.score,0)/state.log.length);
}
function buildReport(won){
  const t=new Date(), p=n=>String(n).padStart(2,'0');
  const stamp=`${t.getFullYear()}-${p(t.getMonth()+1)}-${p(t.getDate())} ${p(t.getHours())}:${p(t.getMinutes())}`;
  const fileStamp=`${t.getFullYear()}${p(t.getMonth()+1)}${p(t.getDate())}-${p(t.getHours())}${p(t.getMinutes())}`;
  const sec = state.startedAt ? Math.max(1,Math.round((Date.now()-state.startedAt)/1000)) : 0;
  const durText = sec>=60 ? `${Math.floor(sec/60)} 分 ${sec%60} 秒` : `${sec} 秒`;
  const avg=avgScore();
  const best=[...state.log].sort((a,b)=>b.score-a.score)[0]||null;
  const rows=state.log.map(l=>`| ${l.n} | ${l.from} → ${l.to||l.from} | ${l.text.replace(/\|/g,'/')} | ${l.topic} | **${l.score}** | ${l.level}${l.comment?' · '+l.comment.replace(/\|/g,'/'):''} |`).join('\n');
  const md =
`# 🚇 佑佑的地铁话题大冒险 · 本局成绩单

- 时间：${stamp}
- 结果：${won?`🏆 到达目的地 ${state.dest}`:`🔋 能量用完，停在 ${state.cur}（目的地是 ${state.dest}）`}
- 出发站：${state.path[0]||'—'}　目的地：${state.dest||'—'}
- 走过 ${state.path.length-1} 站，说了 ${state.log.length} 句话，串起 ${state.chain.length} 个话题
- 用时：${durText}
- **口语平均分：${avg} 分**（按 4 岁半孩子的表达水平打分）
${best?`- 最佳一句（${best.score} 分）：「${best.text}」`:''}

## 每一句的得分

| # | 车站 | 佑佑说的话 | 话题 | 得分 | 评价 |
|---|------|-----------|------|------|------|
${rows}

## 话题链

${state.chain.length? state.chain.map(c=>c.emoji+' '+c.name).join(' → ') : '（这局还没串起来）'}

## 走过的路线

${state.path.join(' → ') || '—'}

---
_打分标准：只重复同一个词 ≈ 60 分；说清「事物 + 数量/部位」≈ 80 分；再加颜色、动作、在哪儿、感受、像什么，越具体分越高。_
`;
  return {md, stamp, fileStamp, avg, best, durText};
}
function win(){
  state.phase='won'; syncUI(); updateMap();
  [660,880,1046,1318].forEach((f,i)=>beep(f,.2,i*130));
  burst(state.dest);
  endGame(true);
}

}
function endGame(won){

      <span class="sp" style="color:${scoreColor(l.score)}">${l.score}</span></div>`).join('');

function fallbackCopy(text,done){
  const ta=document.createElement('textarea');
  ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();

/* ==================== 结果导出：写进「桌面 / workbuddy」文件夹 ==================== */
/* 浏览器不能自己往磁盘上写文件，所以这里用 File System Access API：
   第一次点保存时让你选一次文件夹（选桌面的 workbuddy），之后就记住了，下次直接写进去。
   万一浏览器不支持（比如用 file:// 直接打开的 Safari / Firefox），就退回普通下载。 */
const IDB_NAME='yy-metro-fs';
let dirHandle=null;

function idbOpen(){
  return new Promise((res,rej)=>{
    try{
      const r=indexedDB.open(IDB_NAME,1);
      r.onupgradeneeded=()=>{ r.result.createObjectStore('h'); };
      r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
    }catch(e){ rej(e); }
  });
}
async function idbSet(k,v){
  try{
    const db=await idbOpen();
    return await new Promise(res=>{
      const tx=db.transaction('h','readwrite');
      tx.objectStore('h').put(v,k);
      tx.oncomplete=()=>res(true); tx.onerror=()=>res(false);
    });
  }catch(e){ return false; }
}
async function idbGet(k){
  try{
    const db=await idbOpen();
    return await new Promise(res=>{
      const tx=db.transaction('h','readonly');
      const q=tx.objectStore('h').get(k);
      q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null);
    });
  }catch(e){ return null; }
}
function updateSaveBtn(){
  const b=$('saveBtn'); if(!b) return;
  b.textContent = dirHandle ? `💾 存到 ${dirHandle.name}` : '💾 保存本局';
  b.title = dirHandle ? `结果会直接写进「${dirHandle.name}」文件夹，点一下可以换一个`
                      : '把这一局的成绩单存成 md 文件';
}
async function restoreDir(){
  if (!window.showDirectoryPicker) return;
  const h=await idbGet('dir'); if(!h) return;
  try{
    const p=await h.queryPermission({mode:'readwrite'});
    if (p==='granted'){ dirHandle=h; updateSaveBtn(); }
    else if (p==='prompt'){
      // Chrome 会在页面重新打开后要求再确认一次，这里只能在用户点击时触发，所以只提示
      $('saveBtn').title='之前选过文件夹，点一下确认后就能继续直接写入';
    }
  }catch(e){}
}
async function writeToDir(handle,name,text){
  const fh=await handle.getFileHandle(name,{create:true});
  const w=await fh.createWritable();
  await w.write(text); await w.close();
}
function downloadFile(name,text){
  try{
    const blob=new Blob([text],{type:'text/markdown;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=name; a.style.display='none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    return true;
  }catch(e){ return false; }
}
async function saveResult(interactive){
  const r=lastReport || (state.log.length ? buildReport(state.phase==='won') : null);
  if (!r){ toast('这一局还没说话，没有东西可以保存哦～'); return null; }
  lastReport=r;
  const name=`佑佑地铁冒险-${r.fileStamp}.md`;
  const canFS = !!window.showDirectoryPicker;

  // 还没选过文件夹：先说明一下再弹系统的选择框（只弹这一次，之后永久记住）
  if (!dirHandle && canFS){
    if (!interactive) return null;           // 自动存档不打断游戏，等玩家自己点 💾
    const go = await new Promise(res=>{
      showModal(`<div class="big">📁</div><h3>选一次保存位置</h3>
        <div class="setnote" style="margin-bottom:0">
          下一步会弹出系统的文件夹选择框，请选择 <b>桌面上的 workbuddy 文件夹</b>，然后点「允许」。<br><br>
          选过这一次之后，以后每局结束都会 <b>自动</b> 存进去，不用再选。<br>
          <span style="color:#FCA5A5">没看到 workbuddy？先关掉这个框，去桌面新建一个文件夹再来。</span>
        </div>
        <div class="btns">
          <button class="btn primary" id="pkGo">好，去选 workbuddy</button>
          <button class="btn" id="pkDl">直接下载到「下载」</button>
        </div>`);
      $('pkGo').onclick=()=>{ closeModal(); res(true); };
      $('pkDl').onclick=()=>{ closeModal(); res(false); };
    });
    if (go){
      try{
        dirHandle=await window.showDirectoryPicker({id:'yy-workbuddy', mode:'readwrite'});
        await idbSet('dir',dirHandle); updateSaveBtn();
      }catch(e){ /* 用户取消 → 走下载 */ }
    }
  }

  if (dirHandle){
    try{
      let p=await dirHandle.queryPermission({mode:'readwrite'});
      if (p!=='granted') p=await dirHandle.requestPermission({mode:'readwrite'});
      if (p!=='granted') throw new Error('no-perm');
      await writeToDir(dirHandle,name,r.md);
      toast(`💾 已存到「${dirHandle.name}/${name}」`);
      return name;
    }catch(e){
      if (e && e.name==='AbortError') return null;
      toast('写进文件夹失败，改成下载方式…');
    }
  }
  if (downloadFile(name,r.md)) toast(`💾 已下载 ${name}（在「下载」里，拖到桌面 workbuddy 就行）`);
  else toast('这个浏览器不支持直接存文件，点「📋 复制全文」手动保存吧');
  return name;
}
