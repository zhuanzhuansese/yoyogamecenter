/* 关键前提：麦克风只在「安全上下文」里可用 —— https:// 或 localhost / 127.0.0.1。
   http://192.168.x.x 这种局域网明文地址，Safari 和 Chrome 都会直接拒绝麦克风，
   连权限弹窗都不弹。所以这里先把情况说清楚，别让人对着没反应的按钮干瞪眼。 */
const SECURE_OK = !!window.isSecureContext;
let stopMic=function(){};    // 全局：提交时停掉还在录音的麦克风

if (!SR){
  const w=$('secWarn'); w.style.display='block';
  w.innerHTML = '🎤 <b>这个浏览器不支持语音识别</b>，直接打字一样能玩。<br>'
              + 'iPad 上建议用 <b>Safari</b> 打开。';
} else if (!SECURE_OK){
  const w=$('secWarn'); w.style.display='block';
  w.innerHTML = '⚠️ <b>当前不是加密连接，浏览器会禁掉麦克风</b>，🎤 用不了（打字不受影响）。<br>'
              + '请用 <code>https://</code> 开头的地址打开本页；<br>'
              + '或者在电脑上用 <code>http://localhost</code> / <code>http://127.0.0.1</code>。';
}

if (SR && SECURE_OK){
  /* 像微信一样「按住 说话」：按下开始录音，气泡里实时出字；松手把转出来的文字直接发出去；
     按住时手指上滑到 ✕ 再松手 = 取消。整个界面只有这一个按钮，小朋友不用打字。 */
  const rec = new SR();
  rec.lang='zh-CN'; rec.interimResults=true; rec.continuous=true; rec.maxAlternatives=1;
  const btn=$('micBtn'), bar=$('wxBar'), layer=$('recLayer'), recText=$('recText'), recTip=$('recTip');
  bar.classList.remove('kbd'); bar.classList.add('voice');
  let holding=false, sending=false, cancelZone=false, listening=false, stopped=true;
  let t0=0, watchdog=null, finalText='', interim='';
  const heard=()=>(finalText+interim).trim();
  const setZone=c=>{
    cancelZone=c; layer.classList.toggle('cancel',c);
    btn.textContent = c ? '松开 取消' : '松开 发送';
    recTip.textContent = c ? '松开手指，取消发送' : '松开 发送，上滑 取消';
  };

  // 立刻停掉并丢弃（取消 / 提交 / 出错时都走这里）
  const finish=()=>{
    clearTimeout(watchdog);
    stopped=true;                         // 立刻设标志，防止 abort 后还有 onresult 继续写文本
    holding=false; sending=false;
    if (listening){ try{ rec.abort(); }catch(e){} }
    listening=false;
    layer.classList.remove('on','cancel'); btn.classList.remove('on');
    if (!state.busy) btn.textContent='按住 说话';
  };
  stopMic=finish;              // 把 finish 暴露出去，提交时能立刻停掉录音

  // 松手后：把转出来的文字当成小朋友说的话发出去
  const deliver=()=>{
    if (stopped) return;                  // 已经发过 / 取消过了，别重复发送
    const t=heard(); finish();
    if (!t){ toast('没听清，再按住说一次吧～'); return; }
    $('input').value=t; submit();
  };

  const startRec=()=>{
    try{ rec.start(); }
    catch(e){   // 上一轮还没彻底停下来，稍等再试一次
      setTimeout(()=>{ if(!holding||stopped) return; try{ rec.start(); }catch(_){ finish(); toast('麦克风启动失败，再按一次试试'); } }, 300);
    }
  };
  const press=e=>{
    if (e.button>0 || holding || btn.disabled) return;
    e.preventDefault();
    if (state.phase!=='play'){ toast('先在地图上点一个出发站～'); return; }
    try{ btn.setPointerCapture(e.pointerId); }catch(_){}
    holding=true; sending=false; stopped=false; finalText=''; interim=''; recText.textContent=''; t0=Date.now();
    btn.classList.add('on'); setZone(false);
    layer.style.bottom=bar.offsetHeight+'px'; layer.classList.add('on');
    startRec();
    watchdog=setTimeout(release, 60000);   // 兜底：最长录 60 秒，到点自动松手发送
  };
  const release=()=>{
    if (!holding) return;
    holding=false; clearTimeout(watchdog);
    if (cancelZone){ finish(); return; }
    if (Date.now()-t0<400){ finish(); toast('说话时间太短'); return; }
    if (!listening){ finish(); toast('麦克风还没准备好，再按住说一次'); return; }
    sending=true; btn.textContent='转文字中…'; recTip.textContent='正在转成文字…';
    watchdog=setTimeout(deliver, 2500);                // 兜底：onend 迟迟不来也照样发出去
    try{ rec.stop(); }catch(e){ deliver(); }           // stop 会把最后一段识别结果交出来，onend 里发送
  };
  btn.addEventListener('pointerdown', press);
  btn.addEventListener('pointermove', e=>{ if(holding){ setZone(e.clientY < btn.getBoundingClientRect().top-50); } });
  btn.addEventListener('pointerup', release);
  btn.addEventListener('pointercancel', ()=>{ if(holding){ cancelZone=true; release(); } });
  btn.addEventListener('contextmenu', e=>e.preventDefault());   // iPad 长按别弹菜单

  rec.onstart=()=>{ listening=true; if (stopped){ try{ rec.abort(); }catch(e){} } };
  rec.onresult=e=>{
    if (stopped) return;     // 已经停了，丢弃后续残留的识别结果
    // 标准做法：只处理 resultIndex 之后的新结果，final 累加、interim 覆盖，避免重复拼接
    let tmp='';
    for (let i=(e.resultIndex||0); i<e.results.length; i++){
      const r=e.results[i], txt=r[0] && r[0].transcript ? r[0].transcript : '';
      if (r.isFinal) finalText += txt; else tmp += txt;
    }
    interim=tmp;
    recText.textContent=heard();
  };
  rec.onerror=ev=>{
    const err=ev&&ev.error;
    if (err==='aborted' || err==='no-speech') return;   // 主动停掉 / 暂时没声音：松手时再处理
    finish();
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
               || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
    if (err==='not-allowed'||err==='service-not-allowed')
      toast(isIOS ? '麦克风没开：iPad 设置 → Safari → 麦克风 打开，并确认 设置 → 通用 → 语言与地区 里有中文'
                  : '麦克风权限被拒绝了，在地址栏左边允许一下');
    else if (err==='network')   toast('语音识别要联网（Safari / Chrome 都走云端识别）');
    else if (err==='audio-capture') toast('没找到麦克风，检查下 iPad 的麦克风有没有被挡住');
    else toast('语音识别没成功，再按住说一次吧');
  };
  rec.onend=()=>{
    listening=false;
    if (stopped) return;
    if (sending){ deliver(); return; }
    if (holding){ finalText+=interim; interim=''; startRec(); }   // 还按着但浏览器自己停了：接着听
  };

  if (location.protocol==='file:')
    toast('提示：用 file:// 打开时 Chrome 的语音识别可能不可用，双击用 Safari 打开更稳');
}

/* ---------- 地图缩放 / 拖拽平移 ---------- */
const scroller=$('mapScroll'), svgEl=$('map');
let zoom=1, fitZ=1, autoFit=true;
const MINSCALE = 0.28, FITFLOOR = 0.46;   // 地图变大后，自动适应不再缩到看不清

function setZoom(z, ax, ay){
  const old = MAPW*zoom;
  z = Math.max(MINSCALE, Math.min(4, z));
  const k = (MAPW*z)/old;
  const sl = scroller.scrollLeft, st = scroller.scrollTop;
  zoom = z;
  svgEl.style.width = (MAPW*zoom)+'px';
  $('zoomPct').textContent = Math.round(zoom*100)+'%';
  if (ax!=null && ay!=null){
    scroller.scrollLeft = (sl+ax)*k - ax;
    scroller.scrollTop  = (st+ay)*k - ay;
  }
  autoFit = false;
}
function centerAnchor(){ return [scroller.clientWidth/2, scroller.clientHeight/2]; }
function fitMap(){
  fitZ = Math.min((scroller.clientWidth-6)/MAPW, (scroller.clientHeight-6)/MAPH);
  autoFit = true;
  zoom = Math.max(MINSCALE, Math.min(1, Math.max(fitZ, Math.min(FITFLOOR, fitZ*1.9))));
  svgEl.style.width = (MAPW*zoom)+'px';
  $('zoomPct').textContent = Math.round(zoom*100)+'%';
  scroller.scrollLeft = (MAPW*zoom - scroller.clientWidth)/2;
  scroller.scrollTop  = (MAPH*zoom - scroller.clientHeight)/2;
}
function centerOn(st){
  if (!st) return;
  // viewBox 有偏移 MAPX/MAPY，站点的页面坐标要减掉它再乘缩放
  scroller.scrollLeft = (st.x*S - MAPX)*zoom - scroller.clientWidth/2;
  scroller.scrollTop  = (st.y*S - MAPY)*zoom - scroller.clientHeight/2;
}
function flashStation(name){
  const rings=$('rings');
  const st=stationMap.get(name); if(!st) return;
  const html=`<circle cx="${st.x*S}" cy="${st.y*S}" r="16" fill="none" stroke="#FFD166" stroke-width="5">
    <animate attributeName="r" values="14;46;14" dur="1.1s" repeatCount="2"/>
    <animate attributeName="stroke-opacity" values="1;0;1" dur="1.1s" repeatCount="2"/></circle>`;
  rings.insertAdjacentHTML('beforeend', html);
  clearTimeout(flashStation._t);
  flashStation._t = setTimeout(updateMap, 2300);   // updateMap 会重建 rings，闪圈自动消失
}
function centerOnXY(x,y){
  scroller.scrollLeft = (x - MAPX)*zoom - scroller.clientWidth/2;
  scroller.scrollTop  = (y - MAPY)*zoom - scroller.clientHeight/2;
}

/* ---------- 到站特效：到站时的一圈光波 + 小星星 ---------- */
function burst(name){
  const g=document.getElementById('fx'); const st=stationMap.get(name);
  if(!g || !st) return;
  const cx=st.x*S, cy=st.y*S, col='#FFD166';
  let h=`<circle cx="${cx}" cy="${cy}" r="12" fill="none" stroke="${col}" stroke-width="7">
      <animate attributeName="r" values="12;78;12" dur="1s" fill="freeze"/>
      <animate attributeName="stroke-opacity" values=".95;0;0" dur="1s" fill="freeze"/></circle>
    <circle cx="${cx}" cy="${cy}" r="12" fill="none" stroke="#7DD3FC" stroke-width="4">
      <animate attributeName="r" values="12;58;12" dur="1s" begin="0.12s" fill="freeze"/>
      <animate attributeName="stroke-opacity" values=".9;0;0" dur="1s" begin="0.12s" fill="freeze"/></circle>`;
  for (let i=0;i<10;i++){
    const a=(-Math.PI/2) + (Math.PI*2/10)*i;
    const x2=cx+Math.cos(a)*66, y2=cy+Math.sin(a)*66;
    h+=`<circle cx="${cx}" cy="${cy}" r="5" fill="${i%2?'#FCD34D':'#7DD3FC'}">
      <animate attributeName="cx" values="${cx};${x2.toFixed(1)}" dur="0.85s" fill="freeze"/>
      <animate attributeName="cy" values="${cy};${y2.toFixed(1)}" dur="0.85s" fill="freeze"/>
      <animate attributeName="r" values="6;0" dur="0.85s" fill="freeze"/>
      <animate attributeName="fill-opacity" values="1;0" dur="0.85s" fill="freeze"/></circle>`;
  }
  g.innerHTML=h;
  clearTimeout(burst._t);
  burst._t=setTimeout(()=>{ if(g) g.innerHTML=''; }, 1150);
}

/* ---------- 行驶特效：列车从 A 站开到 B 站 ---------- */
function flyTrain(fromName,toName){
  return new Promise(resolve=>{
    const ride=document.getElementById('ride'), svg=document.getElementById('rideSvg');
    if(!ride||!svg){ resolve(); return; }
    const color = (LINES[state.line] && LINES[state.line].color) || '#FFD166';
    // 透明弹窗里的场景：站台 A 在最左、站台 B 在最右，火车水平开行（约 3 秒）
    const VW=1200, groundY=560, railTop=543, railBottom=557, carY=498;
    const aX=150, bX=1050, pw=64;             // 站台中心 / 半宽
    const startX=340, endX=860;              // 列车车身中心起止点
    svg.setAttribute('viewBox', `0 370 ${VW} 300`);   // 只取铁轨一带：路灯、站台、列车（没有天空背景）

    // 路灯：一根杆 + 灯臂 + 发光灯头（轻轻闪烁）
    const lamp=(x)=>`<g transform="translate(${x} ${groundY})">
        <rect x="-4" y="-150" width="8" height="150" rx="3" fill="#1E2A3E"/>
        <path d="M0 -150 q42 -2 48 -8" stroke="#1E2A3E" stroke-width="7" fill="none" stroke-linecap="round"/>
        <g transform="translate(48 -148)">
          <circle r="27" fill="#FFE9A8" fill-opacity=".16"><animate attributeName="fill-opacity" values=".22;.1;.22" dur="2.6s" repeatCount="indefinite"/></circle>
          <ellipse rx="20" ry="12" fill="#FFE9A8"/>
          <circle r="9" fill="#FFF6D8"><animate attributeName="fill-opacity" values="1;.75;1" dur="2.6s" repeatCount="indefinite"/></circle>
        </g></g>`;

    // 地铁列车（车头朝右，带线路色腰线、车窗、车头灯）
    const TRAIN = `<g id="rCar">
        <ellipse cx="0" cy="50" rx="116" ry="13" fill="#000" fill-opacity=".16"/>
        <rect x="-118" y="-30" width="236" height="60" rx="22" fill="#F4F7FB" stroke="${color}" stroke-width="4"/>
        <rect x="-118" y="-30" width="236" height="18" rx="11" fill="${color}"/>
        <rect x="-104" y="-6" width="200" height="20" rx="8" fill="${color}" fill-opacity=".5"/>
        <rect x="-112" y="-8" width="44" height="26" rx="10" fill="#0E2336"/>
        <rect x="-106" y="-3" width="32" height="15" rx="6" fill="#9FE0FF" fill-opacity=".9"/>
        <g fill="#0E2336" fill-opacity=".85">
          <rect x="-54" y="-4" width="28" height="18" rx="5"/>
          <rect x="-18" y="-4" width="28" height="18" rx="5"/>
          <rect x="18" y="-4" width="28" height="18" rx="5"/>
          <rect x="54" y="-4" width="28" height="18" rx="5"/>
        </g>
        <circle cx="110" cy="6" r="7" fill="#FFE066"/>
        <rect x="86" y="4" width="30" height="8" rx="4" fill="${color}"/>
        <g stroke="${color}" stroke-width="2.5" stroke-opacity=".7">
          <line x1="-72" y1="-6" x2="-72" y2="26"/>
          <line x1="0" y1="-6" x2="0" y2="26"/>
          <line x1="72" y1="-6" x2="72" y2="26"/>
        </g>
        <g fill="#1B2433">
          <circle cx="-72" cy="34" r="12"/><circle cx="0" cy="34" r="12"/><circle cx="72" cy="34" r="12"/>
        </g>
      </g>`;

    const station=(cx,emoji,name)=>`<g>
        <rect x="${cx-pw}" y="${groundY}" width="${pw*2}" height="68" rx="12" fill="#16263A" stroke="${color}" stroke-width="4"/>
        <rect x="${cx-pw}" y="${groundY}" width="${pw*2}" height="12" rx="6" fill="${color}" fill-opacity=".55"/>
        <text x="${cx}" y="${groundY-22}" text-anchor="middle" font-size="46" font-weight="800" font-family="sans-serif">${emoji}</text>
        <text x="${cx}" y="${groundY+46}" text-anchor="middle" font-size="26" fill="#fff" font-weight="800" font-family="sans-serif">${esc(name)}</text>
      </g>`;

    // 铁轨：一排枕木 + 两条钢轨（铺在地铁下面）
    let track='';
    for(let x=0; x<=VW; x+=46){
      track += `<rect x="${x}" y="540" width="16" height="20" rx="3" fill="#5A6478"/>`;
    }

    svg.innerHTML =
      `${lamp(400)} ${lamp(600)} ${lamp(800)}
       ${track}
       <line x1="0" y1="${railTop}" x2="${VW}" y2="${railTop}" stroke="#8B97AC" stroke-width="5"/>
       <line x1="0" y1="${railBottom}" x2="${VW}" y2="${railBottom}" stroke="#8B97AC" stroke-width="5"/>
       <line id="rRail" x1="${startX}" y1="${railTop}" x2="${startX}" y2="${railTop}" stroke="${color}" stroke-width="14" stroke-linecap="round" stroke-opacity=".95"/>
       <line id="rGlow" x1="${startX}" y1="${railTop}" x2="${startX}" y2="${railTop}" stroke="${color}" stroke-width="40" stroke-linecap="round" stroke-opacity=".16"/>
       ${station(aX,'🚉',fromName)}
       ${station(bX,'🎯',toName)}
       ${TRAIN}`;

    const rail=svg.querySelector('#rRail'), glow=svg.querySelector('#rGlow'), car=svg.querySelector('#rCar');
    car.setAttribute('transform', `translate(${startX} ${carY})`);

    const cap=document.getElementById('rideCap');
    if(cap) cap.textContent = `🚉 ${fromName}　→　🎯 ${toName}`;

    let skip=false;
    ride.onclick=()=>{ skip=true; };        // 点一下跳过动画
    ride.style.display='flex';
    requestAnimationFrame(()=>ride.classList.add('show'));

    const t0=performance.now(), dur=3000;
    let chuff=0, braked=false;
    trainHorn();                              // 出发鸣笛
    const step=now=>{
      let p=Math.min(1,(now-t0)/dur); if(skip) p=1;
      const e = p<.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;      // easeInOutQuad，总时长 3 秒
      const x=startX+(endX-startX)*e;
      car.setAttribute('transform', `translate(${x.toFixed(1)} ${carY})`);
      rail.setAttribute('x2',x.toFixed(1)); rail.setAttribute('y2',railTop);
      glow.setAttribute('x2',x.toFixed(1)); glow.setAttribute('y2',railTop);
      const want=Math.floor(p*8);
      if (want>chuff){ chuff=want; if (!skip) trainClack(); }   // 咔哒咔哒
      if (p>=.78 && !braked){ braked=true; trainBrake(); }       // 减速进站：刹车嘶声
      if (p<1) requestAnimationFrame(step);
      else {
        rideBurst(svg, endX, carY-6, color);
        settleTrain(car, endX, carY, 0, '', ()=>{
          ride.onclick=null;
          setTimeout(()=>{ ride.classList.remove('show'); setTimeout(()=>{ ride.style.display='none'; resolve(); }, 320); }, 700);
        });
      }
    };
    requestAnimationFrame(step);
  });
}

/* 到站全屏礼花（在 ride 覆盖层里放一圈光波 + 小星星） */
function rideBurst(svg, cx, cy, col){
  let h=`<g class="rburst">
    <circle cx="${cx}" cy="${cy}" r="16" fill="none" stroke="${col}" stroke-width="9"><animate attributeName="r" values="16;150;16" dur="1s" fill="freeze"/><animate attributeName="stroke-opacity" values=".95;0;0" dur="1s" fill="freeze"/></circle>
    <circle cx="${cx}" cy="${cy}" r="16" fill="none" stroke="#7DD3FC" stroke-width="6"><animate attributeName="r" values="16;110;16" dur="1s" begin="0.12s" fill="freeze"/><animate attributeName="stroke-opacity" values=".9;0;0" dur="1s" begin="0.12s" fill="freeze"/></circle>`;
  for(let i=0;i<14;i++){ const a=(-Math.PI/2)+(Math.PI*2/14)*i, x2=cx+Math.cos(a)*120, y2=cy+Math.sin(a)*120;
    h+=`<circle cx="${cx}" cy="${cy}" r="7" fill="${i%2?'#FCD34D':'#7DD3FC'}"><animate attributeName="cx" values="${cx};${x2.toFixed(1)}" dur=".9s" fill="freeze"/><animate attributeName="cy" values="${cy};${y2.toFixed(1)}" dur=".9s" fill="freeze"/><animate attributeName="r" values="8;0" dur=".9s" fill="freeze"/><animate attributeName="fill-opacity" values="1;0" dur=".9s" fill="freeze"/></circle>`; }
  h+='</g>';
  svg.insertAdjacentHTML('beforeend', h);
  setTimeout(()=>{ const g=svg.querySelector('.rburst'); if(g) g.remove(); }, 1200);
}

/* 小火车进站停靠：到站时轻轻弹两下，像真的减速停稳 */
function settleTrain(car, x, y, ang, flip, done){
  const t0=performance.now(), D=700;
  const step=now=>{
    const p=Math.min(1,(now-t0)/D);
    const bob=Math.sin(p*Math.PI*3)*(1-p)*3.2;
    car.setAttribute('transform', `translate(${x} ${y+bob}) rotate(${ang})${flip}`);
    if (p<1) requestAnimationFrame(step); else done();
  };
  requestAnimationFrame(step);
}

$('zoomIn').onclick =()=>{ const [ax,ay]=centerAnchor(); setZoom(zoom*1.25, ax, ay); };
$('zoomOut').onclick=()=>{ const [ax,ay]=centerAnchor(); setZoom(zoom/1.25, ax, ay); };
$('zoomFit').onclick=fitMap;

scroller.addEventListener('wheel',e=>{
  if (e.ctrlKey||e.metaKey){
    e.preventDefault();
    const r=scroller.getBoundingClientRect();
    setZoom(zoom*(e.deltaY<0?1.13:1/1.13), e.clientX-r.left, e.clientY-r.top);
  }
}, {passive:false});

/* 平移 + 捏合缩放：鼠标和触屏都走这里（.map-scroll 设了 touch-action:none） */
let dragging=false, moved=0, sx=0, sy=0, sl=0, stp=0;
let captured=null;
const pts=new Map();            // pointerId -> {x,y}
let pinchStart=null;            // 双指起始状态

const mid=()=>{
  const v=[...pts.values()];
  return {x:(v[0].x+v[1].x)/2, y:(v[0].y+v[1].y)/2,
          d:Math.hypot(v[0].x-v[1].x, v[0].y-v[1].y)};
};
const resetGesture=()=>{ pts.clear(); pinchStart=null; captured=null; };

scroller.addEventListener('pointerdown',e=>{
  if (e.pointerType==='mouse' && e.button!==0) return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if (pts.size===1){
    dragging=true; moved=0; sx=e.clientX; sy=e.clientY; sl=scroller.scrollLeft; stp=scroller.scrollTop;
    // 注意：这里不立即捕获指针，否则会抢走 click，导致点不中站台
  } else if (pts.size===2){
    dragging=false;                       // 进入捏合模式，不再平移
    moved=99;                             // 双指抬手时不要触发点站
    const m=mid();
    const r=scroller.getBoundingClientRect();
    pinchStart={ d:m.d, zoom, ax:m.x-r.left, ay:m.y-r.top };
    // 捏合时立刻捕获，避免手指移出地图后收不到事件
    try{ scroller.setPointerCapture(e.pointerId); }catch(_){}
  }
});
scroller.addEventListener('pointermove',e=>{
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});

  if (pts.size>=2 && pinchStart){
    const m=mid();
    if (pinchStart.d>8) setZoom(pinchStart.zoom * (m.d/pinchStart.d), pinchStart.ax, pinchStart.ay);
    e.preventDefault();
    return;
  }
  if (!dragging) return;
  const dx=e.clientX-sx, dy=e.clientY-sy;
  moved=Math.max(moved, Math.abs(dx)+Math.abs(dy));
  if (moved>4){
    scroller.classList.add('dragging');
    if (captured===null){ try{ scroller.setPointerCapture(e.pointerId); captured=e.pointerId; }catch(_){ captured=-1; } }
  }
  if (moved>4){ scroller.scrollLeft = sl-dx; scroller.scrollTop = stp-dy; }
});
const endDrag=e=>{
  pts.delete(e.pointerId);
  if (captured!==null && captured!==-1){ try{ scroller.releasePointerCapture(captured); }catch(_){} }
  if (pts.size<2) pinchStart=null;
  if (pts.size>0) return;                 // 还有手指按着
  if (dragging || moved){
    dragging=false;
    scroller.classList.remove('dragging');
    // moved 故意不清零：click 事件在 pointerup 之后触发，靠它判断「刚拖动过就不算点站」；
    // 下一次 pointerdown 会重新归零，所以不影响之后的点击
  }
  resetGesture();
};
scroller.addEventListener('pointerup',endDrag);
scroller.addEventListener('pointercancel',endDrag);
scroller.addEventListener('pointerleave',e=>{ if(e.pointerType!=='mouse') endDrag(e); });

/* 键盘方向键也能平移 */
document.addEventListener('keydown',e=>{
  if (['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  const step=80;
  if (e.key==='ArrowLeft')  { scroller.scrollLeft-=step; e.preventDefault(); }
  if (e.key==='ArrowRight') { scroller.scrollLeft+=step; e.preventDefault(); }
  if (e.key==='ArrowUp')    { scroller.scrollTop-=step;  e.preventDefault(); }
  if (e.key==='ArrowDown')  { scroller.scrollTop+=step;  e.preventDefault(); }
});

let rzT=null;
window.addEventListener('resize',()=>{
  clearTimeout(rzT);
  rzT=setTimeout(()=>{ if (autoFit) fitMap(); },120);
});

/* 出发 */
document.getElementById('map').addEventListener('click',e=>{
  if (moved>5) return;              // 刚拖动过，不当作点站
  const hit=e.target.closest('.hit'); if(!hit) return;
  speakStation(hit.dataset.name);   // 点任意站都报站名
  if (state.phase==='setup') startAt(hit.dataset.name);
  else if (state.phase==='play'){
    const n=hit.dataset.name;
    if (n===state.cur && stationMap.get(n).lines.length>1) toast('🚉 这里是换乘站，用右边的按钮换线路或换话题');
  }
});

/* ---------- 找车站（站点变多后靠它定位） ---------- */
const sInput=$('stationSearch'), sRes=$('searchRes');
function renderSearch(q){
  q=(q||'').trim();
  if (!q){ sRes.style.display='none'; sRes.innerHTML=''; return; }
  const hits=[...stationMap.values()]
    .filter(st=>st.name.includes(q))
    .sort((a,b)=> (a.name.indexOf(q)-b.name.indexOf(q)) || (b.lines.length-a.lines.length))
    .slice(0,12);
  sRes.innerHTML = hits.length
    ? hits.map(st=>`<div data-name="${st.name}">${st.name}<small>${st.lines.map(l=>LINES[l].name).join('/')}${st.lines.length>1?' 换乘':''}</small></div>`).join('')
    : `<div class="none">没有叫「${q}」的车站</div>`;
  sRes.style.display='';
}
function pickSearch(name){
  document.querySelectorAll('.lbl.found').forEach(el=>{ el.classList.remove('found'); if(!el.classList.contains('hub')) el.classList.remove('show'); });
  const lbl=document.querySelector(`.lbl[data-name="${name}"]`);
  if (lbl) lbl.classList.add('found','show');
  centerOn(stationMap.get(name));
  flashStation(name);
  beep(760,.07);
  toast(state.phase==='setup' ? `找到 ${name} —— 点地图上的圆点就从这儿出发` : `已定位到 ${name}`);
  sInput.value=name; renderSearch(name);
}
sInput.addEventListener('input',()=>renderSearch(sInput.value));
sInput.addEventListener('keydown',e=>{
  if (e.key==='Escape'){ sInput.value=''; renderSearch(''); sInput.blur(); }
  if (e.key==='Enter'){ const f=sRes.querySelector('div[data-name]'); if (f) pickSearch(f.dataset.name); }
});
sRes.addEventListener('click',e=>{ const d=e.target.closest('div[data-name]'); if(d) pickSearch(d.dataset.name); });
document.addEventListener('click',e=>{ if(!e.target.closest('.searchbox')){ sRes.style.display='none'; } });
sInput.addEventListener('focus',()=>renderSearch(sInput.value));

/* ---------- 图例：点一下只看某条线 ---------- */
$('legend').addEventListener('click',e=>{
  const el=e.target.closest('.lg'); if(!el) return;
  lineFilter = (el.dataset.line==='ALL' || el.dataset.line===lineFilter) ? 'ALL' : el.dataset.line;
  applyLineFilter();
  beep(620,.05);
});

/* ---------- 鼠标经过显示普通站名 ---------- */
$('map').addEventListener('mouseover',e=>{
  const n=e.target && e.target.dataset ? e.target.dataset.name : null; if(!n) return;
  const lbl=document.querySelector(`.lbl[data-name="${n}"]`); if(lbl) lbl.classList.add('show');
});
$('map').addEventListener('mouseout',e=>{
  const n=e.target && e.target.dataset ? e.target.dataset.name : null; if(!n) return;
  if (n===state.cur || n===state.dest) return;
  const lbl=document.querySelector(`.lbl[data-name="${n}"]`); if(lbl) lbl.classList.remove('show');
});

renderMap(); syncUI(); updateMap(); fitMap();
$('metaSub').textContent = `深圳地铁 · ${Object.keys(LINES).length} 线 ${stationMap.size} 站 · 真实站名`;

/* 到站后把小火车滚进视野 */
const _origUpdate = updateMap;
updateMap = function(){
  _origUpdate();
  if (state.cur && zoom > fitZ*1.05) centerOn(stationMap.get(state.cur));
};

showModal(`<div class="big">🚇</div><h3>佑佑的地铁话题大冒险</h3>
  <p>深圳地铁 <b>${Object.keys(LINES).length} 条线</b> · <b>${stationMap.size} 个站</b> · ${[...stationMap.values()].filter(s=>s.lines.length>1).length} 个换乘站，真实站名与站序<br>
  选一个站出发 → <b>🎤 说一个你想聊的话题</b> → 说得接得上，小火车才肯开到下一站。<br>
  <span style="font-size:12.5px">地图：按住拖动平移 · 按钮/滚轮缩放 · 方向键移动 · 右下角 🔍 可以直接搜站名 · 点图例只看一条线</span></p>
  <button class="btn primary" onclick="closeModal()">选个站出发</button>`);
</script>

  <!-- 全屏火车 ride 动画（答对时从 A 站开到 B 站） -->
