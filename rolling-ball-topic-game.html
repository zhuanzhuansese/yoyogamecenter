<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>天空滚球 · 佑佑的游戏屋</title>
<style>
:root{ --mc:#3B82F6; --ink:#1F2937; --mu:#6B7280; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#BFD9FF}
body{color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none;
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}
button{font:inherit;cursor:pointer}
#cv{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block}

#hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 0;pointer-events:none}
#hud .l{display:flex;gap:8px;pointer-events:auto}
#aiRoute{position:fixed;right:12px;top:calc(104px + env(safe-area-inset-top));z-index:60;pointer-events:none;background:rgba(255,255,255,.88);color:#0f766e;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;box-shadow:0 4px 14px -6px rgba(0,0,0,.3)}
#aiRoute.local{color:#9a3412}
.hb{border:0;border-radius:14px;background:rgba(255,255,255,.85);color:#334155;font-size:20px;font-weight:800;padding:6px 12px;text-decoration:none;box-shadow:0 4px 14px -6px rgba(0,0,0,.3)}
#wx:empty{display:none}
#target{margin:0 auto;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.92);border-radius:20px;padding:6px 18px 6px 14px;box-shadow:0 6px 20px -8px rgba(0,0,0,.35);border-bottom:5px solid var(--mc)}
#tLabel{font-size:15px;font-weight:800;color:var(--mu);line-height:1.2;text-align:center}
#tBig{font-size:40px;font-weight:900;color:var(--mc);line-height:1.1;min-width:44px;text-align:center}
#tBig ruby{font-family:"Kaiti SC","STKaiti","KaiTi",serif} #tBig rt{font:800 14px system-ui,sans-serif;color:#475569}
#hearts{font-size:22px;letter-spacing:1px;white-space:nowrap;background:rgba(255,255,255,.85);border-radius:14px;padding:4px 10px;box-shadow:0 4px 14px -6px rgba(0,0,0,.3)}
#slots{position:fixed;left:50%;transform:translateX(-50%);top:calc(84px + env(safe-area-inset-top));display:flex;gap:5px;pointer-events:none}
#slots span{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.55);border:2px dashed rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:var(--mc)}
#slots span.on{background:#fff;border:2px solid var(--mc);animation:pop .35s}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
#toast{position:fixed;left:50%;top:calc(150px + env(safe-area-inset-top));transform:translate(-50%,0);font-size:26px;font-weight:900;color:#fff;text-align:center;
  text-shadow:0 3px 0 rgba(0,0,0,.25),0 0 18px rgba(0,0,0,.25);pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap}
#toast.on{opacity:1}
#toast.bad{color:#FFE4E6}
#help{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(15,23,42,.55);color:#fff;border-radius:14px;padding:6px 14px;font-size:14px;font-weight:700;pointer-events:none;white-space:nowrap;transition:opacity .6s}
#cheer{position:fixed;left:50%;top:38%;z-index:6;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;opacity:0;transform:translate(-50%,-50%)}
#cheer b{width:150px;height:150px;border-radius:50%;background:#22C55E;color:#fff;font-size:110px;font-weight:900;line-height:150px;text-align:center;box-shadow:0 0 0 10px rgba(255,255,255,.9),0 18px 40px -8px rgba(0,0,0,.45)}
#cheer span{font-size:30px;font-weight:900;color:#fff;background:rgba(21,128,61,.92);border-radius:999px;padding:4px 20px;white-space:nowrap}
#cheer.on{animation:cheer 2s ease-out}
@keyframes cheer{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.18)}24%{transform:translate(-50%,-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
#count{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:120px;font-weight:900;color:#fff;text-shadow:0 6px 0 var(--mc),0 0 30px rgba(0,0,0,.25);pointer-events:none}

.screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;overflow:auto;padding:28px 18px 40px}
.screen.off{display:none}
#modes{background:linear-gradient(180deg,rgba(186,220,255,.96),rgba(255,228,240,.96))}
#modes h2{margin:0;font-size:32px;font-weight:900;color:#1E3A8A}
#modes .sub{margin:4px 0 14px;color:#475569;text-align:center}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;width:100%;max-width:780px}
.mwrap{display:flex;flex-direction:column;gap:8px}
.mwrap .mcard{flex:1}
.mcard{border:0;border-radius:20px;padding:12px 12px 10px;background:#fff;box-shadow:0 8px 24px -14px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;gap:6px;border-bottom:6px solid var(--c);transition:transform .12s}
.mcard:hover{transform:translateY(-3px)}
.mcard:active{transform:scale(.97)}
.mcard .e{font-size:42px;line-height:1.1}
.mcard .n{font-size:22px;font-weight:900;color:var(--c)}
.mcard .x{font-size:13.5px;color:var(--mu);text-align:center}
.mcard .b{font-size:13px;font-weight:800;color:var(--c)}
.mcard{cursor:pointer;user-select:none}
.mcard:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.lvbar{align-self:center;display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:5px 8px;box-shadow:0 6px 16px -10px rgba(0,0,0,.45);font-size:14px;font-weight:700;color:#334155}
.lvbar b{min-width:46px;text-align:center}
.lvb{border:0;width:34px;height:34px;border-radius:50%;background:#F1F5F9;color:var(--c);font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0;touch-action:manipulation}
.lvb:hover:not(:disabled){background:var(--c);color:#fff}
.lvb:disabled{opacity:.3;cursor:default}
.mcard .w{font-size:13px;font-weight:700;color:#B45309;min-height:20px}
#modes .hb{margin-top:22px;font-size:16px}

#modal{background:rgba(15,23,42,.5);justify-content:center}
.toggles{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:0 0 8px}
.tg{border:0;border-radius:999px;padding:9px 18px;font-weight:800;font-size:16px;background:#fff;color:#475569;box-shadow:0 4px 14px -8px rgba(0,0,0,.4)}
.tg.on{background:#1E3A8A;color:#fff}
.tgnote{font-size:13.5px;color:#334155;text-align:center;min-height:20px;margin:0 0 16px;max-width:640px}
/* 聊天面板：微信样式。灰色标题栏、灰底聊天区，对方白色气泡在左、自己绿色气泡在右，底下是输入栏 */
#aiPanel{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(700px,94vw);z-index:5;
  background:#EDEDED;border-radius:14px;overflow:hidden;box-shadow:0 12px 34px -12px rgba(0,0,0,.5);display:none;flex-direction:column}
#aiPanel.on{display:flex}
#aiTitle{background:#EDEDED;border-bottom:1px solid #D9D9D9;text-align:center;font-size:15px;font-weight:700;color:#111;padding:5px 10px}
#aiLog{display:flex;flex-direction:column;gap:8px;padding:8px 12px;max-height:min(22vh,170px);min-height:56px;overflow-y:auto;user-select:text;-webkit-user-select:text}
.msg{display:flex;gap:8px;align-items:flex-start}
.msg i{font-style:normal;font-size:22px;width:38px;height:38px;flex:none;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:6px}
.msg span{position:relative;background:#fff;color:#111;font-size:17px;line-height:1.45;padding:8px 12px;border-radius:6px;max-width:78%;word-break:break-word}
.msg span::before{content:'';position:absolute;top:12px;left:-6px;border:6px solid transparent;border-left:0;border-right-color:#fff}
.msg.me{flex-direction:row-reverse}
.msg.me span{background:#95EC69}
.msg.me span::before{left:auto;right:-6px;border-right:0;border-left:6px solid #95EC69}
.msg.sys{justify-content:center}
.msg.sys span{background:rgba(0,0,0,.1);color:#666;font-size:13px;padding:3px 10px;border-radius:4px;max-width:none}
.msg.sys span::before{display:none}
#aiRes{align-self:center;margin:0 0 6px;font-size:13px;font-weight:700;color:#fff;background:rgba(0,0,0,.35);border-radius:4px;padding:3px 10px}
#aiRes:empty{display:none}
#aiRes.good{background:#07C160} #aiRes.bad{background:#FA5151}
/* 换乘选项卡：贴在屏幕右侧的竖排小面板——不读语音、不挡球、不打断对话，点了才换乘，不点就继续往前开 */
#hub{position:fixed;right:calc(8px + env(safe-area-inset-right));top:50%;transform:translateY(-50%);z-index:6;width:min(238px,64vw);max-height:calc(100vh - 210px);overflow-y:auto;display:none;flex-direction:column;gap:8px;padding:10px;border-radius:16px;
  background:rgba(255,255,255,.84);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 10px 30px -12px rgba(0,0,0,.45)}
#hub .hubTopics{width:100%}
#hub .topics{grid-template-columns:repeat(2,1fr);gap:6px;margin:2px 0}
#hub.on{display:flex}
#hub .hubT{width:100%;text-align:left;font-size:14px;font-weight:800;color:#111;line-height:1.3}
#hub button{width:100%;text-align:left;border:0;border-radius:10px;color:#fff;font-size:14px;line-height:1.3;padding:8px 12px;text-shadow:0 1px 2px rgba(0,0,0,.35);box-shadow:0 3px 8px -4px rgba(0,0,0,.4)}
#hub button small{font-size:11px;opacity:.95}
.topics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0 18px}
.topicB{border:0;border-radius:18px;background:#F1F5F9;color:#0F172A;font-size:20px;font-weight:900;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 4px 12px -8px rgba(0,0,0,.4)}
.topicB span{font-size:46px;line-height:1.1}
@media (min-width:600px){ .topics{grid-template-columns:repeat(4,1fr)} }
.topicMic{display:block;width:100%;border:0;border-radius:18px;background:#07C160;color:#fff;font-size:24px;font-weight:900;padding:22px 12px;margin:14px 0 6px;animation:micgo 1.1s ease-in-out infinite}
.topicMic.on{background:#FA5151}
.topicHeard{min-height:30px;font-size:22px;font-weight:800;color:#0F172A}
.topicMore{border:0;background:none;color:#64748B;font-size:15px;font-weight:700;text-decoration:underline;margin:4px 0 8px}
#hints .topicB{font-size:15px;padding:6px 10px;background:#fff;box-shadow:0 3px 8px -4px rgba(0,0,0,.4)}
#hints .topicB span{font-size:26px}
#hub .topicMic{font-size:18px;padding:12px;margin:4px 0}
.topicB:active{transform:scale(.96)}
#hub .topicB{font-size:15px;padding:6px 10px;background:#fff;text-shadow:none;color:#0F172A;box-shadow:0 3px 8px -4px rgba(0,0,0,.4)}
#hub .topicB span{font-size:28px}
#aiBar{display:flex;gap:8px;align-items:center;background:#F7F7F7;border-top:1px solid #D9D9D9;padding:8px 10px}
#aiInput{flex:1;min-width:0;font:inherit;font-size:17px;padding:8px 10px;border:0;border-radius:6px;background:#fff;outline:none;user-select:text;-webkit-user-select:text}
.ab{border:0;border-radius:6px;padding:8px 14px;font-weight:700;font-size:16px;white-space:nowrap}
#aiSend{background:#07C160;color:#fff}
#aiMic{flex:1;background:#fff;color:#111;border:1px solid #D9D9D9;touch-action:none;font-size:18px;padding:11px 14px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#aiMic.on{background:#FA5151;color:#fff;border-color:#FA5151;animation:micgo 1s ease-in-out infinite}
#aiMic.go:not(.on){background:#07C160;color:#fff;border-color:#07C160;animation:micgo 1.1s ease-in-out infinite}
@keyframes micgo{50%{transform:scale(1.035);box-shadow:0 0 0 8px rgba(7,193,96,.25)}}
#hints{display:none;flex-wrap:wrap;gap:8px;justify-content:center;padding:6px 10px 8px;background:#F7F7F7;border-top:1px solid #D9D9D9}
#hints.on{display:flex}
#hints .hintT{width:100%;text-align:center;font-size:14px;font-weight:700;color:#555}
#hints button{border:1px solid #D9D9D9;background:#fff;border-radius:10px;padding:8px 12px;font-size:18px;font-weight:700;color:#111}
#hints button.say{border-color:#07C160;box-shadow:0 0 0 3px rgba(7,193,96,.3)}
#aiPanel.big .msg span{font-size:21px;font-weight:600}
#aiPanel.big .msg i{width:42px;height:42px;font-size:26px}
#stamp{position:fixed;left:50%;top:27%;z-index:7;pointer-events:none;opacity:0;transform:translate(-50%,-50%)}
#stamp b{display:flex;flex-direction:column;align-items:center;justify-content:center;width:124px;height:124px;border-radius:50%;border:7px double var(--sc,#07AC53);color:var(--sc,#07AC53);background:rgba(255,255,255,.94);font-size:24px;font-weight:900;line-height:1.15;transform:rotate(-12deg);box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
#stamp small{font-size:13px;font-weight:800}
#stamp.on{animation:stamp 1.7s ease-in forwards}
@keyframes stamp{0%{opacity:0;transform:translate(-50%,-50%) scale(2.4)}16%{opacity:1;transform:translate(-50%,-50%) scale(1)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-230%) scale(.3)}}
#slots.route{gap:0;align-items:center}
#slots.route span{width:22px;height:22px;border:3px solid var(--mc);background:#fff;font-size:13px;color:#fff;position:relative;flex:none}
#slots.route span.on{background:var(--mc);border-style:solid;animation:none}
#slots.route span.gold{box-shadow:0 0 0 3px #FACC15}
#slots.route span.nx{width:30px;height:30px;border-width:4px;border-style:solid;animation:micgo 1.1s ease-in-out infinite}
#slots.route span em{position:absolute;top:34px;left:50%;transform:translateX(-50%);font-style:normal;font-size:15px;font-weight:900;color:#0F172A;background:rgba(255,255,255,.92);border-radius:8px;padding:1px 8px;white-space:nowrap}
#slots.route i{width:14px;height:4px;background:var(--mc);opacity:.55;flex:none}
#stampBook .line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0;justify-content:center}
#stampBook .lb{color:#fff;font-weight:900;border-radius:8px;padding:3px 8px;font-size:14px}
#stampBook .sp{display:inline-flex;align-items:center;justify-content:center;min-width:46px;height:46px;border-radius:50%;border:3px double currentColor;font-size:12px;font-weight:900;padding:2px;background:#fff;transform:rotate(-8deg)}
#stampBook .sp.gold{box-shadow:0 0 0 3px #FACC15}
#stampBook .said{display:flex;flex-direction:column;gap:6px;margin:10px 0;text-align:left}
#stampBook .said button{border:0;background:#95EC69;border-radius:8px;padding:8px 12px;font-size:16px;text-align:left}
#aiBar [hidden]{display:none}
.ab:disabled,#aiInput:disabled{opacity:.5}
#mbox{background:#fff;border-radius:24px;padding:24px 22px;max-width:520px;width:100%;text-align:center;box-shadow:0 20px 60px -20px rgba(0,0,0,.5)}
#mbox h3{margin:0;font-size:32px;font-weight:900}
#mbox p{margin:6px 0;color:var(--mu)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 18px}
.chips span{background:#F1F5F9;border-radius:12px;padding:5px 10px;font-weight:800}
.wbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.wbtns button{border:0;border-radius:14px;padding:12px 20px;font-weight:800;font-size:17px}

@media (max-width:560px){
  #tBig{font-size:30px} #tLabel{font-size:13px} #hearts{font-size:16px;padding:4px 7px} .hb{font-size:17px;padding:5px 9px}
  #slots{top:calc(72px + env(safe-area-inset-top))} #slots span{width:24px;height:24px;font-size:13px}
  #toast{font-size:20px}
  #slots.route span{width:17px;height:17px;border-width:2px;font-size:10px} #slots.route span.nx{width:24px;height:24px} #slots.route i{width:8px}
  #aiPanel.big .msg span{font-size:18px}
  #aiTitle{display:none} #aiLog{max-height:16vh;min-height:44px;padding:6px 8px;gap:6px}
  .msg i{width:30px;height:30px;font-size:18px} .msg span{font-size:15px;padding:6px 10px} .msg span::before{top:9px}
  #aiBar{padding:6px 8px;gap:6px} .ab{padding:7px 10px;font-size:15px} #aiInput{font-size:16px}
  #cheer b{width:110px;height:110px;font-size:80px;line-height:110px} #cheer span{font-size:22px}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud">
  <div class="l"><a class="hb" href="/" title="回游戏屋">🏠</a><button class="hb" id="pauseBtn" title="暂停">⏸</button><button class="hb" id="modeBtn" title="返回模式选择">☰</button><span class="hb" id="wx" title="今天的天气"></span></div>
  <div id="target"><span id="tLabel">撞数字</span><span id="tBig">1</span></div>
  <div id="hearts"></div>
</div>
<div id="aiRoute"></div>
<div id="slots"></div>
<div id="toast"></div>
<div id="help">按住屏幕左边 / 右边，或者左右拖动，让球去撞对的东西</div>
<div id="count"></div>
<div id="cheer"><b>✓</b><span id="cheerTxt"></span></div>
<div id="stamp"><b><span id="stampName"></span><small id="stampSub"></small></b></div>
<div id="hub"></div>
<div id="aiPanel">
  <div id="aiTitle"></div>
  <div id="aiLog"></div>
  <div id="aiRes"></div>
  <div id="hints"></div>
  <div id="aiBar"><button class="ab" id="aiMic">🎤 点一下 说话</button><input id="aiInput" type="text" autocomplete="off" enterkeyhint="send" placeholder="接着话题说一句…">
    <button class="ab" id="aiSend">发送</button></div>
</div>

<div class="screen" id="modes">
  <h2>⚽ 天空滚球</h2>
  <div class="sub">小球在天空跑道上滚，左右控制它去撞对的东西！<br>撞对 10 个就到终点 🏁，别撞错，也别掉下去哦</div>
  <div class="toggles"><button class="tg" id="tgAI"></button><button class="tg" id="tgFence"></button><button class="tg" id="tgStamps">🎫 集章本</button></div>
  <div class="tgnote" id="tgNote"></div>
  <div class="mgrid" id="mgrid"></div>
  <a class="hb" href="/">🏠 回游戏屋</a>
</div>
<div class="screen off" id="modal"><div id="mbox"></div></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const GOAL = 10, MAX_HEARTS = 5;

/* ============================ 题库 ============================ */
const VEG = [['胡萝卜','🥕'],['西红柿','🍅'],['土豆','🥔'],['黄瓜','🥒'],['茄子','🍆'],['玉米','🌽'],['西兰花','🥦'],['白菜','🥬'],
  ['南瓜','🎃'],['青椒','🫑'],['辣椒','🌶️'],['洋葱','🧅'],['大蒜','🧄'],['蘑菇','🍄'],['红薯','🍠'],['豌豆','🫛']];
const FRUIT = [['苹果','🍎'],['青苹果','🍏'],['香蕉','🍌'],['西瓜','🍉'],['草莓','🍓'],['葡萄','🍇'],['橘子','🍊'],['柠檬','🍋'],
  ['桃子','🍑'],['梨','🍐'],['芒果','🥭'],['菠萝','🍍'],['樱桃','🍒'],['蓝莓','🫐'],['猕猴桃','🥝'],['椰子','🥥'],['哈密瓜','🍈'],['牛油果','🥑']];

function markStation(row, on){

    else if (row.entry && !e.station) e.portal = false;
    for (let k = -row.back; k < 0; k++) tun(S(k));

function dive(row, on, S, k0){
  if (!on){ for (const [sg, y1, y2] of row.saved || []) Object.assign(sg, { y1, y2, glass:false, glassZone:false }); row.saved = null; return; }

function listenOnce(onHeard, onDone){
  const rec = new SR();
  rec.lang = 'zh-CN'; rec.interimResults = true; rec.continuous = true;
  let fin = '', mid = '', done = false;
  const t0 = Date.now(); let lastT = t0;
  const heard = () => (fin + mid).trim();
  const end = send => { if (done) return; done = true; clearInterval(tick); try{ rec.abort(); }catch(e){} onDone(send ? heard() : ''); };
  rec.onresult = e => { let tmp = ''; for (let i = (e.resultIndex || 0); i < e.results.length; i++){ const r = e.results[i], t = (r[0] && r[0].transcript) || ''; if (r.isFinal) fin += t; else tmp += t; } mid = tmp; lastT = Date.now(); if (heard()) onHeard(heard()); };
  rec.onerror = ev => { if (ev && (ev.error === 'aborted' || ev.error === 'no-speech')) return; end(false); };
  rec.onend = () => { if (done) return; fin += mid; mid = ''; try{ rec.start(); }catch(e){ end(true); } };
  const tick = setInterval(() => { const now = Date.now(); if (heard() && now - lastT > 1400) end(true); else if (!heard() && now - t0 > 8000) end(false); else if (now - t0 > 20000) end(true); }, 200);

}

function readConfirm(text, t){
  const s = String(text || '').replace(/[\s，。！？、,.!?~～]/g, '');
  if (!s) return { again:true };
  if (/^(不|别|不对|不是|没有|算了|换一个|换个|重新)/.test(s)) return { no:true };
  if (s.includes(t.noun)) return { yes:true };
  // 「是」「对」「嗯」开头：后面没别的内容就是同意；后面还跟着词，往往是真正想聊的话题（「是恐龙」「好的，我想聊汽车」）
  const aff = /^(是的|没错|好的|嗯哪|嗯嗯|好啊|好吧|对啊|是|对|嗯|好|想要|想|要|可以|行|啊|呀|呢|嘛)+/.exec(s);
  if (aff){
    const rest = s.slice(aff[0].length);
    if (!rest) return { yes:true };
    const t2 = rest.length >= 2 && topicFromSpeech(rest);
    if (t2 && t2 !== t) return { yes:true, swap:t2 };
    return { yes:true };
  }
  // 直接说了一个已有话题（「天气」）：换成确认那个
  const k = TALK_TOPICS.find(x => s.includes(look(x)[1]) || s.includes(x.noun));
  if (k && k !== t) return { yes:true, swap:k };
  return { again:true };
}

    const v = voices.find(v => zh(v) && (v.name || '').toLowerCase().replace(/[^a-z]/g, '').includes(k)); if (v) return v;

/* 语音自己排队：一次只交给浏览器一句，念完（onend）再念下一句。

const tts = { q:[], cur:null, t:null };

/* 字母的读法：单独一个大写字母（A、B…）交给浏览器，常被当成单词 a 念成「啊」，中文语音念字母也不准。
   所以把句子拆开：中文部分用中文语音，字母用英文语音，并且写成读音（A → ay、W → double you） */
const LETTER_SAY = { A:'ay', B:'bee', C:'see', D:'dee', E:'ee', F:'eff', G:'gee', H:'aitch', I:'eye', J:'jay', K:'kay', L:'el', M:'em',
  N:'en', O:'oh', P:'pee', Q:'cue', R:'are', S:'ess', T:'tee', U:'you', V:'vee', W:'double you', X:'ex', Y:'why', Z:'zee' };
function speechParts(text, lang){
  const parts = [], isL = ch => /[A-Za-z]/.test(ch || '');

  const flush = () => { if (/[\p{L}\p{N}]/u.test(buf)) parts.push({ text:buf, lang }); buf = ''; };
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (/[A-Z]/.test(ch) && !isL(text[i - 1]) && !isL(text[i + 1])){ flush(); parts.push({ text:LETTER_SAY[ch], lang:'en-US' }); }

}
function speak(text, append, lang = 'zh-CN'){

function nextSpeech(){
  const item = tts.q.shift() || null;

  if (!item) return;
  const done = () => { if (tts.cur === item) nextSpeech(); };   // 被 cancel 掉的旧句子回调进来时直接忽略
  const go = () => {
    if (tts.cur !== item) return;
    try{
      const u = item.u = new SpeechSynthesisUtterance(item.text);   // 挂在 item 上，防止 Chrome 把它回收掉、不触发 onend

    tts.t = setTimeout(function check(){
      if (tts.cur !== item) return;
      if (!item.started && !speechSynthesis.speaking) return done();
      if (performance.now() - t0 > 3000 + [...item.text].length * 400) return done();

const sayText = it => it.cat === '单词' ? `${it.label}，${it.zh}` : it.q ? `${it.a}加${it.b}等于${it.label}！` : it.cat === '汉字' ? `${it.label}，${it.word}的${it.label}！` : it.label;
const sayItem = (it, append) => {
  if (it.cat === '单词'){ speak(it.label, append, 'en-US'); speak(it.label.toUpperCase().split('').join(' '), true, 'en-US'); speak(it.label, true, 'en-US'); speak(it.zh, true); return; }

/* 关卡：数字 11 关（数数 + 10~100 以内加法）、字母 3 关、汉字 4 关。

const LEVEL_KEY = 'yy-skyball-level';

const levelCount = m => m.stageAt ? 11 : m.stages ? m.stages.length : 0;
function getLevel(m){

/* 数字模式的关卡：第 1 关按顺序数 1→10；第 2 关起做加法，看到「2+2=?」就去撞 4。
   第 2 关和不超过 10，第 3 关不超过 20……每升一关上限加 10（最多 100）。题目尽量出在上限附近，越往后越难 */
function numberStage(level){
  if (level <= 0){ const s = Array.from({ length:10 }, (_, i) => numItem(i + 1)); s.name = '1 → 10'; s.level = 1; return s; }
  const max = Math.min(100, level * 10), lo = Math.max(2, Math.ceil(max * 0.4));
  const out = [], seen = new Set();
  for (let guard = 0; out.length < 10 && guard < 1000; guard++){
    const c = lo + rand(max - lo + 1), a = 1 + rand(c - 1), b = c - a, q = `${a}+${b}`;
    if (seen.has(q)) continue;
    seen.add(q); out.push({ key:q, label:String(c), q, a, b, ans:c, cat:'数字' });

}
function currentTarget(){
  const m = game.mode;

  return pick(left);
}
function distractors(target, n){
  const m = game.mode, out = [];
  const others = WORD_MODES.filter(w => w !== m && w.id !== m.near).flatMap(w => w.items);
  const used = new Set([target.key]);
  const add = it => { if (it && !used.has(it.key)){ used.add(it.key); out.push(it); } };
  if (m.id === 'metro'){
    while (out.length < n){ const s = pick(ALL_STATIONS); if (s !== target.label) add(stationItem(s)); }
    return out;
  }
  if (m.seq){
    // 先放一个「长得像 / 挨得近」的错数字（字母），再放一个别的种类
    const t = target.key, tv = target.ans != null ? target.ans : +t;
    if (target.cat === '单词'){
      const pool = game.seq.concat(game.seqAll || []).filter(w => w.key !== t);

    }
    const near = m.id === 'hanzi' ? [...(LOOKALIKE[t] || '')].map(hanziItem)
      : m.id === 'number'
      ? [-2, -1, 1, 2, 3].map(d => tv + d).filter(v => v > 0 && v !== tv).map(numItem)
      : [-2, -1, 1, 2].map(d => LETTERS[LETTERS.indexOf(t) + d]).filter(Boolean).map(letterItem);
    add(pick(near));
    while (out.length < n){
      const r = Math.random();
      if (r < 0.4 || target.q) add(target.q && r > 0.6 ? numItem(Math.max(1, tv + (rand(2) ? 1 : -1) * (3 + rand(3)))) : pick(near));

}

const LANES = [-0.62, 0, 0.62];
function makeRow(z){

    z = Math.ceil(z / SEG) * SEG;

    const under = !(el && el.has(prev) && el.has(target.label)), theme = SPOTS[target.label] || null;
    const row = { z, born:performance.now(), theme, zoneL:zoneLen(theme), back:under ? Math.max(0, Math.floor((z - startZ) / SEG) - 1) : 0,
      station:{ name:target.label, line:game.line, under }, items:[{ ...target, ok:true, lane:0, state:'idle', t:0, col:game.line.color }] };

/* 顺序模式（数字 / 字母 / 汉字）：聊天的问题由游戏按「这一排要撞的那个」来出，答案也由游戏自己判断，
   不让 AI 另出一道题（以前会出现跑道在算 2+4、聊天却在问 3+5） */
function seqAsk(t){
  if (t.q) return `${t.a}加${t.b}等于几呀？`;
  if (t.cat === '汉字') return `找一找「${t.label}」，${t.word}的${t.label}。你也说一遍吧！`;
  const prev = game.seq[game.seq.indexOf(t) - 1];
  return prev ? `${prev.label}后面是${t.cat === '字母' ? '哪个字母' : '几'}呀？` : `我们从${t.label}开始，跟我说：${t.label}！`;
}
const CN_NUM = { 零:0, 一:1, 二:2, 两:2, 三:3, 四:4, 五:5, 六:6, 七:7, 八:8, 九:9 };
// 孩子话里最后说的那个数（「2加4等于6」→ 6，「八」→ 8，「二十五」→ 25）
function lastNum(text){
  const all = text.match(/\d+|[零一二两三四五六七八九十百]+/g); if (!all) return null;
  const s = all[all.length - 1];
  if (/\d/.test(s)) return +s;
  let total = 0, cur = 0;
  for (const ch of s){ if (ch === '十' || ch === '百'){ total += (cur || 1) * (ch === '十' ? 10 : 100); cur = 0; } else cur = CN_NUM[ch]; }
  return total + cur;
}
// 顺序模式这一题该说什么类型的话（给 AI 纠错用，不含答案）
function seqKind(row){
  const t = row.items.find(i => i.ok);
  return t.cat === '数字' ? '这一题佑佑要说一个数字（可能是中文数字，比如「四」常被听成「是」）。' : t.cat === '字母' ? '这一题佑佑要说一个英文字母（比如「B」常被听成「必」）。' : '这一题佑佑要说一个汉字或者带这个字的词。';
}
function seqTalk(row, text){
  const t = row.items.find(i => i.ok);
  const ok = t.cat === '数字' ? lastNum(text) === (t.ans != null ? t.ans : +t.key)
    : t.cat === '字母' ? text.toUpperCase().includes(t.label)
    : text.includes(t.label) || text.includes(t.word);
  if (ok) return { ok:true, reply:`${pick(['对啦！', '真棒！', '答对啦！'])}${sayText(t)}` };
  // 连着答错 3 次就告诉他答案，接着往前滚，别卡在这一排（语音识别听错字母也不至于卡死）
  row.tries = (row.tries || 0) + 1;
  if (row.tries >= 3) return { ok:true, reply:`没关系，我们一起记住：${sayText(t)}` };
  return { ok:false, reply: t.q ? `再算算哦，${t.a}加${t.b}等于几呀？` : t.cat === '汉字' ? `我们在找「${t.label}」，${t.word}的${t.label}，再说一遍吧～` : `不对哦，${seqAsk(t)}` };
}

// 孩子话里提到了这个话题里的哪样东西（取最长的，比如「青苹果」优先于「苹果」）
function mentioned(text, m = topicMode()){
  if (!m.items) return null;
  let best = null;
  for (const it of m.items) if (text.includes(it.label) && (!best || it.label.length > best.label.length)) best = it;
  return best;
}
function otherCat(text){
  for (const w of [...WORD_MODES, SUBWAY_TOPIC]) if (w !== topicMode()){ const it = mentioned(text, w); if (it) return { it, w }; }
  return null;
}
// 没连 AI 时的本地判断：提到这个话题的东西 / 话题名，或者接着上一个东西往下说，就算切题
function localTalk(text){
  const m = topicMode();
  if (game.convo.some(c => c.role === 'kid' && c.text === text)) return { ok:false, reply:'这句刚才说过啦，换一句新的吧～' };
  if (/不知道|不记得|不想说|随便/.test(text) && !mentioned(text)) return { ok:false, reply:`没关系～你可以说说你见过的${m.noun}，或者喜欢的${m.noun}呀！` };
  if (m.free){
    if ([...text].length < 2) return { ok:false, reply:'再多说一点点吧～' };
    return { ok:true, reply:`${pick(['说得真好！', '对呀！', '好棒！'])}${pick([`再跟我说说${m.noun}吧！`, `还有呢？`, `为什么呀？`])}` };
  }
  const subj = mentioned(text), other = otherCat(text);
  const ok = !!subj || text.includes(m.noun) || (!!game.lastSubj && [...text].length >= 3 && !other);
  if (!ok) return { ok:false, reply: other ? `${other.it.label}是${other.w.noun}哦，我们在聊${m.noun}，再说一句吧～` : `我们在聊${m.noun}哦，说一句和${m.noun}有关的话吧～` };
  const s = subj ? subj.label : game.lastSubj;
  let pool;
  if (!s) pool = [`你最喜欢哪种${m.noun}呀？`, `说说你见过的${m.noun}吧！`];
  else if (m.id === 'train') pool = [`${s}有几个轮子呀？`, `你坐过${s}吗？`, `${s}跑得快不快？`, `${s}是什么颜色的？`];

  else if (m.id === 'family') pool = [`${s}喜欢做什么呀？`, `你和${s}一起玩什么？`, `${s}长什么样子呀？`];
  else if (m.id === 'weather') pool = [`${s}的时候你喜欢做什么？`, `${s}要穿什么衣服呀？`, `你喜欢${s}吗？`];
  else if (m.id === 'time') pool = [`${s}你会做什么呀？`, `你喜欢${s}吗？为什么？`];
  else if (m.id === 'kinder') pool = [`说说${s}吧！`, `${s}好玩吗？`, `你喜欢${s}吗？为什么？`];
  else if (m.id === 'number') pool = ['你会数到几呀？', '你有几个好朋友？', '你家里有几个人？'];
  else if (m.id === 'animal') pool = [`${s}会怎么叫呀？`, `${s}住在哪里呀？`, `${s}喜欢吃什么呀？`, `${s}是什么颜色的？`];

  return { ok:true, reply:`${pick(['说得真好！', '对呀！', '好棒！'])}${pick(pool)}` };

// 问 AI 要一行 JSON：有 Amp AI 走 api/chat，否则用配置的 API Key；失败就标记成本地脚本
async function aiJSON(system, prompt, temperature = 0.7){
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 12000);
  try{
    let o = null;
    if (ampAI){
      const r = await fetch('api/chat', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ system, prompt }), signal:ctl.signal });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      o = await r.json();
    } else {
      const r = await fetch(cfg.endpoint.replace(/\/+$/, '') + '/chat/completions', {
        method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + cfg.key }, signal:ctl.signal,
        body:JSON.stringify({ model:cfg.model, temperature, messages:[{ role:'system', content:system }, { role:'user', content:prompt }] })
      });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      const txt = ((j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '').trim().replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
      try{ o = JSON.parse(txt); }catch(_){ const mm = txt.match(/\{[\s\S]*\}/); if (mm) o = JSON.parse(mm[0]); }
    }
    if (aiFailed){ aiFailed = false; renderRoute(); }
    return o;
  }catch(e){
    aiFailed = true; renderRoute();
    throw e;
  }finally{ clearTimeout(timer); }
}
// 语音识别听小朋友说话常有同音错字（「平果」「是」）：把候选句和这一句该说什么类型的话交给 AI，推断他真正说的话
async function aiHear(alts, kind){

    const o = await aiJSON('你帮 4 岁半的佑佑纠正语音识别的同音错字。只输出一行 JSON，不要任何解释。',
      `${kind}\n语音识别听到的候选（可能有同音错字）：${alts.join(' / ')}\n推断佑佑实际说的话，不要替他改成别的意思。只返回：{"heard": "佑佑实际说的话"}`, 0.2);
    const h = o && typeof o.heard === 'string' ? o.heard.trim() : '';

}
async function aiChat(text, alts = []){

/* ---------- 语音输入：点一下说话，说完停一下就自动发送（再点一下也能马上发送）。一直按着对小朋友太难 ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const micReady = !!(SR && window.isSecureContext);
// 能用麦克风：底下只留一个「点一下 说话」；不能用（没有语音识别或者不是 https）才显示打字框和发送
$('aiInput').hidden = $('aiSend').hidden = micReady;
$('aiMic').hidden = !micReady;
let stopMic = () => {};
if (micReady){
  const rec = new SR();
  rec.lang = 'zh-CN'; rec.interimResults = true; rec.continuous = true; rec.maxAlternatives = 5;   // 多个候选交给 AI 挑
  const btn = $('aiMic');
  const SILENCE = 1400, NOTHING = 8000, MAX_T = 20000;   // 说完停 1.4 秒就发送；8 秒没出声就停；最长 20 秒
  let active = false, listening = false, finalText = '', interim = '', t0 = 0, lastT = 0, tick = null;
  let finalAlts = [], interimAlts = [];   // 每一段话的候选，第一个是最可能的
  const heard = () => (finalText + interim).trim();
  // 整句候选：最可能的一句，加上把某一段换成它的其他候选
  const candidates = () => {
    const segs = [...finalAlts, ...interimAlts].filter(a => a.length);
    const out = [segs.map(a => a[0]).join('')];
    segs.forEach((alts, k) => alts.slice(1).forEach(alt => out.push(segs.map((a, j) => j === k ? alt : a[0]).join(''))));
    return [...new Set(out.map(x => x.trim()).filter(Boolean))].slice(0, 6);
  };
  const finish = () => {
    clearInterval(tick); active = false;
    if (listening){ try{ rec.abort(); }catch(e){} }
    listening = false; btn.classList.remove('on');
    setAiInput(!!game.inputOn);   // 按钮恢复成「点一下 说话」或者等待的字
  };
  stopMic = () => { if (active) finish(); };
  const deliver = () => { if (!active) return; const t = heard(); finish(); if (!t){ aiNote('没听到，点一下再说一次吧～'); return; } aiSubmit(t, candidates()); };
  const startRec = () => { try{ rec.start(); }catch(e){ setTimeout(() => { if (!active) return; try{ rec.start(); }catch(_){ finish(); aiNote('麦克风启动失败，再点一下试试'); } }, 300); } };
  const check = () => {
    const now = Date.now();
    if (heard() && now - lastT > SILENCE) deliver();
    else if (!heard() && now - t0 > NOTHING){ finish(); aiNote('没听到声音，点一下再说一次吧～'); }
    else if (now - t0 > MAX_T) deliver();
  };
  btn.addEventListener('click', () => {
    if (active){ if (heard()) deliver(); else finish(); return; }   // 正在听：再点一下就发送（还没说就取消）
    if (btn.disabled) return;
    stopSpeech();
    active = true; finalText = ''; interim = ''; finalAlts = []; interimAlts = []; t0 = lastT = Date.now();
    btn.classList.add('on'); btn.textContent = '🔴 我在听…说完点一下'; $('aiInput').value = '';
    startRec(); tick = setInterval(check, 200);
  });
  btn.addEventListener('contextmenu', e => e.preventDefault());
  rec.onstart = () => { listening = true; if (!active){ try{ rec.abort(); }catch(e){} } };
  rec.onresult = e => {
    if (!active) return;
    let tmp = ''; interimAlts = [];
    for (let i = (e.resultIndex || 0); i < e.results.length; i++){
      const r = e.results[i], t = (r[0] && r[0].transcript) || '', alts = Array.from(r, a => a.transcript || '').filter(Boolean);
      if (r.isFinal){ finalText += t; finalAlts.push(alts); } else { tmp += t; interimAlts.push(alts); }
    }
    interim = tmp; lastT = Date.now(); $('aiInput').value = heard();
    if (heard()) aiNote(`🎤 ${heard()}`, '');   // 边说边显示听到的字
  };
  rec.onerror = ev => {
    const err = ev && ev.error;
    if (err === 'aborted' || err === 'no-speech') return;
    finish();

  };
  // iPad 的 Safari 说完一句就会自己停，还在听的话接着开
  rec.onend = () => { listening = false; if (!active) return; finalText += interim; interim = ''; finalAlts.push(...interimAlts); interimAlts = []; startRec(); };
}

function resolveRow(row){

  }
  const it = best.it; it.t = performance.now();
  const p = itemScreen.get(it);

    it.state = 'got';
    game.got.push(it);

    if (!talkMode()){ if (m.ball === 'mouse') speak(`${it.label}！嗷呜，好吃～`); else if (m.id === 'cookie') speak(`${it.label}！咔嚓咔嚓，香香脆脆～`); else sayItem(it); }
    if (p && m.ball !== 'mouse') launch(it, p);   // 小老鼠模式里蔬菜被吃掉，其他模式撞飞
    if (m.id === 'metro') metroArrive(it);

    const want = hz ? `要找「${target ? target.label : ''}」` : m.seq ? `要撞 ${target ? target.label : ''}` : `要撞${m.noun}`;
    const what = it.cat === m.noun ? (hz ? `这是「${it.label}」` : `这是 ${it.label}`) : `${it.emoji || ''}${it.label}是${it.cat}`;
    if (target && target.cat === '单词'){ toast(`这是 ${it.label}（${it.zh}），要找 ${target.pic}`, true); speak(it.label, false, 'en-US'); speak(`是${it.zh}，不对哦，要找`, true); speak(target.label, true, 'en-US'); }

/* ============================ 赛道（伪 3D，参考 OutRun 的分段投影） ============================ */
const SEG = 200, ROADW = 1300, CAMH = 1000, FOV = 100, DRAW = 200, THICK = 520, BALLR = 250, ITEMR = 300;
const camDepth = 1 / Math.tan(FOV / 2 * Math.PI / 180);
const playerZ = CAMH * camDepth * 1.5;
const ROW_AHEAD = 46 * SEG, AI_STOP = 14 * SEG, FENCE_H = 380, TUN_H = 2000, TUBE_H = 2300;
let segs = [], trackLen = 1;

const easeIn = (a, b, t) => a + (b - a) * t * t;
const easeInOut = (a, b, t) => a + (b - a) * ((-Math.cos(t * Math.PI) / 2) + 0.5);
function addSeg(curve, y){
  const n = segs.length, y1 = n ? segs[n - 1].y2 : 0;
  segs.push({ i:n, z1:n * SEG, z2:(n + 1) * SEG, y1, y2:y, curve });
}
function addRoad(enter, hold, leave, curve, hill){
  const sY = segs.length ? segs[segs.length - 1].y2 : 0, eY = sY + hill * SEG, tot = enter + hold + leave;
  for (let i = 0; i < enter; i++) addSeg(easeIn(0, curve, i / enter), easeInOut(sY, eY, i / tot));
  for (let i = 0; i < hold; i++)  addSeg(curve, easeInOut(sY, eY, (enter + i) / tot));
  for (let i = 0; i < leave; i++) addSeg(easeInOut(curve, 0, i / leave), easeInOut(sY, eY, (enter + hold + i) / tot));
}
let seaY = -3000;
function buildTrack(world){
  segs = [];
  addRoad(30, 60, 30, 0, 0);
  if (world === 'coaster') for (let k = 0; k < 16; k++){
    // 过山车：慢慢爬上一个大坡，再一口气冲下来；一上一下差不多抵消，赛道不会越飘越高
    const h = pick([40, 55, 70]), cv = () => pick([-2.5, -1.8, 0, 0, 1.8, 2.5]);
    addRoad(28 + rand(10), 8 + rand(14), 28 + rand(10), cv(), h);
    addRoad(16 + rand(8), 4 + rand(8), 16 + rand(8), cv(), -h + pick([0, 6, -6]));
  }
  else for (let k = 0; k < 26; k++) addRoad(25, 25 + rand(40), 25, pick([-2.5, -1.8, -1.2, 0, 0, 1.2, 1.8, 2.5]), pick([0, 0, 12, -12, 20, -20]));
  addRoad(30, 30, 30, 0, -segs[segs.length - 1].y2 / SEG);   // 回到起点高度，赛道首尾相接
  trackLen = segs.length * SEG;
  const rail = world === 'rail', city = rail && !!(game.mode && game.mode.city);
  if (rail){
    // 铁路比较平：把高低起伏压到 3000 以内，潜进海底的坡才不会太陡
    const lo = Math.min(...segs.map(sg => sg.y1)), hi = Math.max(...segs.map(sg => sg.y1));
    const k = Math.min(1, 3000 / Math.max(1, hi - lo));
    for (const sg of segs){ sg.y1 *= k; sg.y2 *= k; }
  }
  // 海面在最低点下面一大截
  seaY = Math.min(...segs.map(sg => sg.y1)) - 2800;
  if (rail && !city){
    // 海底玻璃隧道（先排它，隧道再避开它）：铁路慢慢潜到海面下 3600，在玻璃管里走一段再爬上来。
    // 第一段放得早一点（一局大约跑 500~900 节），保证每局都能钻到海底；头尾高度不变，赛道照样首尾相接
    const L = 340;
    const starts = [200 + rand(150)];
    const second = starts[0] + L + 400 + rand(Math.max(1, segs.length - starts[0] - 2 * L - 600));
    if (second + L < segs.length - 150) starts.push(second);
    for (const i0 of starts){
      const D = Math.min(...segs.slice(i0, i0 + L).map(sg => sg.y1)) - (seaY - 3600);
      const prof = k => { const t = k / L; return D * (t < .35 ? easeInOut(0, 1, t / .35) : t > .65 ? easeInOut(1, 0, (t - .65) / .35) : 1); };
      const ys = [];
      for (let k = 0; k <= L; k++) ys.push((k < L ? segs[i0 + k].y1 : segs[i0 + L - 1].y2) - prof(k));
      for (let k = 0; k < L; k++){
        const sg = segs[i0 + k];
        sg.y1 = ys[k]; sg.y2 = ys[k + 1]; sg.glassZone = true;
        if (Math.min(sg.y1, sg.y2) < seaY + 500) sg.glass = true;
      }
    }
  }
  // 时不时有一段隧道：穿过一座小山（不和海底隧道重叠）
  for (let i = 160 + rand(200); !city; ){
    const len = rail ? 90 + rand(80) : 70 + rand(60);
    if (i + len >= segs.length - 100) break;
    let clash = -1;
    for (let k = -30; k < len + 30; k++) if (segs[i + k] && segs[i + k].glassZone){ clash = i + k; break; }
    if (clash >= 0){ while (segs[clash] && segs[clash].glassZone) clash++; i = clash + 40; continue; }
    for (let k = 0; k < len; k++) segs[i + k].tunnel = true;
    segs[i].portal = true;
    i += len + (rail ? 140 + rand(200) : 260 + rand(340));
  }
  // 铁路世界在路边随机摆几座从海里冒出来的山
  if (world === 'coaster') for (const sg of segs) if (!sg.tunnel && Math.random() < 0.035)
    sg.deco = { type:Math.random() < 0.5 ? 'wheel' : 'loop', side:Math.random() < 0.5 ? -1 : 1, off:2.8 + Math.random() * 2, k:0.8 + Math.random() * 0.6 };
  // 深圳：路边是海边的高楼和小公园
  if (city) for (const sg of segs) if (!sg.tunnel && Math.random() < 0.07)
    sg.bld = { side:Math.random() < 0.5 ? -1 : 1, off:2.4 + Math.random() * 2.6, h:0.5 + Math.random() * 1.1, w:0.45 + Math.random() * 0.4,
      park:Math.random() < 0.3, top:pick(['flat', 'flat', 'spire', 'round']), k:rand(5), seed:rand(1000) };
  if (rail && !city) for (const sg of segs) if (!sg.tunnel && !sg.glassZone && Math.random() < 0.05)
    sg.mtn = { side:Math.random() < 0.5 ? -1 : 1, off:2.6 + Math.random() * 2.2, h:0.8 + Math.random() * 0.9, w:0.9 + Math.random() * 0.8, snow:Math.random() < 0.4 };
}
const segAt = z => segs[Math.floor(((z % trackLen) + trackLen) % trackLen / SEG)];
const trackY = z => { const s = segAt(z), p = (((z % trackLen) + trackLen) % trackLen % SEG) / SEG; return s.y1 + (s.y2 - s.y1) * p; };

const SKIES = {
  day:   { top:'#5FA8FF', mid:'#A9C8FF', hor:'#FFD3E6', sea1:'#FFE6F1', sea2:'#F3ECFF', cloud:'255,255,255', ca:.75 },
  dusk:  { top:'#4338CA', mid:'#F472B6', hor:'#FDBA74', sea1:'#FED7AA', sea2:'#FBCFE8', cloud:'255,214,201', ca:.7 },
  night: { top:'#070B24', mid:'#1E1B4B', hor:'#3B3486', sea1:'#2E2A6B', sea2:'#141432', cloud:'110,120,165', ca:.45 },
  grey:  { top:'#7C8BA1', mid:'#A7B4C6', hor:'#D5DCE6', sea1:'#E2E8F0', sea2:'#CBD5E1', cloud:'226,232,240', ca:.85 },
  snow:  { top:'#9DB4D3', mid:'#C9D6E8', hor:'#EEF2F8', sea1:'#F1F5F9', sea2:'#E2E8F0', cloud:'248,250,252', ca:.9 }
};
function mixHex(a, b, t){
  const A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16);
  const c = sh => Math.round(((A >> sh) & 255) * (1 - t) + ((B >> sh) & 255) * t);
  return '#' + ((c(16) << 16) | (c(8) << 8) | c(0)).toString(16).padStart(6, '0');
}
let tun = {}, uw = {}, palSubA = {}, palSubB = {}, skyEdge = { top:'#5FA8FF', bot:'#F3ECFF' };
function paintSky(){
  if (!W) return;
  const mc = game.mode ? game.mode.color : '#3B82F6';
  const env = game.env || { time:'day', weather:'clear' };
  const wet = env.weather === 'rain' || env.weather === 'cloudy';
  // 天黑 / 傍晚 / 阴雨天，跑道颜色跟着暗一点（要撞的东西不变暗，晚上反而更显眼）
  const dim = env.time === 'night' ? 0.45 : env.time === 'dusk' ? 0.18 : wet ? 0.14 : 0;
  const dimTo = env.time === 'night' ? '#1E1B4B' : env.time === 'dusk' ? '#7C2D12' : '#475569';
  const L = h => dim ? mixHex(h, dimTo, dim) : h;
  pal = { light:L(mixHex(mc, '#FFFFFF', .82)), dark:L(mixHex(mc, '#FFFFFF', .62)), side:L(mixHex(mc, '#000000', .3)), side2:L(mixHex(mc, '#000000', .45)), rumble:L(mc), white:L('#FFFFFF') };
  Object.assign(pal, { gravelA:L('#A8A29E'), gravelB:L('#948D86'), tie:L('#8B5A2B'), rail:L('#E2E8F0') });
  tun = { mtnGreen:L('#3F8F57'), wallA:L('#8A8178'), wallB:L('#7A726A'), ceil:L('#5E5852'), walk:L('#B8B0A8'), rock:L('#8B7E74'), arch:L('#D6CFC7'),
    cap: env.weather === 'snow' ? '#F8FAFC' : L('#4ADE80') };
  uw = { top:L('#38BDF8'), mid:L('#0369A1'), bot:L('#0C4A6E'), sand:L('#E9D8A6'), weed:L('#15803D') };
  const sub = t => Object.fromEntries(Object.entries(pal).map(([k, v]) => [k, mixHex(v, '#0369A1', t)]));
  palSubA = sub(.55); palSubB = sub(.18);   // 在海面上看水下的路：很蓝；人在海底隧道里：淡淡一点蓝
  const sk = env.time === 'night' ? SKIES.night : wet ? SKIES.grey : env.weather === 'snow' ? SKIES.snow : SKIES[env.time];
  skyEdge = { top:sk.top, bot:game.mode && game.mode.world === 'rail' ? L('#0369A1') : sk.sea2 };
  // 天空 + 云海，做成两倍宽的横条，转弯时横向滚动
  sky = document.createElement('canvas');
  const SW = Math.round(W * 2);
  sky.width = SW * DPR; sky.height = cv.height;
  const c = sky.getContext('2d');
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, sk.top); g.addColorStop(yH / H * 0.6, sk.mid); g.addColorStop(yH / H, sk.hor);
  g.addColorStop(Math.min(1, yH / H + 0.02), sk.sea1); g.addColorStop(1, sk.sea2);
  c.fillStyle = g; c.fillRect(0, 0, SW, H);
  let seed = 7; const R = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const glow = (x, y, r, col, a) => { const gg = c.createRadialGradient(x, y, 0, x, y, r); gg.addColorStop(0, `rgba(${col},${a})`); gg.addColorStop(1, `rgba(${col},0)`); c.fillStyle = gg; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); };
  if (env.time === 'night'){
    // 星星 + 月亮
    for (let i = 0; i < 160; i++){ c.globalAlpha = 0.3 + R() * 0.7; c.fillStyle = '#FFFFFF'; c.beginPath(); c.arc(R() * SW, R() * yH * 0.95, 0.5 + R() * 1.4, 0, Math.PI * 2); c.fill(); }
    c.globalAlpha = 1;
    const mx = SW * 0.32, my = yH * 0.3, mr = Math.max(18, yH * 0.09);
    glow(mx, my, mr * 3.2, '254,249,195', .25);
    c.fillStyle = '#FEF9C3'; c.beginPath(); c.arc(mx, my, mr, 0, Math.PI * 2); c.fill();
    c.fillStyle = 'rgba(202,190,140,.45)';
    for (const [dx, dy, rr] of [[-.3, -.2, .22], [.25, .15, .16], [-.05, .35, .12]]){ c.beginPath(); c.arc(mx + dx * mr, my + dy * mr, rr * mr, 0, Math.PI * 2); c.fill(); }
  } else if (env.time === 'dusk' && !wet){
    const sx = SW * 0.3, sy = yH * 0.82, sr = Math.max(26, yH * 0.13);
    glow(sx, sy, sr * 3.5, '253,186,116', .55);
    c.fillStyle = '#FB923C'; c.beginPath(); c.arc(sx, sy, sr, 0, Math.PI * 2); c.fill();
  } else if (!wet && env.weather !== 'snow'){
    const sx = SW * 0.14, sy = yH * 0.24, sr = Math.max(20, yH * 0.08);
    glow(sx, sy, sr * 4, '255,247,174', .6);
    c.fillStyle = '#FDE047'; c.beginPath(); c.arc(sx, sy, sr, 0, Math.PI * 2); c.fill();
  }
  if (env.weather === 'rainbow'){
    const rx = SW * 0.36, ry = yH + 30, rr = yH * 0.85;
    c.lineWidth = Math.max(6, yH * 0.03); c.globalAlpha = 0.45;
    ['#EF4444','#F97316','#FACC15','#22C55E','#3B82F6','#6366F1','#A855F7'].forEach((col, i) => { c.strokeStyle = col; c.beginPath(); c.arc(rx, ry, rr - i * c.lineWidth, Math.PI, 0); c.stroke(); });
    c.globalAlpha = 1;
  }
  // 远处漂浮的彩色小星球
  for (let i = 0; i < (game.mode && game.mode.world ? 0 : 9); i++){   // 铁路 / 过山车世界有自己的风景（山海、气球烟花），不放小星球
    const x = R() * SW, y = yH * (0.12 + R() * 0.6), r = 10 + R() * 34, col = TOKEN_COLS[Math.floor(R() * TOKEN_COLS.length)];
    const pg = c.createRadialGradient(x - r * .3, y - r * .3, r * .1, x, y, r);
    pg.addColorStop(0, '#fff'); pg.addColorStop(.35, mix(col, '#FFFFFF', .35)); pg.addColorStop(1, col);
    c.globalAlpha = env.time === 'day' && !wet ? 0.55 : 0.3; c.fillStyle = pg; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
    if (R() < 0.35){ c.strokeStyle = 'rgba(255,255,255,.8)'; c.lineWidth = 2; c.beginPath(); c.ellipse(x, y, r * 1.7, r * .45, -0.3, 0, Math.PI * 2); c.stroke(); }
  }
  c.globalAlpha = 1;
  // 云：地平线附近和云海里
  const puff = (x, y, s, a) => {
    c.fillStyle = `rgba(${sk.cloud},${a})`;
    for (const [dx, dy, r] of [[0, 0, 1], [-.9, .25, .7], [.9, .25, .75], [-.45, -.35, .7], [.5, -.3, .65]]){ c.beginPath(); c.arc(x + dx * s, y + dy * s, r * s, 0, Math.PI * 2); c.fill(); }
  };
  const more = wet ? 2.4 : 1;
  for (let i = 0; i < 14 * more; i++) puff(R() * SW, yH * (0.25 + R() * 0.7) * (wet ? 0.8 : 1), 14 + R() * 30 * more, sk.ca);
  const rail = game.mode && game.mode.world === 'rail';
  if (!rail){ for (let i = 0; i < 26; i++) puff(R() * SW, yH + 10 + R() * (H - yH), 24 + R() * 50, sk.ca * 0.8); return; }
  // 大海
  const sea = c.createLinearGradient(0, yH, 0, H);
  sea.addColorStop(0, L(env.time === 'dusk' ? '#FDBA74' : '#BAE6FD')); sea.addColorStop(0.25, L('#38BDF8')); sea.addColorStop(1, L('#0369A1'));
  c.fillStyle = sea; c.fillRect(0, yH, SW, H - yH);
  c.strokeStyle = env.time === 'night' ? 'rgba(191,219,254,.35)' : 'rgba(255,255,255,.55)';
  for (let i = 0; i < 220; i++){
    const yy = yH + Math.pow(R(), 1.6) * (H - yH), k = 0.3 + (yy - yH) / (H - yH) * 2.2, xx = R() * SW;
    c.lineWidth = Math.max(1, k); c.beginPath(); c.moveTo(xx, yy); c.quadraticCurveTo(xx + 6 * k, yy - 3 * k, xx + 12 * k, yy); c.stroke();
  }
  if (game.mode.city){ paintCity(c, SW, R, L, env); for (let i = 0; i < 8; i++) puff(R() * SW, yH * (0.3 + R() * 0.4), 18 + R() * 30, sk.ca * 0.6); return; }
  // 远处两层山脉（贴着海平线）
  const ridge = (col, hMax, step, snow) => {
    c.fillStyle = col; c.beginPath(); c.moveTo(0, yH);
    const pts = [];
    for (let xx = 0; xx <= SW + step; xx += step){ const hh = hMax * (0.35 + R() * 0.65); pts.push([xx, yH - hh]); c.lineTo(xx, yH - hh); }
    c.lineTo(SW, yH); c.closePath(); c.fill();
    if (snow){ c.fillStyle = 'rgba(255,255,255,.85)'; for (const [xx, yy] of pts) if (yH - yy > hMax * 0.75){ c.beginPath(); c.moveTo(xx - step * 0.18, yy + hMax * 0.12); c.lineTo(xx, yy); c.lineTo(xx + step * 0.18, yy + hMax * 0.12); c.closePath(); c.fill(); } }
  };
  ridge(L('#93A8C6'), yH * 0.2, 60, true);
  ridge(L('#4D7C5A'), yH * 0.11, 44, env.weather === 'snow');
  for (let i = 0; i < 10; i++) puff(R() * SW, yH * (0.6 + R() * 0.3), 18 + R() * 30, sk.ca * 0.7);
}

/* 深圳城市风光（画在天空横条上）：远山、两层高楼（平安金融中心、华润春笋、京基 100 这些地标），
   中间一段是深圳湾大桥，海边一条深圳湾公园的绿带。晚上楼里亮灯、倒映在海面上 */
function paintCity(c, SW, R, L, env){
  const night = env.time === 'night', dusk = env.time === 'dusk', u = Math.max(1, yH / 320);
  const hill = (col, hMax, step) => { c.fillStyle = col; c.beginPath(); c.moveTo(0, yH); for (let x = 0; x <= SW + step; x += step) c.lineTo(x, yH - hMax * (0.45 + R() * 0.55)); c.lineTo(SW, yH); c.closePath(); c.fill(); };
  hill(L('#9BB0CB'), yH * 0.16, 70);
  hill(L('#6E8F7A'), yH * 0.08, 50);
  const far = night ? '#262C60' : dusk ? '#8C7AA6' : '#A3B7D3', near = night ? '#171C45' : dusk ? '#6B5788' : '#7D96B8';
  const lights = [];
  const windows = (x, top, w, h, col) => {
    if (night){ for (let yy = top + 4 * u; yy < yH - 3 * u; yy += 4 * u) for (let xx = x + 2 * u; xx < x + w - 2 * u; xx += 4 * u) if (R() < 0.35){ c.fillStyle = '#FDE68A'; c.fillRect(xx, yy, 1.6 * u, 2 * u); } lights.push([x + w / 2, w]); }
    else { c.fillStyle = 'rgba(255,255,255,.22)'; for (let xx = x + 3 * u; xx < x + w - 1; xx += 5 * u) c.fillRect(xx, top, 1.2 * u, h); }
  };
  const block = (x, w, h, col) => { c.fillStyle = col; c.fillRect(x, yH - h, w, h); windows(x, yH - h, w, h, col); };
  const city = (x0, x1, col, hMin, hMax, wMin, wMax) => { for (let x = x0; x < x1; ){ const w = (wMin + R() * (wMax - wMin)) * u; block(x, w, yH * (hMin + R() * (hMax - hMin)), col); x += w + R() * 3 * u; } };
  // 福田 CBD 和罗湖在左边，后海 / 前海在右边，中间留给深圳湾大桥（对面是香港的山）
  city(0, SW * 0.48, far, 0.06, 0.2, 8, 20);
  city(SW * 0.9, SW, far, 0.06, 0.18, 8, 20);
  // 平安金融中心：最高的那座，往上收窄，顶上一根尖
  const pa = (x, h) => {
    c.fillStyle = near; c.beginPath();
    c.moveTo(x - 17 * u, yH); c.lineTo(x - 12 * u, yH - h * 0.93); c.lineTo(x - 5 * u, yH - h * 0.97); c.lineTo(x + 5 * u, yH - h * 0.97); c.lineTo(x + 12 * u, yH - h * 0.93); c.lineTo(x + 17 * u, yH); c.closePath(); c.fill();
    c.strokeStyle = night ? 'rgba(253,230,138,.5)' : 'rgba(255,255,255,.35)'; c.lineWidth = 1.2 * u;
    for (const k of [-8, 0, 8]){ c.beginPath(); c.moveTo(x + k * u * 1.4, yH); c.lineTo(x + k * u * 0.7, yH - h * 0.95); c.stroke(); }
    c.strokeStyle = near; c.lineWidth = 2 * u; c.beginPath(); c.moveTo(x, yH - h * 0.97); c.lineTo(x, yH - h * 1.06); c.stroke();
    if (night){ c.fillStyle = '#EF4444'; c.beginPath(); c.arc(x, yH - h * 1.06, 2 * u, 0, Math.PI * 2); c.fill(); lights.push([x, 30 * u]); }
  };
  // 华润春笋：子弹头形，外面一圈斜格子
  const cs = (x, h) => {
    const w = 13 * u;
    c.fillStyle = near; c.beginPath(); c.moveTo(x - w, yH); c.lineTo(x - w, yH - h * 0.82); c.quadraticCurveTo(x - w, yH - h, x, yH - h); c.quadraticCurveTo(x + w, yH - h, x + w, yH - h * 0.82); c.lineTo(x + w, yH); c.closePath(); c.fill();
    c.save(); c.clip(); c.strokeStyle = night ? 'rgba(191,219,254,.45)' : 'rgba(255,255,255,.35)'; c.lineWidth = u;
    for (let k = -h; k < h; k += 7 * u){ c.beginPath(); c.moveTo(x - w, yH - h * 0.1 - k); c.lineTo(x + w, yH - h * 0.1 - k - 2 * w); c.stroke(); c.beginPath(); c.moveTo(x + w, yH - h * 0.1 - k); c.lineTo(x - w, yH - h * 0.1 - k - 2 * w); c.stroke(); }
    c.restore(); if (night) lights.push([x, 2 * w]);
  };
  // 京基 100：方楼，顶上一道弧
  const kk = (x, h) => { const w = 12 * u; c.fillStyle = near; c.beginPath(); c.moveTo(x - w, yH); c.lineTo(x - w, yH - h * 0.94); c.quadraticCurveTo(x, yH - h * 1.04, x + w, yH - h * 0.94); c.lineTo(x + w, yH); c.closePath(); c.fill(); windows(x - w, yH - h * 0.9, 2 * w, h * 0.9, near); };
  city(SW * 0.02, SW * 0.13, near, 0.1, 0.24, 10, 22);
  kk(SW * 0.08, yH * 0.33);
  pa(SW * 0.2, yH * 0.5);
  cs(SW * 0.27, yH * 0.4);
  city(SW * 0.31, SW * 0.47, near, 0.08, 0.22, 10, 22);
  city(SW * 0.91, SW, near, 0.09, 0.26, 10, 22);
  // 晚上：灯光倒映在海面上
  if (night) for (const [x, w] of lights){ const g = c.createLinearGradient(0, yH, 0, yH + yH * 0.12); g.addColorStop(0, 'rgba(253,230,138,.35)'); g.addColorStop(1, 'rgba(253,230,138,0)'); c.fillStyle = g; c.fillRect(x - w * 0.3, yH, w * 0.6, yH * 0.12); }
  // 深圳湾大桥：一座斜塔，钢索拉着长长的桥面
  const b0 = SW * 0.5, b1 = SW * 0.88, by = yH - 5 * u, tx = SW * 0.6, th = yH * 0.17;
  c.fillStyle = L('#E2E8F0'); c.fillRect(b0, by, b1 - b0, 2.5 * u);
  c.fillStyle = L('#94A3B8'); for (let x = b0; x < b1; x += 22 * u) c.fillRect(x, by + 2.5 * u, 1.5 * u, 4 * u);
  const topX = tx + th * 0.22, topY = by - th;
  c.strokeStyle = L('#F1F5F9'); c.lineWidth = 3 * u; c.beginPath(); c.moveTo(tx, by); c.lineTo(topX, topY); c.stroke();
  c.lineWidth = 0.8 * u; c.strokeStyle = L('#E2E8F0');
  for (let k = 1; k <= 9; k++){ c.beginPath(); c.moveTo(topX - k * u * 0.4, topY + k * th * 0.05); c.lineTo(tx - k * 16 * u, by); c.stroke(); c.beginPath(); c.moveTo(topX - k * u * 0.2, topY + k * th * 0.05); c.lineTo(tx + k * 18 * u, by); c.stroke(); }
  if (night){ c.fillStyle = '#FDE68A'; for (let x = b0; x < b1; x += 9 * u) c.fillRect(x, by - 1.5 * u, 1.5 * u, 1.5 * u); }
  // 深圳湾公园：海边一条绿带，一排圆圆的树
  c.fillStyle = L('#3F8F57'); c.fillRect(0, yH - 3 * u, b0, 5 * u); c.fillRect(b1, yH - 3 * u, SW - b1, 5 * u);
  c.fillStyle = L('#4ADE80');
  for (let x = 0; x < SW; x += (6 + R() * 8) * u){ if (x > b0 && x < b1) continue; c.beginPath(); c.arc(x, yH - 4 * u, (2.5 + R() * 3) * u, 0, Math.PI * 2); c.fill(); }
}

function project(y, z, cx, camZ){
  const cz = z - camZ, s = camDepth / cz;
  return { s, cz, x:W / 2 + s * cx * xF, y:yView - s * (y - camY) * yF, w:s * ROADW * xF };
}
function poly(pts, col){ ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.closePath(); ctx.fill(); }

function render(now, dt = 0){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // 天空
  const SW = W * 2, off = ((skyX % SW) + SW) % SW;
  ctx.fillStyle = pitch > 0 ? skyEdge.top : skyEdge.bot; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(sky, 0, 0, sky.width, sky.height, -off, pitch, SW, H);
  ctx.drawImage(sky, 0, 0, sky.width, sky.height, SW - off, pitch, SW, H);
  const railWorld = game.mode && game.mode.world === 'rail', under = railWorld && camY < seaY;
  underFade += ((under ? 1 : 0) - underFade) * Math.min(1, dt * 3);
  if (railWorld && underFade > 0.01){ ctx.globalAlpha = underFade; drawUnderwater(now, dt); ctx.globalAlpha = 1; }
  drawSkyFx(now, dt);
  if (!segs.length) return;
  const zNow = game.mode && game.mode.city ? segAt(dist + playerZ).zone || null : null;
  for (const t of ['space', 'show']) zfade[t] += ((zNow === t ? 1 : 0) - zfade[t]) * Math.min(1, dt * 2.5);
  if (zfade.space > 0.01){ ctx.globalAlpha = zfade.space; drawSpace(now, dt); ctx.globalAlpha = 1; }
  if (zfade.show > 0.01){ ctx.fillStyle = `rgba(8,6,30,${0.8 * zfade.show})`; ctx.fillRect(0, 0, W, H); drawLasers(now, zfade.show); }
  if (zNow === 'air') drawPlane(now);
  if (zNow === 'happy') drawZoneBalloons(now);
  if (zNow === 'lotus' || zNow === 'garden') drawPetals(dt, true);
  if (zNow === 'wetland' || zNow === 'park' || zNow === 'port') drawPetals(dt, false);

  const pos = ((dist % trackLen) + trackLen) % trackLen;
  const base = Math.floor(pos / SEG), basePct = (pos % SEG) / SEG;
  const ballZ = dist + playerZ;
  // 镜头：下陡坡时自动升高（不让身后的路挡住镜头）并低头看下去；上陡坡时略微抬头。
  // 镜头高度和俯仰一起变，所以小球在屏幕上的位置始终不变
  const bY = trackY(ballZ);
  const ahead = (trackY(ballZ + 15 * SEG) - bY) / (15 * SEG);
  // 镜头至少要多高，才能从镜头前一直看到小球前面 25 节都不被路自己挡住：
  // 相邻两点 a、b（离镜头 da < db）都要看得见，要求镜头高度 > (ya·db − yb·da) / (db − da)
  let need = -Infinity;
  let pz = Math.floor(dist / SEG) * SEG + SEG, py = trackY(pz);
  for (let z = pz + SEG; z <= ballZ + 25 * SEG; z += SEG){
    const y = trackY(z), da = pz - dist, db = z - dist;
    need = Math.max(need, (py * db - y * da) / (db - da));
    pz = z; py = y;
  }
  const hT = Math.max(380, need - bY + 250, CAMH - Math.max(0, ahead) * 0.35 * 1.5 * CAMH);
  camH += (hT - camH) * (dt > 0 ? 1 - Math.exp(-dt * (hT > camH ? 12 : 4)) : 0);   // 升得快、降得慢，冲下去时不会慢半拍
  camY = bY + camH;
  pitch = Math.max(-H * 2, Math.min(H * 0.3, (CAMH - camH) * yF / (1.5 * CAMH)));
  yView = yH + pitch;
  const camX = ball.x * ROADW * 0.5;
  const P = [];
  let x = 0, dx = -segs[base].curve * basePct;
  for (let n = 0; n < DRAW; n++){
    const seg = segs[(base + n) % segs.length];
    const camZ = pos - (seg.i < base ? trackLen : 0);
    const p1 = project(seg.y1, seg.z1, x - camX, camZ);
    const p2 = project(seg.y2, seg.z2, x + dx - camX, camZ);
    x += dx; dx += seg.curve;
    P.push({ p1, p2, seg });
  }
  const nBall = Math.floor(ballZ / SEG) - Math.floor(dist / SEG);
  const ballPct = (ballZ % SEG) / SEG;
  const rows = [];
  if (game.row) rows.push(game.row);
  if (game.prevRow) rows.push(game.prevRow);
  itemScreen.clear();

  for (let n = DRAW - 1; n >= 0; n--){
    const { p1, p2, seg } = P[n];
    if (p1.cz <= camDepth) continue;   // 镜头后面的不画；坡顶后面的路照画，从远到近画，被挡住的自然会被近处的路盖住
    const fog = Math.min(1, Math.max(0, (n - DRAW * 0.5) / (DRAW * 0.5)));
    ctx.globalAlpha = 1 - fog * 0.9;
    const pl = Math.min(seg.y1, seg.y2) < seaY ? (under ? palSubB : palSubA) : pal;
    const t1 = p1.s * THICK * yF, t2 = p2.s * THICK * yF;
    const rail = game.mode && game.mode.world === 'rail';
    if (rail){
      const ys1 = yView - p1.s * (seaY - camY) * yF;
      if (seg.mtn) drawSideMountain(p1, seg.mtn, ys1);
      if (seg.bld && seg.zone !== 'space' && !under) drawSideBuilding(p1, seg.bld, ys1);
      if (seg.lm && !under) drawLandmark(p1, seg.lm, ys1, now);
      if (seg.i % 10 === 0 && !seg.tunnel && seg.zone !== 'space' && seg.y1 > seaY + 300){   // 跨海大桥的桥墩
        const pw = p1.w * 0.32;
        ctx.fillStyle = pl.side2; ctx.fillRect(p1.x - pw / 2, p1.y + t1 * 0.5, pw, Math.max(0, ys1 - p1.y - t1 * 0.5));
        ctx.fillStyle = pl.side; ctx.fillRect(p1.x - pw / 2, p1.y + t1 * 0.5, pw * 0.35, Math.max(0, ys1 - p1.y - t1 * 0.5));
      }
    }
    const coaster = game.mode && game.mode.world === 'coaster';
    if (coaster){
      if (seg.deco) drawCoasterDeco(p1, seg.deco, now);
      if (seg.i % 8 === 0 && !seg.tunnel){   // A 字形的彩色支架，一直伸到下面的云里
        const gy = yView - p1.s * (seaY - camY) * yF, lw = Math.max(1.5, p1.w * 0.07);
        ctx.strokeStyle = pl.side2; ctx.lineWidth = lw; ctx.lineCap = 'butt';
        ctx.beginPath(); ctx.moveTo(p1.x - p1.w * 0.75, p1.y + t1 * 0.4); ctx.lineTo(p1.x - p1.w * 1.25, gy);
        ctx.moveTo(p1.x + p1.w * 0.75, p1.y + t1 * 0.4); ctx.lineTo(p1.x + p1.w * 1.25, gy); ctx.stroke();
        ctx.strokeStyle = '#FACC15'; ctx.lineWidth = Math.max(1, lw * 0.45);
        ctx.beginPath(); ctx.moveTo(p1.x - p1.w * 0.85, p1.y + (gy - p1.y) * 0.25); ctx.lineTo(p1.x + p1.w * 0.85, p1.y + (gy - p1.y) * 0.25); ctx.stroke();
      }
    }
    // 漂在空中的跑道：先画两侧的厚度，再画路面（过山车两边是细一点的钢梁）
    const tk = coaster ? 0.45 : 1;
    poly([p1.x - p1.w, p1.y, p2.x - p2.w, p2.y, p2.x - p2.w, p2.y + t2 * tk, p1.x - p1.w, p1.y + t1 * tk], pl.side);
    poly([p1.x + p1.w, p1.y, p2.x + p2.w, p2.y, p2.x + p2.w, p2.y + t2 * tk, p1.x + p1.w, p1.y + t1 * tk], pl.side2);
    const stripe = Math.floor(seg.i / 3) % 2;
    if (coaster && n < 90 && !seg.tunnel){
      // 镂空：每节只有一根横梁，能从缝里看到下面的天空
      const a1 = 0.3, ax1 = p1.x + (p2.x - p1.x) * a1, ay1 = p1.y + (p2.y - p1.y) * a1, aw1 = p1.w + (p2.w - p1.w) * a1;
      poly([p1.x - p1.w, p1.y, p1.x + p1.w, p1.y, ax1 + aw1, ay1, ax1 - aw1, ay1], stripe ? pl.light : pl.dark);
    } else poly([p1.x - p1.w, p1.y, p1.x + p1.w, p1.y, p2.x + p2.w, p2.y, p2.x - p2.w, p2.y], rail ? (stripe ? pl.gravelA : pl.gravelB) : stripe ? pl.light : pl.dark);
    const r1 = p1.w * 0.07, r2 = p2.w * 0.07;
    const rc = stripe ? pl.white : pl.rumble;
    poly([p1.x - p1.w, p1.y, p1.x - p1.w + r1, p1.y, p2.x - p2.w + r2, p2.y, p2.x - p2.w, p2.y], rc);
    poly([p1.x + p1.w, p1.y, p1.x + p1.w - r1, p1.y, p2.x + p2.w - r2, p2.y, p2.x + p2.w, p2.y], rc);
    if (rail && p1.w > 3){
      // 三条铁路：每条有枕木和两根钢轨
      const at = (t, lx) => [p1.x + (p2.x - p1.x) * t + lx * (p1.w + (p2.w - p1.w) * t), p1.y + (p2.y - p1.y) * t];
      const one = !!game.mode.city, tw = one ? 0.36 : 0.2, rg = one ? 0.21 : 0.11, rt = one ? 0.026 : 0.016;   // 地铁只有一条轨道
      for (const lane of one ? [0] : LANES){
        if (n < 120){ const a = at(0, lane - tw), b = at(0, lane + tw), c2 = at(0.45, lane + tw), d = at(0.45, lane - tw); poly([...a, ...b, ...c2, ...d], pl.tie); }
        for (const rl of [-rg, rg]){
          const lx = lane + rl, g1 = p1.w * rt, g2 = p2.w * rt;
          poly([p1.x + lx * p1.w - g1, p1.y, p1.x + lx * p1.w + g1, p1.y, p2.x + lx * p2.w + g2, p2.y, p2.x + lx * p2.w - g2, p2.y], pl.rail);
        }
      }
    } else if (coaster && p1.w > 2){
      // 三条过山车轨道：每条两根彩色钢管
      for (const lane of LANES) for (const rl of [-0.12, 0.12]){
        const lx = lane + rl, g1 = p1.w * 0.026, g2 = p2.w * 0.026;
        poly([p1.x + lx * p1.w - g1, p1.y, p1.x + lx * p1.w + g1, p1.y, p2.x + lx * p2.w + g2, p2.y, p2.x + lx * p2.w - g2, p2.y], pl.rumble);
      }
    } else if (stripe){
      for (const lx of [-0.31, 0.31]){
        const l1 = p1.w * 0.018, l2 = p2.w * 0.018;
        poly([p1.x + lx * p1.w - l1, p1.y, p1.x + lx * p1.w + l1, p1.y, p2.x + lx * p2.w + l2, p2.y, p2.x + lx * p2.w - l2, p2.y], 'rgba(255,255,255,.75)');
      }
    }
    if (opts.fence && !seg.tunnel && !seg.glass){
      const fh1 = p1.s * FENCE_H * yF, fh2 = p2.s * FENCE_H * yF, rt1 = fh1 * 0.2, rt2 = fh2 * 0.2;
      for (const side of [-1, 1]){
        const xa = p1.x + side * p1.w, xb = p2.x + side * p2.w;
        poly([xa, p1.y - fh1 * 0.45, xb, p2.y - fh2 * 0.45, xb, p2.y - fh2 * 0.45 + rt2 * 0.8, xa, p1.y - fh1 * 0.45 + rt1 * 0.8], pl.white);
        if (seg.i % 4 === 0){
          const pw = Math.max(1, p1.s * 80 * xF);
          ctx.fillStyle = pl.white; ctx.fillRect(xa - pw / 2, p1.y - fh1, pw, fh1);
        }
        poly([xa, p1.y - fh1, xb, p2.y - fh2, xb, p2.y - fh2 + rt2, xa, p1.y - fh1 + rt1], pl.rumble);
      }
    }
    if (seg.glass){
      // 海底玻璃隧道：半圆形的透明玻璃管，每隔几节一道白色的骨架
      const gr1 = p1.w * 1.25, gr2 = p2.w * 1.25, gh1 = p1.s * TUBE_H * yF, gh2 = p2.s * TUBE_H * yF;
      const arcPts = (p, gr, gh) => { const a = []; for (let k = 0; k <= 12; k++){ const t = Math.PI + Math.PI * k / 12; a.push(p.x + Math.cos(t) * gr, p.y + Math.sin(t) * gh); } return a; };
      const A = arcPts(p1, gr1, gh1), B = arcPts(p2, gr2, gh2), band = [...A];
      for (let k = B.length - 2; k >= 0; k -= 2) band.push(B[k], B[k + 1]);
      poly(band, under ? 'rgba(186,230,253,.10)' : 'rgba(125,211,252,.22)');
      if (seg.i % 5 === 0){
        ctx.strokeStyle = under ? 'rgba(255,255,255,.6)' : 'rgba(224,242,254,.45)'; ctx.lineWidth = Math.max(1, p1.w * 0.035);
        ctx.beginPath(); ctx.moveTo(A[0], A[1]); for (let k = 2; k < A.length; k += 2) ctx.lineTo(A[k], A[k + 1]); ctx.stroke();
      }
      if ((seg.y1 >= seaY) !== (seg.y2 >= seaY)){   // 管子钻进海面的地方：一圈白浪花
        ctx.fillStyle = 'rgba(255,255,255,.85)';
        ctx.beginPath(); ctx.ellipse(p1.x, yView - p1.s * (seaY - camY) * yF, p1.w * 1.7, Math.max(1.5, p1.s * 160 * yF), 0, 0, Math.PI * 2); ctx.fill();
      }
    }
    if (seg.tunnel){
      // 隧道：两边人行道 + 墙 + 天花板，墙上有彩色腰线，顶上一盏盏灯
      const th1 = p1.s * TUN_H * yF, th2 = p2.s * TUN_H * yF, w1 = p1.w * 1.18, w2 = p2.w * 1.18;
      const band = Math.floor(seg.i / 4) % 2;
      poly([p1.x - w1, p1.y, p1.x - p1.w, p1.y, p2.x - p2.w, p2.y, p2.x - w2, p2.y], tun.walk);
      poly([p1.x + p1.w, p1.y, p1.x + w1, p1.y, p2.x + w2, p2.y, p2.x + p2.w, p2.y], tun.walk);
      poly([p1.x - w1, p1.y, p2.x - w2, p2.y, p2.x - w2, p2.y - th2, p1.x - w1, p1.y - th1], band ? tun.wallA : tun.wallB);
      poly([p1.x + w1, p1.y, p2.x + w2, p2.y, p2.x + w2, p2.y - th2, p1.x + w1, p1.y - th1], band ? tun.wallB : tun.wallA);
      poly([p1.x - w1, p1.y - th1, p1.x + w1, p1.y - th1, p2.x + w2, p2.y - th2, p2.x - w2, p2.y - th2], tun.ceil);
      for (const sd of [-1, 1]){ const a = p1.x + sd * w1, b = p2.x + sd * w2; poly([a, p1.y - th1 * 0.34, b, p2.y - th2 * 0.34, b, p2.y - th2 * 0.25, a, p1.y - th1 * 0.25], pal.rumble); }
      if (seg.i % 6 === 0){ const l1 = w1 * 0.12, l2 = w2 * 0.12; poly([p1.x - l1, p1.y - th1, p1.x + l1, p1.y - th1, p2.x + l2, p2.y - th2, p2.x - l2, p2.y - th2], '#FDE68A'); }
      if (seg.portal) drawPortal(p1, th1, rail ? yView - p1.s * (seaY - camY) * yF : 0, seg);
    }
    ctx.globalAlpha = 1;
    for (const row of rows){
      if (n < nBall || Math.floor(row.z / SEG) - Math.floor(dist / SEG) !== n) continue;   // 球已经滚过去的那排不再画
      const pct = (row.z % SEG) / SEG;
      const sx = p1.x + (p2.x - p1.x) * pct, sy = p1.y + (p2.y - p1.y) * pct, s = p1.s + (p2.s - p1.s) * pct, sw = p1.w + (p2.w - p1.w) * pct;
      const appear = Math.min(1, (now - row.born) / 450);
      if (row.finish) drawFinish(sx, sy, sw, s, 1 - fog);
      if (row.station) drawGate(sx, sy, sw, s, row, now);
      else for (const it of row.items) drawItem(it, sx + it.lane * sw, sy, s * ITEMR * xF * (0.6 + 0.4 * appear), (1 - fog) * appear, now);
    }
    if (n === nBall) drawBallAt(p1, p2, ballPct, now);
  }
  // 粒子
  const pdt = 1 / 60;
  for (let i = particles.length - 1; i >= 0; i--){
    const q = particles[i];
    if (!game.paused){ q.life -= pdt; q.vy += 600 * pdt; q.x += q.vx * pdt; q.y += q.vy * pdt; q.r += pdt * 8; }
    if (q.life <= 0){ particles.splice(i, 1); continue; }
    ctx.globalAlpha = Math.min(1, q.life * 1.6);
    ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.r); ctx.fillStyle = q.c; ctx.fillRect(-q.s / 2, -q.s / 4, q.s, q.s / 2); ctx.restore();
  }
  ctx.globalAlpha = 1;
  // 撞飞的东西（重力 2.2 倍屏高 / 秒²），飞的时候稍微变大一点，像飞向镜头
  for (let i = flyers.length - 1; i >= 0; i--){
    const f = flyers[i];
    if (!game.paused) f.t += pdt;
    const x = f.gx + f.vx * f.t, gy = f.gy + f.vy * f.t + 1.1 * H * f.t * f.t, cy = gy - f.r * 1.3;
    if (cy - f.r * 2 > H || f.t > 3){ flyers.splice(i, 1); itemScreen.delete(f.it); continue; }
    ctx.save(); ctx.translate(x, cy); ctx.rotate(f.vr * f.t); ctx.translate(-x, -cy);
    drawItem(f.it, x, gy, f.r * (1 + Math.min(f.t, 0.35)), 1, now);
    ctx.restore();
  }
  if (zNow === 'lotus' || petals.length) drawPetals(dt, zNow === 'lotus');
  drawWeather(dt);
}

/* ---------- 特色风景 ---------- */
const zfade = { space:0, show:0 };
let warp = [], petals = [];
// 科学馆：穿越宇宙。深紫色星空、星云、行星，星星从正前方往四周飞（曲速）
function drawSpace(now, dt){
  const cx = W / 2, cy = yView, R = Math.hypot(W, H);
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 0.7);
  g.addColorStop(0, '#3B0764'); g.addColorStop(0.45, '#1E1B4B'); g.addColorStop(1, '#020617');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const a0 = ctx.globalAlpha;
  for (const [fx, fy, r, col] of [[.22, .3, .35, '236,72,153'], [.78, .22, .3, '34,211,238'], [.55, .55, .28, '167,139,250']]){
    const x = W * fx + Math.sin(now / 3000 + fx * 9) * 20, y = H * fy, rr = Math.min(W, H) * r;
    const ng = ctx.createRadialGradient(x, y, 0, x, y, rr); ng.addColorStop(0, `rgba(${col},.35)`); ng.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = ng; ctx.beginPath(); ctx.arc(x, y, rr, 0, Math.PI * 2); ctx.fill();
  }
  // 土星（带光环）和一颗蓝色星球
  const sx = W * 0.2, sy = H * 0.24, sr = Math.min(W, H) * 0.07;
  ctx.fillStyle = '#F59E0B'; ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(sx - sr, sy - sr * 0.2, sr * 2, sr * 0.18);
  ctx.strokeStyle = '#FDE68A'; ctx.lineWidth = Math.max(2, sr * 0.12); ctx.beginPath(); ctx.ellipse(sx, sy, sr * 1.8, sr * 0.45, -0.35, 0, Math.PI * 2); ctx.stroke();
  const bx = W * 0.82, by = H * 0.16, br = Math.min(W, H) * 0.045;
  ctx.fillStyle = '#38BDF8'; ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#4ADE80'; ctx.beginPath(); ctx.ellipse(bx - br * 0.2, by - br * 0.1, br * 0.45, br * 0.3, 0.5, 0, Math.PI * 2); ctx.fill();
  if (warp.length < 140) for (let i = 0; i < 6; i++) warp.push({ a:Math.random() * Math.PI * 2, r:5 + Math.random() * 40, c:pick(['#FFFFFF', '#A5F3FC', '#F5D0FE', '#FDE68A']) });
  ctx.lineCap = 'round';
  for (let i = warp.length - 1; i >= 0; i--){
    const p = warp[i];
    p.r *= 1 + dt * 2.2; p.r += dt * 30;
    if (p.r > R){ warp.splice(i, 1); continue; }
    const r2 = p.r * 1.18, c = Math.cos(p.a), s2 = Math.sin(p.a);
    ctx.strokeStyle = p.c; ctx.lineWidth = Math.max(1, p.r / 140);
    ctx.globalAlpha = a0 * Math.min(1, p.r / 120);
    ctx.beginPath(); ctx.moveTo(cx + c * p.r, cy + s2 * p.r); ctx.lineTo(cx + c * r2, cy + s2 * r2); ctx.stroke();
  }
  ctx.globalAlpha = a0; ctx.lineCap = 'butt';
}
// 市民中心灯光秀：天黑下来，一束束彩色激光在天上扫来扫去
function drawLasers(now, a){
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 8; i++){
    const x0 = W * (0.15 + i * 0.1), ang = -Math.PI / 2 + Math.sin(now / 800 + i * 1.7) * 0.7;
    ctx.strokeStyle = `hsla(${(now / 15 + i * 45) % 360},100%,60%,${0.55 * a})`; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(x0, yView); ctx.lineTo(x0 + Math.cos(ang) * H * 1.5, yView + Math.sin(ang) * H * 1.5); ctx.stroke();
  }
  ctx.restore();
}
// 宝安机场：一架大飞机从左下飞到右上，后面拖着白烟
function drawPlane(now){
  const t = (now % 6000) / 6000, x = -W * 0.15 + t * W * 1.3, y = yView * (0.85 - t * 0.7), sz = Math.max(48, Math.min(W, H) * 0.12);
  ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = sz * 0.08; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x - sz * 2.6, y + sz * 1.4); ctx.lineTo(x - sz * 0.5, y + sz * 0.25); ctx.stroke(); ctx.lineCap = 'butt';
  ctx.save(); ctx.translate(x, y); ctx.rotate(-0.1);
  ctx.font = `${Math.round(sz)}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000'; ctx.fillText('✈️', 0, 0);
  ctx.restore();
}
// 欢乐谷：一串彩色气球往上飘
function drawZoneBalloons(now){
  for (let i = 0; i < 10; i++){
    const x = W * ((i * 0.137 + 0.05) % 1) + Math.sin(now / 900 + i) * 12, y = H - ((now / 14 + i * 97) % (H + 120)), r = 14 + (i % 3) * 5;
    ctx.strokeStyle = 'rgba(71,85,105,.6)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x, y + r * 1.2); ctx.lineTo(x + 3, y + r * 3); ctx.stroke();

// 莲花山：粉色的荷花花瓣飘下来（画在最前面）
function drawPetals(dt, spawn){
  if (spawn && petals.length < 60 && Math.random() < dt * 30) petals.push({ x:Math.random() * W, y:-10, vx:(Math.random() - .5) * 40, vy:40 + Math.random() * 50, r:Math.random() * 6, s:6 + Math.random() * 6 });
  for (let i = petals.length - 1; i >= 0; i--){
    const p = petals[i];
    p.x += (p.vx + Math.sin(p.y / 40) * 30) * dt; p.y += p.vy * dt; p.r += dt * 2;
    if (p.y > H + 20){ petals.splice(i, 1); continue; }
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = i % 3 ? '#F9A8D4' : '#FBCFE8';
    ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s * 0.45, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
}
// 特色站旁边的地标：画在海面上的小岛上，上面挂一块名字牌
function drawLandmark(p, lm, ys, now){
  // 地标放在铁轨旁边，离开一段距离，不压到铁轨上
  const HALF = { civic:5600, lotus:5500, eiffel:1700, cocoon:3800, terminal:5000, wheel:2600, loop:2200,
    mountain:3200, flower:1800, gate:3000, crane:2200, gradhat:3000, reed:2000, trainstation:4000, book:2200, tree:2000, sailboat:3000, mask:2200, laptop:1800 };
  const hk = p.w / ROADW * 0.8, vk = p.s * yF * 0.8, x = p.x + lm.side * (ROADW * 1.7 + HALF[lm.type]) * hk;
  if (hk * 9000 < 6) return;
