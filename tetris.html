<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Jelly Tetris</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0820; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .home { position: fixed; left: 12px; bottom: 12px; padding: 6px 12px; border-radius: 999px; background: rgba(0,0,0,.35); color: rgba(255,255,255,.75); font: 600 13px system-ui, sans-serif; text-decoration: none; }
    .home:hover { color: #fff; background: rgba(0,0,0,.55); }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <a class="home" href="index.html">← Home</a>
  <script src="tetris.js"></script>
</body>
</html>
