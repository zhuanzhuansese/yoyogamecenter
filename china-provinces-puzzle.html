<title>中国省份拼图 · China Provinces Puzzle</title>
<style>
:root{
  --bg:#0B111A; --sea:#0C1420; --land:#16202E; --line:#2C3D57;
  --panel:#121B28; --panel2:#0F1826; --bd:#22314A;
  --tx:#E6EDF7; --mu:#8497B4; --ac:#5AA9FF;
  --ok:#2FBF9B; --bad:#E24B4A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:radial-gradient(1200px 700px at 20% -10%,#14243a 0%,var(--bg) 55%) fixed;
  color:var(--tx);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  overflow-x:hidden;
}
body.dragging{cursor:grabbing;user-select:none}
.wrap{max-width:1600px;margin:0 auto;padding:14px 16px 24px}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{margin:0;font-size:19px;letter-spacing:.5px;font-weight:700}
.brand span{color:var(--mu);font-size:12px;letter-spacing:1.5px;text-transform:uppercase}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.stat{background:var(--panel);border:1px solid var(--bd);border-radius:9px;padding:5px 11px;display:flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums}
.stat i{font-style:normal;color:var(--mu);font-size:11.5px}
.stat b{font-size:14.5px;font-weight:700}
.stat b.warn{color:#F0B429}
.tools{display:flex;gap:8px;flex-wrap:wrap}
button.tool{
  background:var(--panel);color:var(--tx);border:1px solid var(--bd);border-radius:9px;
  padding:6px 13px;font-size:13px;cursor:pointer;font-family:inherit;transition:.15s;
}
button.tool:hover{border-color:var(--ac);color:#fff;background:#17253a}
button.tool.on{border-color:var(--ac);background:#16304e;color:#cfe4ff}
button.tool:disabled{opacity:.4;cursor:not-allowed;transform:none}
button.tool:disabled:hover{border-color:var(--bd);color:var(--tx);background:var(--panel)}
button.tool:active{transform:translateY(1px)}

/* ---------- layout ---------- */
main{display:grid;grid-template-columns:minmax(0,1fr) 352px;gap:14px;align-items:start}
.panel{background:var(--panel2);border:1px solid var(--bd);border-radius:14px;position:relative}
#mapPanel{padding:8px;overflow:hidden}
#map{display:block;width:100%;height:auto;max-height:calc(100vh - 200px);touch-action:none}

/* ---------- tray ---------- */
aside{display:flex;flex-direction:column;gap:10px}
.lastCard{background:var(--panel2);border:1px solid var(--bd);border-radius:14px;padding:11px 13px;display:flex;align-items:center;gap:12px;min-height:62px}
.lastCard .glyph{
  width:44px;height:44px;flex:0 0 44px;border-radius:11px;display:grid;place-items:center;
  font-size:22px;font-weight:700;background:#1b2b40;color:var(--mu);border:1px solid var(--bd);transition:.2s;
}
.lastCard .txt{min-width:0}
.lastCard .nm{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lastCard .sb{font-size:12px;color:var(--mu);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;flex-wrap:wrap;gap:6px;padding:0 2px}
.lg{
  display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--mu);
  background:var(--panel2);border:1px solid var(--bd);border-radius:999px;padding:3px 9px;
  cursor:pointer;font-family:inherit;transition:.15s;
}
.lg i{width:8px;height:8px;border-radius:2px;display:block}
.lg b{color:var(--tx);font-weight:600}
.lg.act{border-color:var(--ac);background:#16304e;color:#cfe4ff}
.lg.off{opacity:.32}
.lg:hover{border-color:var(--ac)}

.trayBox{background:var(--panel2);border:1px solid var(--bd);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--bd);flex:0 0 auto}
.tab{flex:1;background:none;border:0;color:var(--mu);font:inherit;font-size:13px;padding:10px 6px;cursor:pointer;border-bottom:2px solid transparent}
.tab.on{color:var(--tx);border-bottom-color:var(--ac);background:#101b2b}
.tab b{font-variant-numeric:tabular-nums}
.panes{overflow:auto;max-height:calc(100vh - 350px);min-height:210px}
.pane{display:none;padding:10px}
.pane.on{display:block}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.piece{
  background:#152131;border:1px solid #26374f;border-radius:10px;padding:6px 4px;cursor:grab;
  display:grid;place-items:center;min-height:74px;transition:border-color .15s,background .15s,transform .1s;
  font-family:inherit;touch-action:none;
}
.piece:hover{border-color:var(--ac);background:#1a2a40}
.piece:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.piece.sel{border-color:#7FD1FF;background:#1c3452;box-shadow:0 0 0 1px #7FD1FF inset,0 0 14px -4px #7FD1FF}
.piece.shake{animation:shake .38s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.piece svg{display:block;pointer-events:none}
.piece.capPiece{min-height:0;padding:10px 4px}
.piece.capPiece .capName{font-size:14px;font-weight:700;color:#DCE9FA;letter-spacing:.5px}
.piece.capPiece:hover .capName{color:#fff}
.doneList{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#16283c;border:1px solid #27405c;border-radius:8px;padding:4px 9px;font-size:12.5px;display:flex;align-items:center;gap:6px;animation:pop .3s}
.chip em{font-style:normal;color:var(--ac);font-weight:700}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.empty{color:var(--mu);font-size:12.5px;padding:8px 2px}

/* ---------- drag ghost ---------- */
#ghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;filter:drop-shadow(0 10px 20px rgba(0,0,0,.6));will-change:transform}
#ghost svg path{fill:#2b4568;stroke:#9CCBFF;stroke-width:1.6;vector-effect:non-scaling-stroke}
#ghost .ghostCap{background:rgba(9,17,28,.96);border:1.4px solid #7FD1FF;color:#EAF3FF;border-radius:9px;padding:7px 14px;font-size:15px;font-weight:700;white-space:nowrap;box-shadow:0 10px 24px rgba(0,0,0,.55)}

/* ---------- toast ---------- */
#toast{
  position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:20;
  background:rgba(11,20,32,.94);border:1px solid var(--bd);border-radius:11px;
  padding:9px 16px;font-size:13.5px;max-width:min(560px,92%);text-align:center;
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;backdrop-filter:blur(8px);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:#2c6b58;box-shadow:0 0 26px -10px var(--ok)}
#toast.bad{border-color:#7a2b2b;box-shadow:0 0 26px -10px var(--bad)}
#toast.hint{border-color:#7a6320}
#toast b{color:#fff}

/* ---------- win ---------- */
.overlay{position:fixed;inset:0;background:rgba(6,10,16,.6);display:grid;place-items:center;z-index:80;backdrop-filter:blur(3px)}
.overlay.hidden{display:none}
.winCard{background:linear-gradient(160deg,#152234,#0e1826);border:1px solid #2c405c;border-radius:18px;padding:26px 30px;text-align:center;max-width:440px;animation:pop .35s}
.winCard h2{margin:0 0 4px;font-size:24px}
.winCard .sub{color:var(--mu);font-size:13px;margin-bottom:16px}
.winCard .big{font-size:44px;font-weight:800;color:#7FD1FF;line-height:1;font-variant-numeric:tabular-nums}
.winCard .grade{display:inline-block;margin-top:10px;padding:3px 14px;border-radius:999px;background:#1b3550;border:1px solid #35618f;font-weight:700;letter-spacing:2px}
.winCard .rows{display:flex;gap:18px;justify-content:center;margin:18px 0 20px;font-size:13px;color:var(--mu)}
.winCard .rows b{display:block;color:var(--tx);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.winCard .btns{display:flex;gap:10px;justify-content:center}
.winCard .btns button{background:var(--panel);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:9px 20px;font:inherit;font-size:14px;cursor:pointer}
.winCard .btns button.pri{background:#1c3f66;border-color:#3d6d9e;color:#fff}
.winCard .btns button:hover{border-color:var(--ac)}

@media (max-width:1080px){
  main{grid-template-columns:1fr}
  #map{max-height:none}
  .panes{max-height:300px}
  .stats{margin-left:0;width:100%}
}
</style>

/* ---------------- painting ---------------- */
function paintPath(p) {
  const e = pathEl[p.c]; if (!e) return;
  if (PRESET.has(p.c)) {                              // 固定省份：永远上色，作为底图一部分
    e.setAttribute('fill', RC[p.rg]);
    e.setAttribute('fill-opacity', .8);
    e.setAttribute('stroke', '#ffffff');
    e.setAttribute('stroke-opacity', .3);
    e.setAttribute('stroke-width', 1);
    return;
  }
  if (!inPlay(p)) {                                   // 背景省份：暗色底图，不参与本局
    e.setAttribute('fill', '#0D1724');
    e.setAttribute('fill-opacity', 1);
    e.setAttribute('stroke', 'none');
    e.setAttribute('stroke-width', 0);
    return;
  }
  if (placed.has(p.c)) {                              // 已放好
    e.setAttribute('fill', RC[p.rg]);
    e.setAttribute('fill-opacity', .84);
    e.setAttribute('stroke', '#ffffff');
    e.setAttribute('stroke-opacity', .38);
    e.setAttribute('stroke-width', 1);
    return;
  }
  const hov = hoverId === p.c;
  if (mode === 'capital') {                           // 省会模式：全部省份可见可读
    e.setAttribute('fill', hov ? '#2A4A6E' : '#1B2A3E');
    e.setAttribute('fill-opacity', 1);
    e.setAttribute('stroke', hov ? '#7FD1FF' : '#3A5175');
    e.setAttribute('stroke-opacity', 1);
    e.setAttribute('stroke-width', hov ? 2 : 1.1);
    return;
  }
  if (!outline) {                                     // 挑战模式：只留国界剪影
    e.setAttribute('fill', hov ? 'rgba(90,169,255,.20)' : 'none');
    e.setAttribute('fill-opacity', 1);
    e.setAttribute('stroke', hov ? '#5AA9FF' : 'none');
    e.setAttribute('stroke-opacity', 1);
    e.setAttribute('stroke-width', 1.7);
    return;
  }
  e.setAttribute('fill', hov ? '#25405F' : '#1A2637');
  e.setAttribute('fill-opacity', 1);
  e.setAttribute('stroke', hov ? '#5AA9FF' : '#36496B');
  e.setAttribute('stroke-opacity', 1);
  e.setAttribute('stroke-width', hov ? 1.9 : 1);
}
const paintAll = () => PROV.forEach(p => paintPath(p));

function paintMarks() {
  PROV.forEach(p => {
    const g = markGroup[p.c]; if (!g) return;
    if (PRESET.has(p.c)) {                            // 固定省份：标记只作城市点，常显上色
      g.removeAttribute('display');
      const c = markEl[p.c];
      c.setAttribute('fill', RC[p.rg]);
      c.setAttribute('fill-opacity', .95);
      c.setAttribute('stroke', '#ffffff');
      c.setAttribute('stroke-opacity', .55);
      c.setAttribute('stroke-width', 1.2);
      c.setAttribute('stroke-dasharray', 'none');
      return;
    }
    if (!inPlay(p)) { g.setAttribute('display', 'none'); return; }
    g.removeAttribute('display');
    const c = markEl[p.c];
    if (placed.has(p.c)) {
      c.setAttribute('fill', RC[p.rg]);
      c.setAttribute('fill-opacity', .95);
      c.setAttribute('stroke', '#ffffff');
      c.setAttribute('stroke-opacity', .55);
      c.setAttribute('stroke-width', 1.3);
      c.setAttribute('stroke-dasharray', 'none');
    } else if (hoverId === p.c) {
      c.setAttribute('fill', 'rgba(127,209,255,.28)');

      c.setAttribute('stroke-width', 1.8);
      c.setAttribute('stroke-dasharray', '3.5 3');

  });
}

function labelSpec(p) {
  const isPreset = PRESET.has(p.c);
  const isPlaced = isPreset || placed.has(p.c);
  const marker = p.mx != null;
  if (mode === 'capital') {
    if (!isPreset && !inPlay(p)) return null;
    let txt;
    if (!isPlaced) txt = p.s;                               // 待放：省名
    else if (p.s === p.cap) txt = p.s;                      // 直辖市/特区：只显名
    else txt = (p.w >= 92 ? p.s + ' · ' + p.cap : p.cap);   // 放好：名·省会 或 省会
    return { txt: txt, size: marker ? 11 : 12.5, dark: isPlaced && !marker, fixed: marker };
  }
  // 省份模式
  if (!isPlaced) return null;
  if (marker) return { txt: p.ab, size: 11, dark: false, fixed: true };
  if (p.w >= 30 && p.h >= 20) return { txt: p.s, sub: p.ab, size: 12.5, dark: true, fixed: false };
  return null;
}

  items.forEach(it => {
    const size = it.sp.size;
    const subSize = size - 2.5;
    const nameW = size * (it.sp.txt.length * 1.02 + .12);
    const subW = it.sp.sub ? subSize * (it.sp.sub.length * 1.08 + .1) : 0;
    const w = Math.max(nameW, subW);
    const twoLine = !!it.sp.sub;
    let bx = it.x, by = it.y;
    for (const o of OFF) {
      const x = it.x + o[0], y = Math.max(twoLine ? 16 : 12, Math.min(MAP.H - 8, it.y + o[1]));
      const r = twoLine
        ? { x1: x - w / 2, x2: x + w / 2, y1: y - size * 1.12, y2: y + subSize * 1.25 }
        : { x1: x - w / 2, x2: x + w / 2, y1: y - size * 1.07, y2: y + size * .28 };
      if (!boxes.some(b => clash(r, b))) { bx = x; by = y; break; }
    }
    const rb = twoLine
      ? { x1: bx - w / 2, x2: bx + w / 2, y1: by - size * 1.12, y2: by + subSize * 1.25 }
      : { x1: bx - w / 2, x2: bx + w / 2, y1: by - size * 1.07, y2: by + size * .28 };
    if (!boxes.some(b => clash(rb, b))) boxes.push(rb);
    const t = S('text', {
      x: bx, y: by, 'text-anchor': 'middle', 'font-size': size, 'font-weight': 700,
      'pointer-events': 'none', fill: it.sp.dark ? '#0A1524' : '#D6E8FF',
      stroke: it.sp.dark ? 'rgba(255,255,255,.6)' : 'rgba(8,14,24,.9)',
      'stroke-width': it.sp.dark ? 2.4 : 2.9, 'paint-order': 'stroke', 'stroke-linejoin': 'round'
    });
    if (twoLine) {
      const t1 = S('tspan', { x: bx, 'font-size': size, 'font-weight': 700 });
      t1.textContent = it.sp.txt;                 // 省名
      const t2 = S('tspan', { x: bx, dy: size * 1.15, 'font-size': subSize, 'font-weight': 700, opacity: .9 });
      t2.textContent = it.sp.sub;                 // 简称
      t.appendChild(t1);
      t.appendChild(t2);
    } else {
      t.textContent = it.sp.txt;
    }
    gLabel.appendChild(t);
  });
}

/* ---------------- anchor helpers ---------------- */
const anchorX = p => p.mx != null ? p.mx : (p.tx != null ? p.tx : p.cx);
const anchorY = p => p.my != null ? p.my : (p.ty != null ? p.ty : p.cy);

/* ---------------- effects ---------------- */
const easeOut = k => 1 - Math.pow(1 - k, 3);
function tween(ms, step, done) {
  const s = performance.now();
  (function f(t) { const k = Math.min(1, (t - s) / ms); step(k); k < 1 ? requestAnimationFrame(f) : (done && done()); })(s);
}
function fxRing(x, y, color, rMax) {
  const c = S('circle', { cx: x, cy: y, r: 3, fill: 'none', stroke: color, 'stroke-width': 3, 'pointer-events': 'none' });
  gFx.appendChild(c);
  tween(680, k => {
    c.setAttribute('r', (3 + (rMax - 3) * easeOut(k)).toFixed(1));
    c.setAttribute('stroke-width', (3 - 2.4 * k).toFixed(2));
    c.setAttribute('opacity', (1 - k).toFixed(3));
  }, () => c.remove());
}
function fxCross(x, y) {
  const g = S('g', { stroke: '#E24B4A', 'stroke-width': 3, 'stroke-linecap': 'round', 'pointer-events': 'none' });
  g.appendChild(S('line', { x1: x - 8, y1: y - 8, x2: x + 8, y2: y + 8 }));
  g.appendChild(S('line', { x1: x + 8, y1: y - 8, x2: x - 8, y2: y + 8 }));
  gFx.appendChild(g);
  tween(620, k => { g.setAttribute('opacity', (1 - k).toFixed(3)); g.setAttribute('transform', 'translate(' + x + ' ' + y + ') scale(' + (1 + k * .9) + ') translate(' + (-x) + ' ' + (-y) + ')'); }, () => g.remove());
}
const activeBadges = [];
function fxBadge(p) {
  const label = mode === 'capital' ? p.cap + ' · ' + p.s : p.s + ' · ' + p.ab;
  const fs = 12.5, w = label.length * fs * .95 + 18, h = 25;
  let bx = anchorX(p) - w / 2, by = anchorY(p) - 48;
  bx = Math.max(8, Math.min(MAP.W - w - 8, bx));
  by = Math.max(8, by);
  let guard = 0;
  while (activeBadges.some(b => !(bx > b.x2 || bx + w < b.x1 || by > b.y2 || by + h < b.y1)) && guard++ < 6) by -= h + 6;
  by = Math.max(8, by);
  const box = { x1: bx, x2: bx + w, y1: by, y2: by + h };
  activeBadges.push(box);

  const g = S('g', { opacity: 0, 'pointer-events': 'none' });
  g.appendChild(S('rect', { x: bx, y: by, width: w, height: h, rx: 7.5, fill: 'rgba(9,17,28,.95)', stroke: RC[p.rg], 'stroke-width': 1.3 }));
  const t = S('text', { x: bx + w / 2, y: by + h / 2 + 4.6, 'text-anchor': 'middle', 'font-size': fs, 'font-weight': 700, fill: '#EAF3FF' });
  t.textContent = label;
  g.appendChild(t);
  gFx.appendChild(g);
  const done = () => { g.remove(); const i = activeBadges.indexOf(box); if (i > -1) activeBadges.splice(i, 1); };
  tween(170, k => g.setAttribute('opacity', (k * .98).toFixed(3)), () => {
    setTimeout(() => tween(400, k => g.setAttribute('opacity', (.98 * (1 - k)).toFixed(3)), done), 2300);
  });
}

/* ---------------- sound ---------------- */
let ac = null;
function beep(ok) {
  if (!soundOn) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const t = ac.currentTime;
    const tone = (f, d, dur, type, vol) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t + d);
      g.gain.setValueAtTime(.0001, t + d);
      g.gain.exponentialRampToValueAtTime(vol, t + d + .012);
      g.gain.exponentialRampToValueAtTime(.0001, t + d + dur);
      o.connect(g); g.connect(ac.destination); o.start(t + d); o.stop(t + d + dur + .03);
    };
    if (ok) { tone(659, 0, .16, 'sine', .11); tone(880, .065, .16, 'sine', .10); tone(1319, .13, .24, 'sine', .075); }
    else { tone(233, 0, .18, 'triangle', .1); tone(155, .07, .22, 'triangle', .09); }
  } catch (e) { }
}

/* ---------------- voice (TTS) ---------------- */
function pickVoice() {
  if (ttsVoice) return ttsVoice;
  const vs = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
  // 只选「本地已安装」的中文音色：iOS 上未下载的增强音色 localService=false，选了会静音
  const zh = vs.filter(v => v.lang && v.lang.toLowerCase().indexOf('zh') === 0 && v.localService !== false);
  if (!zh.length) return null;
  // 优先女声；只排除明确男声的，最后兜底任意中文
  const FEMALE = ['ting-ting', 'mei-jia', 'xiaoxiao', 'huihui', 'yaoyao', 'yunxi', 'xiaohan', 'xiaoning', 'xiaoyi', 'yating', 'female'];
  const MALE = ['sin-ji', 'daniel', 'yunyang', 'yunjian', 'kangkang', 'liang', 'male'];
  const nm = v => (v.name || '').toLowerCase();
  ttsVoice = zh.find(v => FEMALE.some(k => nm(v).indexOf(k) > -1))
          || zh.find(v => !MALE.some(k => nm(v).indexOf(k) > -1))
          || zh[0];
  return ttsVoice;
}
function speak(text) {
  if (!voiceOn || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.rate = 0.88;   // 放慢更温柔
    u.pitch = 1.08;  // 略高、更柔和
    const v = pickVoice();
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) { }
}
function announce(p) {
  if (mode === 'capital') {
    speak(p.cap === p.s ? p.n : p.cap + '，是' + p.s + '的省会');
  } else {
    speak(p.n + '，简称' + p.ab);
  }
}

/* ---------------- toast ---------------- */
let toastTimer = null;
function toast(html, kind, ms) {
  const el = $('toast');
  el.className = 'show ' + (kind || '');
  el.innerHTML = html;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, ms || 2200);
}

/* ---------------- hit test ---------------- */
function toSvg(cx, cy) {
  const m = svg.getScreenCTM(); if (!m) return null;
  const pt = svg.createSVGPoint(); pt.x = cx; pt.y = cy;
  return pt.matrixTransform(m.inverse());
}
function resolve(x, y) {
  let best = null, bd = 1e9;
  for (const p of active) {
    if (p.mx == null) continue;
    const d = Math.hypot(p.mx - x, p.my - y);
    if (d <= p.mr && d < bd) { bd = d; best = p; }
  }
  if (best) return best;
  const pt = svg.createSVGPoint(); pt.x = x; pt.y = y;
  for (const p of active) {
    const e = pathEl[p.c];
    if (!e) continue;
    try { if (e.isPointInFill(pt)) return p; } catch (err) { }
  }
  return null;
}

/* ---------------- tray pieces ---------------- */
function pieceSVG(p) {
  const MAXW = 78, MAXH = 62;
  let s = Math.min(MAXW / p.w, MAXH / p.h);
  const mn = Math.min(p.w * s, p.h * s);
  if (mn < 20) s *= 20 / mn;
  const mx2 = Math.max(p.w * s, p.h * s);
  if (mx2 > 108) s *= 108 / mx2;
  const w = Math.max(18, p.w * s), h = Math.max(18, p.h * s);
  const sv = S('svg', { viewBox: p.x + ' ' + p.y + ' ' + p.w + ' ' + p.h, width: w.toFixed(1), height: h.toFixed(1) });
  sv.appendChild(S('path', { d: p.d, fill: '#26384f', stroke: '#6486ad', 'stroke-width': 1.5, 'vector-effect': 'non-scaling-stroke', 'stroke-linejoin': 'round' }));
  return sv;
}
function makePiece(p) {
  const b = document.createElement('button');
  b.type = 'button'; b.dataset.id = p.c;
  if (mode === 'capital') {
    b.className = 'piece capPiece';
    b.setAttribute('aria-label', '待放置省会');
    const sp = document.createElement('span');
    sp.className = 'capName';
    sp.textContent = p.cap;
    b.appendChild(sp);
  } else {
    b.className = 'piece';
    b.setAttribute('aria-label', '待放置省份');
    b.appendChild(pieceSVG(p));
  }
  if (selected && selected.c === p.c) b.classList.add('sel');
  b.addEventListener('pointerdown', ev => startDrag(ev, p, b));
  b.addEventListener('keydown', ev => {
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); setSelected(selected && selected.c === p.c ? null : p); }
  });
  return b;
}
function renderTray() {
  const grid = $('grid');
  grid.innerHTML = '';
  grid.classList.toggle('capGrid', mode === 'capital');
  order.filter(p => !placed.has(p.c)).forEach(p => grid.appendChild(makePiece(p)));

  const list = $('doneList');
  list.innerHTML = '';
  const doneArr = order.filter(p => placed.has(p.c));
  doneArr.forEach(p => {
    const d = document.createElement('div');
    d.className = 'chip';
    d.innerHTML = mode === 'capital' ? p.s + ' <em>' + p.cap + '</em>' : p.s + ' <em>' + p.ab + '</em>';
    d.title = p.n + ' · 简称' + p.ab + (p.alt ? '（又称' + p.alt + '）' : '') + ' · ' + kindTxt(p);
    list.appendChild(d);
  });
  $('doneEmpty').style.display = doneArr.length ? 'none' : 'block';
  $('tPend').textContent = active.length - placed.size;
  $('tDone').textContent = placed.size;
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

/* ---------------- selection / drag ---------------- */
function setSelected(p) {
  selected = p;
  document.querySelectorAll('.piece').forEach(el => el.classList.toggle('sel', !!p && +el.dataset.id === p.c));
  if (p) {
    toast(mode === 'capital' ? '已选中「' + p.cap + '」，点地图上它所在的省份' : '已选中一个省份，点地图上它该在的位置', 'hint', 2000);
    startTimer();
  }
}

let ghost = null;
function makeGhost(p) {
  ghost = document.createElement('div');
  ghost.id = 'ghost';
  ghost.style.transform = 'translate(-9999px,-9999px)';
  if (mode === 'capital') {
    const d = document.createElement('div');
    d.className = 'ghostCap';
    d.textContent = p.cap;
    ghost.appendChild(d);
  } else {
    ghost.appendChild(pieceSVG(p));
  }
  document.body.appendChild(ghost);
  const r = ghost.getBoundingClientRect();
  drag.gw = r.width; drag.gh = r.height;
}
function killGhost() { if (ghost) { ghost.remove(); ghost = null; } }

function startDrag(ev, p, btn) {
  if (placed.has(p.c) || finished) return;
  if (ev.button != null && ev.button !== 0) return;
  ev.preventDefault();
  startTimer();
  drag = { p: p, x0: ev.clientX, y0: ev.clientY, moved: false, gw: 0, gh: 0 };
  window.addEventListener('pointermove', onMove, { passive: false });
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
}
function onMove(ev) {
  if (!drag) return;
  const dx = ev.clientX - drag.x0, dy = ev.clientY - drag.y0;
  if (!drag.moved) {
    if (Math.hypot(dx, dy) < 7) return;
    drag.moved = true;
    makeGhost(drag.p);
    document.body.classList.add('dragging');
  }
  ev.preventDefault();
  ghost.style.transform = 'translate(' + (ev.clientX - drag.gw / 2) + 'px,' + (ev.clientY - drag.gh / 2) + 'px)';
  const pt = toSvg(ev.clientX, ev.clientY);
  const hit = pt ? resolve(pt.x, pt.y) : null;
  const id = hit ? hit.c : null;
  if (id !== hoverId) { hoverId = id; paintAll(); paintMarks(); }
}
function onUp(ev) {
  window.removeEventListener('pointermove', onMove);
  window.removeEventListener('pointerup', onUp);
  window.removeEventListener('pointercancel', onUp);
  document.body.classList.remove('dragging');
  if (!drag) return;
  const d = drag; drag = null;
  if (d.moved) {
    killGhost();
    attempt(d.p, ev.clientX, ev.clientY);
    hoverId = null; paintAll(); paintMarks();
  } else {
    setSelected(selected && selected.c === d.c ? null : d.p);
  }
}

/* ---------------- attempt ---------------- */
function missFeedback(p, hit, pt) {
  mistakes++; beep(false); fxCross(pt.x, pt.y);
  const e = pathEl[hit.c];
  if (e) {
    e.setAttribute('fill', '#5A1F26'); e.setAttribute('stroke', '#E24B4A'); e.setAttribute('stroke-opacity', 1);
    setTimeout(() => paintPath(hit), 540);
  }
  const b = document.querySelector('.piece[data-id="' + p.c + '"]');
  if (b) { b.classList.add('shake'); setTimeout(() => b.classList.remove('shake'), 420); }
  const done = placed.has(hit.c) ? '（已经放好了）' : '';
  toast(mode === 'capital'
    ? '这里是 <b>' + hit.s + '</b>' + done + '，不是「<b>' + p.cap + '</b>」的位置'
    : '这里是 <b>' + hit.s + '</b>' + done + '，再找找 <b>' + p.s + '</b> 的位置', 'bad', 2300);
  updateHUD();
}

function attempt(p, cx, cy) {
  const pt = toSvg(cx, cy);
  if (!pt) return;
  const hit = resolve(pt.x, pt.y);
  if (!hit) { beep(false); toast('这里不在中国境内，再试试～', 'bad', 1600); return; }
  if (hit.c === p.c) return success(p);
  missFeedback(p, hit, pt);
}

function success(p) {
  placed.add(p.c);
  beep(true);
  announce(p);
  fxRing(anchorX(p), anchorY(p), RC[p.rg], Math.max(34, Math.min(100, Math.max(p.w, p.h) * .8)));
  fxBadge(p);
  paintPath(p); paintMarks(); refreshLabels();
  last = p;
  $('lastGlyph').textContent = mode === 'capital' ? p.cap : p.ab;
  $('lastGlyph').style.color = RC[p.rg];
  $('lastGlyph').style.borderColor = RC[p.rg];
  $('lastGlyph').style.fontSize = mode === 'capital' ? (p.cap.length > 2 ? '13px' : '20px') : '22px';
  $('lastName').textContent = mode === 'capital' ? p.cap + '　→　' + p.n : p.n + '　简称「' + p.ab + '」';
  $('lastSub').textContent = (mode === 'capital' ? '' : (p.alt ? '又称「' + p.alt + '」 · ' : '')) + kindTxt(p) + ' · ' + p.rg;
  toast(mode === 'capital'
    ? '<b>' + p.cap + '</b>　→　' + p.n + '　·　' + kindTxt(p) + '　·　' + p.rg
    : '<b>' + p.n + '</b>　简称「' + p.ab + '」' + (p.alt ? '／' + p.alt : '') + '　·　' + kindTxt(p) + '　·　' + p.rg, 'ok', 2800);
  if (selected && selected.c === p.c) selected = null;
  renderTray(); updateHUD(); renderLegend();
  if (placed.size === active.length) win();
}

/* ---------------- hint ---------------- */
function doHint() {
  if (finished) return;
  const rest = order.filter(p => !placed.has(p.c));
  if (!rest.length) return;
  const p = selected && !placed.has(selected.c) ? selected : rest[Math.floor(Math.random() * rest.length)];
  hints++;
  const x = anchorX(p), y = anchorY(p);
  const rMax = Math.max(38, Math.min(110, Math.max(p.w, p.h) * .9));
  for (let i = 0; i < 3; i++) setTimeout(() => fxRing(x, y, '#FFD166', rMax), i * 240);
  toast(mode === 'capital'
    ? '「<b>' + p.cap + '</b>」所在的省份在闪烁的位置'
    : '「<b>' + p.s + '</b>」应该放在闪烁的位置', 'hint', 2400);
  const b = document.querySelector('.piece[data-id="' + p.c + '"]');
  if (b) { b.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); b.classList.add('sel'); setTimeout(() => b.classList.remove('sel'), 1800); }
  updateHUD();
}

/* ---------------- hud ---------------- */
const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
function startTimer() {
  if (started) return;
  started = true;
  timerId = setInterval(() => { secs++; $('sTime').textContent = fmt(secs); }, 1000);
}
function updateHUD() {
  $('sDone').textContent = placed.size + ' / ' + active.length;
  $('sMiss').textContent = mistakes;
  $('sMiss').className = mistakes ? 'warn' : '';
  $('sHint').textContent = hints;
  $('sTime').textContent = fmt(secs);
}

// 图例同时是「练习范围」筛选器
function renderLegend() {
  const box = $('legend');
  box.innerHTML = '';
  const mk = (name, color, got, total) => {
    const d = document.createElement('button');
    d.type = 'button';
    d.className = 'lg' + (filter === name ? ' act' : '') +
      (filter !== '全部' && name !== filter ? ' off' : '') +
      (total && got === total ? ' full' : '');
    d.innerHTML = '<i style="background:' + color + '"></i>' + name + ' <b>' + (total ? got + '/' + total : '—') + '</b>';
    d.title = name === '全部' ? '练习全部 34 个省级行政区' : '只练 ' + name;
    d.addEventListener('click', () => setFilter(filter === name ? '全部' : name));
    box.appendChild(d);
  };
  mk('全部', '#7FD1FF', placed.size, active.length);
  MAP.regions.forEach(r => {
    const inR = PROV.filter(p => p.rg === r);
    const on = inR.filter(p => inPlay(p));
    mk(r, RC[r], on.filter(p => placed.has(p.c)).length, on.length);
  });
}

function best() { try { return JSON.parse(localStorage.getItem('cn-puzzle-best') || 'null'); } catch (e) { return null; } }
function showBest() { const b = best(); $('sBest').textContent = b ? fmt(b.time) : '--:--'; }

/* ---------------- win ---------------- */
function win() {
  finished = true;
  clearInterval(timerId);
  const total = active.length;
  const timeBonus = Math.max(0, Math.round(total * 26.5) - secs * 3);
  const score = Math.max(0, total * 100 - mistakes * 30 - hints * 60 + timeBonus);
  const maxScore = total * 126.5;
  const ratio = maxScore ? score / maxScore : 0;
  const grade = ratio >= .93 ? 'S' : ratio >= .8 ? 'A' : ratio >= .62 ? 'B' : ratio >= .42 ? 'C' : 'D';
  $('winScore').textContent = score;
  $('winGrade').textContent = grade;
  $('winTime').textContent = fmt(secs);
  $('winMiss').textContent = mistakes;
  $('winHint').textContent = hints;
  $('winTitle').textContent = mode === 'capital' ? '🎉 省会全部对上！' : '🎉 拼图完成！';
  $('winSub').textContent = (filter === '全部' ? '' : filter + ' · ') + total + ' 个省份' +
    (mode === 'capital' ? '的省会全部就位' : '全部就位');
  if (total === 34) {
    const b = best();
    if (!b || score > b.score) { try { localStorage.setItem('cn-puzzle-best', JSON.stringify({ time: secs, score: score })); } catch (e) { } }
  }
  showBest();
  $('win').classList.remove('hidden');
  [0, 140, 280, 440].forEach(d => setTimeout(() => beep(true), d));
}

/* ---------------- scope / reset ---------------- */
function applyScope() {
  const base = filter === '全部' ? PROV.slice() : PROV.filter(p => p.rg === filter);
  active = base.filter(p => !PRESET.has(p.c));
  activeSet = new Set(active.map(p => p.c));
}
function reset() {
  applyScope();
  placed.clear(); mistakes = 0; hints = 0; secs = 0; started = false; finished = false;
  selected = null; hoverId = null; last = null;
  clearInterval(timerId); timerId = null;
  order = shuffle(active.slice());
  $('lastGlyph').textContent = '?';
  $('lastGlyph').style.color = ''; $('lastGlyph').style.borderColor = ''; $('lastGlyph').style.fontSize = '22px';
  $('lastName').textContent = mode === 'capital' ? '把省会名拖到它所在的省份' : '拖一个省份到地图上';
  $('lastSub').textContent = mode === 'capital' ? '先点选省会再点省份也可以' : '先点选省份再点地图也可以';
  $('win').classList.add('hidden');
  buildSilhouette(); paintAll(); paintMarks(); refreshLabels(); renderTray(); renderLegend(); updateHUD();
  showBest();
}
function setFilter(f) {
  if (filter === f) return;
  filter = f;
  reset();
  toast(f === '全部' ? '练习范围：全部 ' + active.length + ' 个省份'
    : '练习范围：<b>' + f + '</b>　' + active.length + ' 个省份', 'hint', 2200);
}
function setMode(m) {
  if (mode === m) return;
  mode = m;
  outline = true;
  $('btnOutline').textContent = '省界：显示';
  $('btnOutline').classList.remove('on');
  $('btnOutline').disabled = (m === 'capital');
  $('btnMode').textContent = '玩法：' + (m === 'capital' ? '省会' : '省份');
  document.body.classList.toggle('capMode', m === 'capital');
  reset();
  toast(m === 'capital'
    ? '省会挑战：把省会名拖到它所在的省份上（地图上会显示省名）'
    : '省份拼图：把省份形状拖到地图上它该在的位置', 'hint', 2800);
}

/* ---------------- events ---------------- */
$('btnMode').addEventListener('click', () => setMode(mode === 'capital' ? 'province' : 'capital'));
$('btnOutline').addEventListener('click', () => {
  outline = !outline;
  $('btnOutline').textContent = '省界：' + (outline ? '显示' : '隐藏');
  $('btnOutline').classList.toggle('on', !outline);
  buildSilhouette(); paintAll();
  toast(outline ? '已显示省界轮廓' : '挑战模式：只看国界轮廓，凭记忆拼图', 'hint', 2200);
});
$('btnHint').addEventListener('click', doHint);
$('btnShuffle').addEventListener('click', () => { order = shuffle(order); renderTray(); toast('已重新打乱', 'hint', 1200); });
$('btnSound').addEventListener('click', () => {
  soundOn = !soundOn;
  $('btnSound').textContent = '音效：' + (soundOn ? '开' : '关');
  $('btnSound').classList.toggle('on', !soundOn);
  if (soundOn) beep(true);
});
$('btnVoice').addEventListener('click', () => {
  voiceOn = !voiceOn;
  $('btnVoice').textContent = '播报：' + (voiceOn ? '开' : '关');
  $('btnVoice').classList.toggle('on', !voiceOn);
  if (voiceOn && 'speechSynthesis' in window) { pickVoice(); speak('语音播报已开启'); }
});
$('btnReset').addEventListener('click', () => { reset(); toast('重新开始', 'hint', 1400); });
$('btnAgain').addEventListener('click', () => { reset(); toast('重新开始', 'hint', 1400); });
$('btnClose').addEventListener('click', () => $('win').classList.add('hidden'));

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === 'pane-' + t.dataset.pane));
}));

// 点地图：选中后落子；或查看已放好省份的信息
svg.addEventListener('pointerdown', ev => {
  if (drag) return;
  const pt = toSvg(ev.clientX, ev.clientY); if (!pt) return;
  if (selected) {
    const p = selected;
    const hit = resolve(pt.x, pt.y);
    if (!hit) { toast('这里不在中国境内，再试试～', 'bad', 1500); return; }
    if (hit.c === p.c) { selected = null; success(p); }
    else missFeedback(p, hit, pt);
    paintMarks();
    return;
  }
  const hit = resolve(pt.x, pt.y);
  if (hit && placed.has(hit.c)) {
    toast('<b>' + hit.n + '</b>　简称「' + hit.ab + '」' + (hit.alt ? '／' + hit.alt : '') + '　·　' + kindTxt(hit) + '　·　' + hit.rg, 'ok', 2600);
  }
});

window.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') setSelected(null);
  if (ev.key === 'h' || ev.key === 'H') doHint();
  if (ev.key === 'm' || ev.key === 'M') setMode(mode === 'capital' ? 'province' : 'capital');
});

/* ---------------- go ---------------- */
// 预载语音（部分浏览器 voices 异步加载）
if ('speechSynthesis' in window) {
  try { speechSynthesis.getVoices(); } catch (e) { }
  speechSynthesis.onvoiceschanged = () => { ttsVoice = null; };
}
reset();

</script>
</body>
</html>
